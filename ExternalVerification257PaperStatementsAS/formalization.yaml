project:
  name: 'Erdős #257: independent restatements of refereed paper-linked theorems'
  description: >-
    6 theorems of the substantive development for Erdős problem #257
    restated against Mathlib alone and transported from the source declarations named
    below. The substantive formalization lives in Erdos249257.BooleanMobiusCofinalExactRows, Erdos249257.BooleanMobiusLocalRepair, Erdos249257.GreedyAchievementSet, Erdos249257.HalfCylinderConcreteSeamAdapter, Erdos249257.HalfCylinderFloorErrorReset, Erdos249257.HalfCylinderIntegerGreedy, Erdos249257.HalfCylinderSeamLimit, ErdosProblems.Erdos257.PaperCompleteR21.ExactRowDichotomyCountermodels, ErdosProblems.Erdos257.PaperCompleteR21.MersenneQuotientRowRecurrences, ErdosProblems.Erdos257.PaperCompleteR21.SeamPrefixStabilityLimit in this repository and at
    public commit f436a7ec0f7bf035828a7eec37fd29ae74d17d84 of https://github.com/wcook04/plectis-erdos. This entry is a comparison
    interface over that development. 6 statements transport by direct term
    application, which certifies definitional identity with the source statement;
    0 transport through a tactic bridge, which certifies implication only. The
    parent Erdős problem remains open.
