version: v0.4
project:
  name: 'Erdős 1049: exact rational-base contour and power-uniform irrationality exponent'
  description: For every natural a > b > 0 satisfying the exact Zudilin contour, every
    positive integral power of a/b has irrational Lambert value and irrationality
    exponent at most (1-log(b)/log(a))/(C0/C1-log(b)/log(a)). Coprimality is not assumed.
    The sufficient contour does not settle every rational base greater than one, including
    3/2. Exact native conjunction build and independent replay remain pending; no
    discovery priority or acceptance is asserted.
  authors:
  - Will Cook
  license: Apache-2.0
  responsible_maintainers:
  - Will Cook
