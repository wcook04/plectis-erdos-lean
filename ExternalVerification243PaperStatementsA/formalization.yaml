  description: >-
    30 theorems of the substantive development for Erdős problem #243
    restated against Mathlib alone and transported from the source declarations named
    below. The substantive formalization lives in ErdosProblems.Erdos243.PaperCompleteR11.CubicIntegralNormalisation, ErdosProblems.Erdos243.PaperCompleteR11.CubicRationalRoots, ErdosProblems.Erdos243.PaperCompleteR11.CubicZeroDensityShape, ErdosProblems.Erdos243.PaperCompleteR11.PrimitiveMultiplierSupply, ErdosProblems.Erdos243.PaperCompleteR20.PowerPersistence, ErdosProblems.Erdos243.PaperCompleteR21.CubicProfileGcdShape, ErdosProblems.Erdos243.PaperCompleteR21.ForbiddenBlockCrossing, ErdosProblems.Erdos243.PaperCompleteR21.NegativeMagnitudeExclusions, ErdosProblems.Erdos243.PaperCompleteR21.ProtectedEpochBarrierCount, ErdosProblems.Erdos243.PaperCompleteR21.ReducedStepLocalArithmetic, ErdosProblems.Erdos243.PaperCompleteR7.Arithmetic, ErdosProblems.Erdos243.PaperCompleteR7.Reduction, ErdosProblems.Erdos243.PaperCompleteR9.PolynomialCorrections, ErdosProblems.Erdos243.ProtectedEpochEnergy, ErdosProblems.Erdos243.ReciprocalTailRigidity in this repository and at
    public commit f436a7ec0f7bf035828a7eec37fd29ae74d17d84 of https://github.com/wcook04/plectis-erdos. This entry is a comparison
    interface over that development. 30 statements transport by direct term
    application, which certifies definitional identity with the source statement;
    0 transport through a tactic bridge, which certifies implication only. The
    parent Erdős problem remains open.
