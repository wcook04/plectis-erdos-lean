  description: >-
    13 theorems of the substantive development for Erdős problem #249
    restated against Mathlib alone and transported from the source declarations named
    below. The substantive formalization lives in Erdos249257.DiagonalFreshLossBridge, Erdos249257.FullTargetPrimeAdjunctionNoGo, Erdos249257.GcdMomentCalculus, Erdos249257.MersenneShadowCyclotomicNoncollapse, Erdos249257.RadicalMobiusShadow, Erdos249257.ResidualGaugeObstruction, ErdosProblems.Erdos249.PaperCompleteR20.MobiusSquareReduction, ErdosProblems.Erdos249.PaperCompleteR21.PrimeJumpWitnessAndMersenneChannels, ErdosProblems.Erdos249.PaperCompleteR21.ScalarLocalisationAndInversePhaseGauge, ErdosProblems.Erdos249.PaperCompleteR21.SternBrocotStoppingRecursion, ErdosProblems.Erdos249.PaperCompleteR21.TopEdgeStaircaseConditions in this repository and at
    public commit f436a7ec0f7bf035828a7eec37fd29ae74d17d84 of https://github.com/wcook04/plectis-erdos. This entry is a comparison
    interface over that development. 12 statements transport by direct term
    application, which certifies definitional identity with the source statement;
    1 transport through a tactic bridge, which certifies implication only. The
    parent Erdős problem remains open.
