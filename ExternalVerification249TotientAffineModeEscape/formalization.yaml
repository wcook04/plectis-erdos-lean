version: v0.4
project:
  name: 'Erdős #249: eventual affine endpoint exclusion'
  description: For every fixed natural offset c and integer coefficient k, the dyadically weighted totient
    block error obtained by subtracting k times (2^H - 1) cannot agree with an affine function of H at
    all sufficiently large H. The proof compares two sufficiently late primes p < q and the doubled index
    2p.
