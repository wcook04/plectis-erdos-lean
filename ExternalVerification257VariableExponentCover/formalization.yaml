version: "v0.4"

project:
  name: "Erdős #257: variable-exponent fractional-cover irrationality"
  description: >-
    Every infinite subset of a strengthened positive-cover host is irrational
    at every integer base at least two. The cover data retain variable exponents
    in (0,1], nonnegative coefficients, column summability, divisor
    majorisation, and the one-inverse-power cost. Erdős Problem 257 remains open.
  authors: ["Will Cook"]
  license: "Apache-2.0"
  responsible_maintainers: ["Will Cook"]

