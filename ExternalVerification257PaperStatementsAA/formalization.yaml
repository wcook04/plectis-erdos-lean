project:
  name: 'Erdős #257: independent restatements of refereed paper-linked theorems'
  description: >-
    50 theorems of the substantive development for Erdős problem #257
    restated against Mathlib alone and transported from the source declarations named
    below. The substantive formalization lives in Erdos249257.AdelicHeightObstruction, Erdos249257.BooleanMobiusCriticalCapacityCofinal, Erdos249257.BooleanMobiusExactRowDichotomy, Erdos249257.HalfGreedyFatalGap, Erdos249257.MaximalOmegaLayer, Erdos249257.RationalDenominatorSurvival, ErdosProblems.Erdos257.PaperCompleteR20.QuotientRowIdentity, ErdosProblems.Erdos257.PaperCompleteR21.CentredCompletionAndDecisionBoundary, ErdosProblems.Erdos257.PaperCompleteR21.DenominatorBudget, ErdosProblems.Erdos257.PaperCompleteR21.ExactRowDichotomyCountermodels, ErdosProblems.Erdos257.PaperCompleteR21.LinearChannelAndMiddleCellExclusion, ErdosProblems.Erdos257.PaperCompleteR21.PostTakeBandLocalisation, ErdosProblems.Erdos257.PaperCompleteR21.ResetSqrtEscapeHalfMembership, ErdosProblems.Erdos257.PaperCompleteR21.ScalarLocalisationHeightObstruction, ErdosProblems.Erdos257.PaperCompleteR21.SeamRowGapAndCarry, ErdosProblems.Erdos257.PaperCompleteR21.ShortWindowDivisorPhase, ErdosProblems.Erdos257.PaperCompleteR21.SkipSafetyAndDivisorZeroRuns, ErdosProblems.Erdos257.PaperCompleteR21.TruncatedRungWitnessHorizon in this repository and at
    public commit f436a7ec0f7bf035828a7eec37fd29ae74d17d84 of https://github.com/wcook04/plectis-erdos. This entry is a comparison
    interface over that development. 46 statements transport by direct term
    application, which certifies definitional identity with the source statement;
    4 transport through a tactic bridge, which certifies implication only. The
    parent Erdős problem remains open.
