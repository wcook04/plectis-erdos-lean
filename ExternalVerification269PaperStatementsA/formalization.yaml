  description: >-
    17 theorems of the substantive development for Erdős problem #269
    restated against Mathlib alone and transported from the source declarations named
    below. The substantive formalization lives in ErdosProblems.Erdos269.DyadicBlockMassIdentity, ErdosProblems.Erdos269.DyadicBlockThresholdPartition, ErdosProblems.Erdos269.PaperCompleteR20.FixedBaseRecoding, ErdosProblems.Erdos269.PaperCompleteR20.LiteralTriangle, ErdosProblems.Erdos269.PaperCompleteR20.LiteralTriangleReal, ErdosProblems.Erdos269.PaperCompleteR20.PhaseStripDecomposition, ErdosProblems.Erdos269.PaperCompleteR20.StripDecomposition, ErdosProblems.Erdos269.PaperCompleteR20.WeightedShiftArithmetic, ErdosProblems.Erdos269.PaperCompleteR20.WeightedShiftValue, ErdosProblems.Erdos269.PaperExactDenominatorR13, ErdosProblems.Erdos269.PaperR7ActualOrbit, ErdosProblems.Erdos269.PaperR7BasicAssembly, ErdosProblems.Erdos269.PaperR7ModularMinors, ErdosProblems.Erdos269.PaperR7SeriesIdentification, ErdosProblems.Erdos269.RestrictedFloorSum, ErdosProblems.Erdos269.ThreePrimeRunningLcm in this repository and at
    public commit f436a7ec0f7bf035828a7eec37fd29ae74d17d84 of https://github.com/wcook04/plectis-erdos. This entry is a comparison
    interface over that development. 15 statements transport by direct term
    application, which certifies definitional identity with the source statement;
    2 transport through a tactic bridge, which certifies implication only. The
    parent Erdős problem remains open.
