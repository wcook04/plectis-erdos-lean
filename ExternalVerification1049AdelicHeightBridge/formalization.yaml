version: v0.4
project:
  name: 'Erdős #1049: power-certificate four-jet threshold, exact first transformed
    Zudilin row, and the 2^64 < 3^41 < 2^65 bracket'
  description: >-
    Thirteen declarations are compared. The most general is a power-certificate compiler
    for the four-jet counting bound: for all natural numbers p, q, T, S, W with T
    positive, a certified binary bound 3^p < 2^q forces any family of 2qT + 2S binary
    forms to contain two distinct selectors with the same four-jet signature at bottom
    depth pT. The integer certificate 2^64 < 3^41 < 2^65 is exact in both directions,
    and the instance p = 41, q = 65 yields the threshold 130T + 2S at bottom depth 41T.
    That threshold is exactly optimal at T = 1, since 2^(129 + 2S) is strictly below the
    number of four-jet signatures. A bounded-fibre pigeonhole converts such a collision
    into an escape from the remainder nullspace whenever equal remainders occur with
    multiplicity at most k and the number of signatures times k is below the number of
    selectors. In every column l, the first transformed normalised Zudilin row
    v*_(l+1) - v*_l has order exactly l+1 and coefficient exactly -6 at that order. Two
    division-free closed forms hold for every N: six times the sum of j^2 over j < N
    equals N(N-1)(2N-1), and 2^N times the product of the transformed-row coefficients
    (j+1)^2(j+2)/2 over j < N equals (N!)^2 (N+1)!. That assembly is algebraic. It
    identifies no formal power-series determinant with these data, and it establishes no
    all-rank normalised-Hankel order or leading-coefficient theorem. Uniformly over the
    admissible rectangular Hermite–Padé exponent cone, meaning every rho ≥ 0 and every
    sigma ≥ 1 + rho, the achievable threshold stays more than 3/13 below
    log 2 / log 3, so no exponent choice in that cone buys enough decay for the
    coefficient growth it pays. The cubic Hankel determinant accumulates a raw
    denominator power 4N^3 - 3N^2, of which more than 39/41 must be cleared because the
    surviving charge threshold (log 3 / log 2 - 1)/3 lies below 8/41, and three
    producers fail that requirement for every admissible N: the source scalar content of
    degree at most N^3 - N, the scalar content together with the universally forced
    first-order residual border of combined degree at most 2N^3 - N, and the positive
    scalar ray C1 ≥ 2 C0, which misses by the fixed relative margin 17/41. For anyone
    building Hermite–Padé or q-Apéry approximations to the Lambert value at 3/2, the
    consequence is that a successful family must carry cancellation absent from the
    scalar and border models, and that reaching the nullspace escape by this counting
    route needs at least 130 + 2S forms at bottom depth 41. The ancestry is the
    classical rectangular Hermite–Padé threshold, and priority for these certificates is
    unassessed. Transformed rows j ≥ 2, the all-rank normalised-Hankel order and
    leading-coefficient theorem, the construction of an approximation family, a
    remainder-fibre bound for one, analytic decay, and irrationality at 3/2 lie outside
    this module and outside these thirteen declarations.
