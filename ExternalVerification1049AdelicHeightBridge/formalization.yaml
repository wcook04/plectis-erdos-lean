    closed forms, and arithmetic exclusions plus the finite escape interface at 3/2.
    Transformed rows j>=2, the full all-rank normalized-Hankel equality, an
    approximation family, an actual remainder-fibre bound, analytic decay, and
    irrationality remain outside this Comparator claim.
