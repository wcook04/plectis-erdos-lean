version: v0.4
project:
  name: 'Erdős #251: independent restatements of refereed paper-linked theorems'
  description: >-
    18 theorems of the substantive development for Erdős problem #251
    restated against Mathlib alone and transported from the source declarations named
    below. The substantive formalization lives in ErdosProblems.Erdos251.PaperCoreR7, ErdosProblems.Erdos251.PrimeGapDyadicTail, ErdosProblems.Erdos251.RealPrimeGapTail in this repository and at
    public commit f436a7ec0f7bf035828a7eec37fd29ae74d17d84 of https://github.com/wcook04/plectis-erdos. This entry is a comparison
    interface over that development. 18 statements transport by direct term
    application, which certifies definitional identity with the source statement;
    0 transport through a tactic bridge, which certifies implication only. The
    parent Erdős problem remains open.
  authors:
  - Will Cook
  license: Apache-2.0
  responsible_maintainers:
  - Will Cook
