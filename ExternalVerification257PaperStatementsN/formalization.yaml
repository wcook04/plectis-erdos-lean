project:
  name: 'Erdős #257: independent restatements of refereed paper-linked theorems'
  description: >-
    20 theorems of the substantive development for Erdős problem #257
    restated against Mathlib alone and transported from the source declarations named
    below. The substantive formalization lives in Erdos249257.BooleanMobiusSkipRowCofinal, Erdos249257.CertificateKernel, Erdos249257.DyadicPrefixCompression, Erdos249257.GenericTailOrbitRigidity, Erdos249257.GreedyAchievementSet, Erdos249257.HalfCarryReachability, Erdos249257.HalfCylinderFiniteShadow, Erdos249257.TerminalOnlyCofinal, ErdosProblems.Erdos257.PaperCompleteR21.CentredCompletionAndDecisionBoundary, ErdosProblems.Erdos257.PaperCompleteR21.EventualNonnegativeMargin, ErdosProblems.Erdos257.PaperCompleteR21.GreedyGapCriteria, ErdosProblems.Erdos257.PaperCompleteR21.GreedyOrbitNoTies, ErdosProblems.Erdos257.PaperCompleteR21.SquareDepthAndHalfMembershipEquivalences in this repository and at
    public commit f436a7ec0f7bf035828a7eec37fd29ae74d17d84 of https://github.com/wcook04/plectis-erdos. This entry is a comparison
    interface over that development. 20 statements transport by direct term
    application, which certifies definitional identity with the source statement;
    0 transport through a tactic bridge, which certifies implication only. The
    parent Erdős problem remains open.
