version: v0.4
project:
  name: 'Erdős #243: exclusion of eventually periodic negative-magnitude orbits'
  description: 'Clearing denominators in the rational case of Erdős Problem 243 produces
    an exact integer orbit: multipliers a n at least 2 drive D(n+1) = a n D n and
    C(n+1) = C n + e n, where e n is the magnitude of a negative Sylvester-centred
    error tied to the state by D n + e n = (a n - 1) C n. Eventual periodicity of
    that magnitude sequence, with a fixed positive drift M gained over one period,
    is the natural way such an orbit could carry a rational value, since a repeating
    error pattern is the discrete analogue of a repeating expansion. The strongest
    theorem is that this is impossible: for every offset N, every period h > 0 and
    every positive drift M, positivity and e n < a n on the tail, together with the
    exact recurrence and the shape equation, are contradictory. Two further theorems
    give the same exclusion for genuinely periodic orbits at every common scale and
    for the phase-primitive case, so the whole eventually periodic negative-magnitude
    family is closed with no residual period, offset, drift or scale, which removes
    the first construction an irrationality specialist would attempt for this dynamics.
    The mechanism is prime propagation: a prime occurring in two multiplier states
    divides every later denominator, tail and magnitude, so periodicity carries any
    prime divisor of the drift back through all phases and a finite pigeonhole closes
    the phase-primitive case, while if primitivity fails the shared prime divides
    the whole orbit, dividing it out strictly decreases the positive drift, and strong
    induction returns to the primitive case. The ingredients are elementary prime
    divisibility and pigeonhole, and the novelty of the family is unassessed. The
    exact recurrence, the positive drift, the periodicity and the bound e n < a n
    are hypotheses here, orbits that are aperiodic or that change sign lie outside
    every statement, and Erdős Problem 243 remains open.'
  authors:
  - Will Cook
  responsible_maintainers:
  - Will Cook
  license: Apache-2.0
