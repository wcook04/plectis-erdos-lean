version: v0.4
project:
  name: 'Erdős #68: a three-halves lower growth bound for factorial-gap common denominators'
  description: For L(N) = lcm of n! - 1 over 2 ≤ n ≤ N, the lower limit of log L(N) divided by N^(3/2)
    log N is at least 2 sqrt(2) / 3. The interface includes the eventual lower-bound form and a literal
    extended-real liminf, allowing an infinite liminf without any extra boundedness assumption.
