version: "v0.4"

project:
  name: "Erdős #257: four-ninths square-root repair windows"
  description: >-
    A natural sequence in the square-root strip cannot strictly increase through
    a window of length 2*sqrt(K)+12. Specialising to the 4/9 greedy defect gives
    exact equivalences between membership of 4/9 in the Mersenne achievement
    set, cofinal one-step repairs, and a repair in every explicit square-root
    window. One certified window of strict increases excludes the target. These
    are target-specific equivalences, not a proof that the repair producer
    holds, and not the tetraprime 4/9 package. Erdős Problem 257 remains open.
  authors: ["Will Cook"]
  license: "Apache-2.0"
  responsible_maintainers: ["Will Cook"]

