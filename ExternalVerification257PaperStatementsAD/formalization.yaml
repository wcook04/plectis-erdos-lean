version: v0.4
project:
  name: 'Erdős #257: independent restatements of refereed paper-linked theorems'
  description: >-
    32 theorems of the substantive development for Erdős problem #257
    restated against Mathlib alone and transported from the source declarations named
    below. The substantive formalization lives in Erdos249257.BooleanMobiusCriticalCapacityGeometric, Erdos249257.BooleanMobiusExactRowRankTwo, Erdos249257.BooleanMobiusExactTransition, Erdos249257.BooleanMobiusLocalRepair, Erdos249257.HalfCylinderConcreteSeamAdapter, Erdos249257.HalfCylinderIntegerGreedy, Erdos249257.MersenneShadowCyclotomicNoncollapse, Erdos249257.MersenneShadowDenominatorGrowth, Erdos249257.RadicalMobiusShadow, ErdosProblems.Erdos257.PaperCompleteR21.MersenneChannelSurvivalAllHeights, ErdosProblems.Erdos257.PaperCompleteR21.OddReciprocalDenominators, ErdosProblems.Erdos257.PaperCompleteR21.ThreeBranchRowDynamics in this repository and at
    public commit f436a7ec0f7bf035828a7eec37fd29ae74d17d84 of https://github.com/wcook04/plectis-erdos. This entry is a comparison
    interface over that development. 28 statements transport by direct term
    application, which certifies definitional identity with the source statement;
    4 transport through a tactic bridge, which certifies implication only. The
    parent Erdős problem remains open.
  authors:
  - Will Cook
  license: Apache-2.0
  responsible_maintainers:
  - Will Cook
