  name: 'Erdős #249: independent restatements of refereed paper-linked theorems'
  description: >-
    44 theorems of the substantive development for Erdős problem #249
    restated against Mathlib alone and transported from the source declarations named
    below. The substantive formalization lives in Erdos249257.CarrySurvivorExtinction, Erdos249257.DiagonalFreshLossBridge, Erdos249257.FirstHarmonicPivot, Erdos249257.JointExponentTransport, Erdos249257.LcmConeNonflat, Erdos249257.MersenneShadowCyclotomicNoncollapse, Erdos249257.TotientActualLcmOrbitNonintegrality, Erdos249257.TotientActualLcmOrbitSeparation, Erdos249257.TotientActualLcmTopEdgeStaircase, Erdos249257.TotientTailPeriodKiller, ErdosProblems.Erdos249.PaperCompleteR20.FiniteGridCorrespondence, ErdosProblems.Erdos249.PaperCompleteR20.SpecifiedTailPeriod, ErdosProblems.Erdos249.PaperCompleteR21.ActualLcmDiagonalConditions, ErdosProblems.Erdos249.PaperCompleteR21.ActualLcmSeparationAndSign, ErdosProblems.Erdos249.PaperCompleteR21.AffineDivisorAnnihilation, ErdosProblems.Erdos249.PaperCompleteR21.LcmJumpPositionsAndCentralSlack, ErdosProblems.Erdos249.PaperCompleteR21.PhaseEnergyAndForeignResidueProjection, ErdosProblems.Erdos249.PaperCompleteR21.PrimeJumpWitnessAndMersenneChannels, ErdosProblems.Erdos249.PaperCompleteR21.TemperedOrbitAndSquaredMersenneTail, ErdosProblems.Erdos249.PaperCompleteR21.TopEdgeChainPaperBand, ErdosProblems.Erdos249.PaperCompleteR21.TopEdgeCorridorAndSeparation, ErdosProblems.Erdos249.PaperCompleteR21.TopEdgeStaircaseConditions in this repository and at
    public commit f436a7ec0f7bf035828a7eec37fd29ae74d17d84 of https://github.com/wcook04/plectis-erdos. This entry is a comparison
    interface over that development. 44 statements transport by direct term
    application, which certifies definitional identity with the source statement;
    0 transport through a tactic bridge, which certifies implication only. The
    parent Erdős problem remains open.
