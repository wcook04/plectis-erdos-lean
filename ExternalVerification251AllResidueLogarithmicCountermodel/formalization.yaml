version: v0.4
project:
  name: 'Erdős #251: an every-residue logarithmic rational countermodel'
  description: There exists a synthetic positive even integer word with digits at most 4 log(n+1)+24,
    unbounded and not eventually periodic, containing both 2 and 4 arbitrarily late in every residue class.
    Its cumulative positions are strictly increasing, odd, and asymptotic to n log n. Its dyadic series
    nevertheless has exact value 6, every scaled tail is integral, and every fixed difference of scaled
    tails is integral. All these properties belong to the same existential construction.
  authors:
  - Will Cook
  license: Apache-2.0
  responsible_maintainers:
