version: v0.4
project:
  name: 'Erdős 249: countable rational independence of dilated least-residue values'
  description: For every fixed modulus m >= 3 and integer base B >= 2, the family consisting
    of 1 and sum_{n>=1} (phi(n) mod m)/B^(d*n) for every positive dilation d is linearly independent
    over Q. This bounded-residue theorem does not decide the unreduced Erdős 249 parent. This
    is prepared metadata; exact public-source build, Comparator replay and human review remain
    pending.
  authors:
  - Will Cook
  license: Apache-2.0
  responsible_maintainers:
  - Will Cook
