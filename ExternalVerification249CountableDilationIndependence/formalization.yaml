- title: On arithmetical properties of Lambert series
  authors:
  - Paul Erdős
  type: paper
  relationship: background
  note: Journal of the Indian Mathematical Society 12 (1948). Supplies the isolated digit-block
    separation mechanism reused by the residue-class irrationality theorems; no statement
    about the sum of phi(n)/2^n is taken from it.
  license: unknown
  author_endorsement: n/a
- title: 'Answer 1211557 to: An infinite sum based on the mod-parity of Euler''s totient function'
  authors:
  - Erick Wong
  id: https://math.stackexchange.com/a/1211557
  type: web discussion
  relationship: background
  note: Wong proved least-residue irrationality for matched denominator base and modulus k
    > 2 (29 March 2015). The endpoint here concerns countable rational independence across
    positive dilations at every integer base B >= 2; it is not inferred from that result.
  license: unknown
  author_endorsement: not-contacted
- title: Refinement of the Chowla–Erdős method and linear independence of certain Lambert
    series
  authors:
  - Daniel Duverney
  - Yohei Tachiya
  id: https://doi.org/10.1515/forum-2018-0299
  type: paper
  relationship: background
  note: Forum Mathematicum 31 (2019), 1557–1566. Published joint-dilation and least-dilation
    separation mechanism; the residue-observable endpoint here requires its own exact argument.
    No priority claim is made.
  license: unknown
  author_endorsement: not-contacted
