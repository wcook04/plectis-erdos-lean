version: "v0.4"

project:
  name: "Erdős #257: divisibility-weighted support irrationality"
  description: >-
    A finite prime-weighted cost on an infinite support excluding zero forces
    irrationality of the reciprocal-Mersenne series at that base, and a finite
    binary weighted cost on a host forces all-base hereditary irrationality of
    every infinite subset. This is the long-record weighted claim. It does not
    decide every infinite support. Erdős Problem 257 remains open.
  authors: ["Will Cook"]
  license: "Apache-2.0"
  responsible_maintainers: ["Will Cook"]

