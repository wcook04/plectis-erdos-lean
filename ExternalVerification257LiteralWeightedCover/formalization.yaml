version: "v0.4"

project:
  name: "Erdős #257: literal weighted-cover separation"
  description: >-
    There is an infinite weighted host that satisfies the literal finite-prime
    weighted criterion, fails reciprocal summability, fails the strengthened
    positive-cover predicate, and lies outside every logarithmic-budget cover,
    while every infinite subset is irrational at every integer base at least
    two. The same host can still be synchronised with any actual
    strengthened-cover host. Neither statement assumes that a cover host
    exists. Erdős Problem 257 remains open.
  authors: ["Will Cook"]
  license: "Apache-2.0"
  responsible_maintainers: ["Will Cook"]

