version: v0.4
project:
  name: 'Erdős #243: the Sylvester recurrence from a bounded original-coordinate product defect'
  description: A strictly increasing positive integer sequence with rational reciprocal sum and a(n+1)/a(n)^2
    tending to one satisfies the eventual Sylvester recurrence a(n+1) = a(n)^2 - a(n) + 1 when its original-coordinate
    product defect P(n)/a(n) * (a(n)^2/a(n+1) - 1) is eventually bounded above. Here P(n) is the product
    of the preceding terms. The rationality and growth hypotheses supply the canonical integer state used
    in the proof.
  authors:
  - Will Cook
  license: Apache-2.0
  responsible_maintainers:
  - Will Cook
