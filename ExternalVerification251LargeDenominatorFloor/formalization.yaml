version: v0.4
project:
  name: 'Erdős #251: the paper denominator exclusion at 2^39997'
  description: >-
    If either the prime series sum p_n/2^(n+1) or the prime-gap series
    sum (p_(n+1)-p_n)/2^(n+1) equals a/b with a an integer and b a positive
    natural number, then 2^39997 <= b and 10^12040 < b. Here p_n is the
    zero-based enumeration of the primes. The proof transports the paper's
    exact endpoint through a finite certificate with 80,200 primes below
    1,023,068. Two Farey neighbours strictly enclose the analytic interval;
    their determinant is one, so every rational in that interval has
    denominator at least the sum of their denominators. The certificate's
    stronger bounds 2^40062 and 10^12059 imply the printed bounds. This is a
    finite denominator exclusion, compatible with rationality of both series.
    It does not decide Erdős Problem 251 or give an irrationality measure.
  authors:
  - Will Cook
  license: Apache-2.0
  responsible_maintainers:
