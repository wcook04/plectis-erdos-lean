  description: >-
    5 theorems of the substantive development for Erdős problem #257
    restated against Mathlib alone and transported from the source declarations named
    below. The substantive formalization lives in Erdos249257.CertificateKernel, Erdos249257.GenericTailOrbitRigidity, Erdos249257.HalfCarryReachability, Erdos249257.HalfCarryRewindPhase, Erdos249257.HalfCarrySelectedWindow, Erdos249257.SelectedSuffixCylinder, Erdos249257.SuffixCylinderInStrip, Erdos249257.SuffixCylinderTerminalOnlyBridge, Erdos249257.SuffixCylinderThreshold, Erdos249257.TerminalOnlyCofinal, ErdosProblems.Erdos257.PaperCompleteR21.FeedbackRowStripWitnessAllDepths in this repository and at
    public commit f436a7ec0f7bf035828a7eec37fd29ae74d17d84 of https://github.com/wcook04/plectis-erdos. This entry is a comparison
    interface over that development. 0 statements transport by direct term
    application, which certifies definitional identity with the source statement;
    5 transport through a tactic bridge, which certifies implication only. The
    parent Erdős problem remains open.
