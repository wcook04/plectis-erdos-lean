project:
  name: 'Erdős #243: independent restatements of refereed paper-linked theorems'
  description: >-
    4 theorems of the substantive development for Erdős problem #243
    restated against Mathlib alone and transported from the source declarations named
    below. The substantive formalization lives in ErdosProblems.Erdos243.PaperCompleteR11.CubicIntegralNormalisation, ErdosProblems.Erdos243.PaperCompleteR11.CubicZeroDensityShape, ErdosProblems.Erdos243.PaperCompleteR21.CubicRateExclusionChain, ErdosProblems.Erdos243.PaperCompleteR21.SquareSpecialisationUnconditional, ErdosProblems.Erdos243.PaperCompleteR9.PolynomialCorrections in this repository and at
    public commit a25cb360bef8dd818dde14b5fb752244304af354 of https://github.com/wcook04/plectis-erdos. This entry is a comparison
    interface over that development. 4 statements transport by direct term
    application, which certifies definitional identity with the source statement;
    0 transport through a tactic bridge, which certifies implication only. The
    parent Erdős problem remains open.
