project:
  name: 'Erdős #249: independent restatements of refereed paper-linked theorems'
  description: >-
    10 theorems of the substantive development for Erdős problem #249
    restated against Mathlib alone and transported from the source declarations named
    below. The substantive formalization lives in Erdos249257.CarrySurvivorExtinction, Erdos249257.FirstHarmonicPivot, Erdos249257.LcmConeFlatness, Erdos249257.PivotAntiReconstruction, Erdos249257.TotientTailPeriodKiller in this repository and at
    public commit f436a7ec0f7bf035828a7eec37fd29ae74d17d84 of https://github.com/wcook04/plectis-erdos. This entry is a comparison
    interface over that development. 10 statements transport by direct term
    application, which certifies definitional identity with the source statement;
    0 transport through a tactic bridge, which certifies implication only. The
    parent Erdős problem remains open.
