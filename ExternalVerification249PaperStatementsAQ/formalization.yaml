  description: >-
    8 theorems of the substantive development for Erdős problem #249
    restated against Mathlib alone and transported from the source declarations named
    below. The substantive formalization lives in Erdos249257.CyclotomicProjectionOfShadow, Erdos249257.RadicalMobiusShadow, Erdos249257.RepunitMobiusNumerator, ErdosProblems.Erdos249.PaperCompleteR20.NumeratorEvaluation, ErdosProblems.Erdos249.PaperCompleteR20.RadicalDecomposition, ErdosProblems.Erdos249.PaperCompleteR21.DivisorChannelSplitAndSeamDoubling, ErdosProblems.Erdos249.PaperCompleteR21.NumeratorPolynomialAndMersenneRemainder in this repository and at
    public commit f436a7ec0f7bf035828a7eec37fd29ae74d17d84 of https://github.com/wcook04/plectis-erdos. This entry is a comparison
    interface over that development. 8 statements transport by direct term
    application, which certifies definitional identity with the source statement;
    0 transport through a tactic bridge, which certifies implication only. The
    parent Erdős problem remains open.
