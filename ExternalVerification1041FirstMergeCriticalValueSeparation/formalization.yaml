version: v0.4
project:
  name: 'Erdős #1041: exact all-degree critical-value separation thresholds and a
    sign-free first-merge length bound'
  description: 'Write S for the normalized distance separating the remaining critical
    values from a simple saddle, and set C(n, S) = (1 + S)^(2/n) log(S / (S - 1)).
    This configuration verifies in Lean three exact all-degree threshold inequalities
    and one general consumer, and only those. For every integer n at least 3, C(n,
    4) < 1. For every integer n at least 4, C(n, 3) < 1. For every integer n at least
    6, C(n, 2) < 1. For every degree n and all real S and length, if length squared
    is at most 4 C(n, S) and C(n, S) < 1, then length is strictly below 2, with no
    positivity or sign hypothesis on the length. Composed with the ordinary analytic
    estimate of the companion paper, which bounds the canonical connector at a simple
    saddle by 2 (1 + S)^(1/n) sqrt(log(S / (S - 1))) once every other critical value
    sits at normalized distance at least S, the three thresholds settle the separation
    radii 4, 3 and 2 completely: at each of those radii the first merge is forced
    strictly below the constant 2 in every degree from the stated cutoff upward, with
    no upper bound on the degree and no further hypothesis on the root configuration.
    Every cutoff is the first degree at which its inequality holds, since C(2, 4)
    exceeds 1.43, C(3, 3) exceeds 1.02 and C(5, 2) exceeds 1.07, so each of the three
    statements is sharp in the degree. Radius two is the tight case, where C(6, 2)
    equals 0.99969 to five places. What makes an infinite family of transcendental
    inequalities finite is that C(n, S) is antitone in the degree for every S greater
    than 1, because the exponent 2/n decreases while the base 1 + S exceeds 1, so
    a single base-degree inequality propagates to every larger degree; each base case
    then reduces to an exact rational comparison, 5^(2/3) < 3 by cubing, 4^(2/4) =
    2, and (3^(2/6))^3 = 3 with 3 (0.6931471808)^3 < 1, closed with log x < x - 1
    and the nine-digit rational upper bound on log 2. The audience is complex analysts
    working on lemniscate connectivity and the geometry of polynomial sublevel sets,
    and readers of Newton-flow saddle-connection geometry. The elementary logarithm
    bound and the Pólya area-capacity inequality are classical ancestry, a bounded
    search found no earlier statement of these coefficient thresholds, and priority
    is unresolved. The analytic continuation of the square-resolved inverse branch,
    its univalence, the area formula and the Pólya inequality that together produce
    the squared connector bound are ordinary proofs in the companion paper rather
    than Lean-checked conclusions, the near-tie and simultaneous multiple-saddle configurations
    remain untouched, and the unrestricted Erdős Problem 1041 is not decided here.'
