version: v0.4
project:
  name: 'Erdős #269: actual dyadic shell orbit, exact recurrence and integral-or-far
    escape'
  description: 'The normalized state of the genuine infinite dyadic-shell tail of
    the literal 2,3,5-smooth running-height series either equals an integer at some
    scale, or for every index there is a later scale at which the state lies at distance
    at least 1/31 from every integer. At every scale the state satisfies the exact
    ordered affine recurrence T(a+1) = b(a) T(a) - d(a) with the actual radix and
    the actual ordered digit: b(a) is 2 multiplied by 3 when a pure power of 3 lies
    strictly inside the shell from 2^a to 2^(a+1) and by 5 when a pure power of 5
    lies strictly inside it, and d(a) is the shell cardinality corrected by the two
    threshold counts of shell points below the new 3-power and 5-power thresholds,
    weighted 10 and 4 or 2 and 12 according to which odd threshold comes first. The
    shell masses themselves are summable, where the mass of the shell from 2^a to
    2^(a+1) is the sum, over the 2,3,5-smooth lattice points in that shell, of the
    reciprocal of the product of the largest powers of 2, 3, and 5 not exceeding the
    point. Summability makes the tail the genuine infinite sum of the masses from
    scale a onward, and the state at scale a is half the product of the largest powers
    of 2, 3, and 5 not exceeding 2^a, multiplied by that tail. The exact-integral
    branch survives. The theorem supplies no irrationality, transcendence, equidistribution,
    or density statement, priority for the argument has not been assessed, and Erdős
    Problem 269 remains open.'
  authors:
  - Will Cook
  license: Apache-2.0
  responsible_maintainers:
  - Will Cook
