name: Formal Conjectures receiving identity

on:
  push:
    branches: [codex/fc249-current-receiving-identity]
  workflow_dispatch:
    inputs:
      unit:
        description: Exact receiving declaration to compare
        required: true
        default: '6579'
        type: choice
        options: ['6579', '6576', '6577', '6527', '6523-cubic', '6523-product', '6528-finite', '6528-mixed', '6529', '6780', '6971-257', '6971-1049', '6971-258', '6971-1041', '243-nonintegral', '249-mixed', '269-kernel', '68-liminf', '1049-order-coeff']
      receiving_commit:
        description: Full FC SHA; required for unsubmitted candidates, optional for existing requests
        required: false
        type: string
      source_commit:
        description: Full source SHA, equal to selected workflow ref
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify actual FC receiving identity
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      UNIT: ${{ inputs.unit || '6579' }}
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_INPUT: ${{ inputs.source_commit }}
      RECEIVING_INPUT: ${{ inputs.receiving_commit }}
      GOTOOLCHAIN: go1.24.0
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Bind candidate to workflow event
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$SOURCE_INPUT" = "$SOURCE_SHA"
          fi
      - name: Install versioned compiler bootstrap
        run: |
          set -euo pipefail
          # Elan release is versioned; the verifier/compiler revisions used below
          # are additionally bound in the native artifact and checked at runtime.
          curl -fsSL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/elan.tar.gz"
          echo "f81c2e48c1588d4612cd2c8851947898a45ac8d72748a07dff3a5694f1cf589b  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/elan-install"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan-install"
          "$RUNNER_TEMP/elan-install/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.90.0 --profile minimal
      - name: Compare actual FC declaration with candidate
        run: |
          set -euo pipefail
          python3 scripts/fc_receiving_identity.py \
            --source "$GITHUB_WORKSPACE" \
            --source-commit "$SOURCE_SHA" \
            --unit "$UNIT" \
            --receiving-commit "$RECEIVING_INPUT" \
            --work "$RUNNER_TEMP/fc-receiving-verifier" \
            --output "$RUNNER_TEMP/fc-receiving-artifacts"
      - name: Upload authenticated receiving identity
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fc-receiving-identity-${{ env.UNIT }}
          path: |
            ${{ runner.temp }}/fc-receiving-artifacts/report.json
            ${{ runner.temp }}/fc-receiving-artifacts/challenge.export
            ${{ runner.temp }}/fc-receiving-artifacts/solution.export
          if-no-files-found: error
          retention-days: 90
      - name: Upload receiving source and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fc-receiving-identity-diagnostics-${{ env.UNIT }}
          path: ${{ runner.temp }}/fc-receiving-artifacts
          if-no-files-found: error
          retention-days: 90
