name: Release tooling

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test release enumeration and snapshot scanning
        run: python3 scripts/test_release_tools.py
      - name: Build the declared release manifest
        run: >-
          python3 scripts/build_release_manifest.py
          --out "${{ runner.temp }}/release-manifest.json"
          --sums-out "${{ runner.temp }}/SHA256SUMS"
