name: Release tooling

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Pinned rather than tracking `ubuntu-latest`, so the October 2026 migration of
    # that label cannot change the release environment without a commit here.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Admit release tooling for this candidate
        env:
          RELEASE_DIAGNOSTICS: ${{ runner.temp }}/release-tools
        run: |
          python3 scripts/build_release_manifest.py --check-tooling \
            --out "$RELEASE_DIAGNOSTICS/release-manifest.json" \
            --sums-out "$RELEASE_DIAGNOSTICS/SHA256SUMS" \
            --diagnostics "$RELEASE_DIAGNOSTICS/diagnostics.json"
      - name: Retain release admission diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tooling-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-tools/
          if-no-files-found: warn
