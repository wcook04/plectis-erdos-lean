name: Release tooling

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Pinned rather than tracking `ubuntu-latest`, so the October 2026 migration of
    # that label cannot change the release environment without a commit here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test release enumeration and snapshot scanning
        run: python3 scripts/test_release_tools.py
      - name: Test the replay's entry verification unit and shard scheduler
        # The decisive assertion inside is that a single-entry shard and an N-entry shard
        # write byte-identical result files for the same entry, which is the only reason
        # the sharded replay may be trusted to say what per-entry jobs said.
        run: python3 scripts/test_palomar_replay_shard.py
      - name: Build the declared release manifest
        run: >-
          python3 scripts/build_release_manifest.py
          --out "${{ runner.temp }}/release-manifest.json"
          --sums-out "${{ runner.temp }}/SHA256SUMS"
