name: Lean Convenience

# Developer convenience workflow only. This is not a release gate.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add swap for heavy launch-closure builds
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
      - uses: leanprover/lean-action@v1
        env:
          # Cap per-process Lean threads; the launch closure now includes
          # AdelicHeightBridge and FactorialZeroPlateau together.
          LEAN_NUM_THREADS: "1"
        with:
          use-mathlib-cache: auto
          build: true
