name: Lean Convenience

# Developer convenience workflow only. This is not a release gate.
on:
  push:
  pull_request:

permissions:
  contents: read

# One push supersedes the previous one. This job builds the whole default-target
# closure and takes about 1h50m; on 21 Sep 2026 three pushes 30 seconds apart
# (d75ed4c, c0b92c4, 56408ca) each ran a full build to completion. Only the newest
# ref state is of interest here, and this workflow is not a release gate, so an
# in-flight run for an older commit on the same ref is cancelled. The Comparator
# replay deliberately has no such rule: its runs produce the per-entry receipts a
# consumer harvests, and cancelling one would destroy that evidence.
concurrency:
  group: lean-convenience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned rather than `ubuntu-latest`, so the October 2026 migration of that
    # label cannot change the build environment without a commit here.
    runs-on: ubuntu-24.04
    # The observed whole-closure build is 1h49m (run 35643815443). 240 leaves better
    # than double that headroom while still bounding a runaway below the 6h default.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: auto
          build: false
      - name: Build launch entries sequentially
        env:
          LEAN_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import subprocess

          text = open("lakefile.toml", encoding="utf-8").read()
          match = re.search(r'defaultTargets\s*=\s*\[(.*?)\]', text, re.S)
          if not match:
              raise SystemExit("defaultTargets not found in lakefile.toml")
          targets = re.findall(r'"([^"]+)"', match.group(1))
          for target in targets:
              print(f"=== lake build {target} ===", flush=True)
              subprocess.run(["lake", "build", target], check=True)
          PY
