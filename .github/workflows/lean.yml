name: Lean Convenience

# Developer convenience workflow only. This is not a release gate.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: auto
          build: false
      - name: Build launch entries sequentially
        env:
          LEAN_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import subprocess

          text = open("lakefile.toml", encoding="utf-8").read()
          match = re.search(r'defaultTargets\s*=\s*\[(.*?)\]', text, re.S)
          if not match:
              raise SystemExit("defaultTargets not found in lakefile.toml")
          targets = re.findall(r'"([^"]+)"', match.group(1))
          for target in targets:
              print(f"=== lake build {target} ===", flush=True)
              subprocess.run(["lake", "build", target], check=True)
          PY
