name: Lean Release Gate

# Release-gate workflow. All third-party actions are pinned by full commit SHA.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  # A release is cut by pushing a tag, and until this trigger existed the gate had
  # never run on one: pull_request and workflow_dispatch alone meant a tag could be
  # published with only the convenience workflow behind it.
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    # Pinned rather than tracking `ubuntu-latest`, so the October 2026 migration of
    # that label cannot change the release environment without a commit here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          use-mathlib-cache: auto
          build: false
          test: false
          lint: false
      - name: Build launch entries sequentially
        env:
          LEAN_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import subprocess

          text = open("lakefile.toml", encoding="utf-8").read()
          match = re.search(r'defaultTargets\s*=\s*\[(.*?)\]', text, re.S)
          if not match:
              raise SystemExit("defaultTargets not found in lakefile.toml")
          targets = re.findall(r'"([^"]+)"', match.group(1))
          for target in targets:
              print(f"=== lake build {target} ===", flush=True)
              subprocess.run(["lake", "build", target], check=True)
          PY
      - name: Audit every publication entry's Solution environment
        run: |
          mkdir -p artifacts
          python3 scripts/check_axiom_budget.py --run-palomar --json > artifacts/palomar-axiom-audit.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: palomar-publication-audit
          path: artifacts/palomar-axiom-audit.json
