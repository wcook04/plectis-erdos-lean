name: Lean Release Gate

# Every launch target and the publication audit must produce a source-bound receipt.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.coverage.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the exact launch-target population
        id: coverage
        run: >-
          python3 scripts/release_gate_coverage.py plan
          --out artifacts/plan.json
          --github-output "$GITHUB_OUTPUT"
      - name: Preserve the promised population
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gate-plan
          path: artifacts/plan.json
          if-no-files-found: error

  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-gate-plan
          path: artifacts
      - name: Restore an available source-compatible corpus build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: corpus-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}-release
          restore-keys: |
            corpus-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          use-mathlib-cache: auto
          build: false
          test: false
          lint: false
      - name: Build every target promised by this shard
        env:
          LEAN_NUM_THREADS: "1"
        run: >-
          python3 scripts/release_gate_coverage.py run-shard
          --plan artifacts/plan.json
          --shard-id "${{ matrix.shard }}"
          --report artifacts/report.json
      - name: Preserve incremental results, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-target-${{ matrix.shard }}
          path: artifacts/report.json
          if-no-files-found: error

  audit:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-gate-plan
          path: artifacts
      - name: Restore an available source-compatible corpus build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: corpus-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}-release
          restore-keys: |
            corpus-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          use-mathlib-cache: auto
          build: false
          test: false
          lint: false
      - name: Audit every publication entry's Solution environment
        run: >-
          python3 scripts/release_gate_coverage.py audit
          --plan artifacts/plan.json
          --out-dir artifacts/audit
      - name: Preserve the publication audit, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-axiom-audit
          path: artifacts/audit/
          if-no-files-found: error

  reconcile:
    needs: [plan, build, audit]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ci-artifacts
      - name: Require every source-bound target and audit receipt
        if: always()
        run: >-
          python3 scripts/release_gate_coverage.py check-run
          --plan ci-artifacts/release-gate-plan/plan.json
          --artifacts ci-artifacts
