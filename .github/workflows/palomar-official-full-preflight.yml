name: E249 current official full preflight

on:
  workflow_dispatch:
    inputs:
      entry:
        description: Selected substantive-source entry
        required: true
        type: choice
        options: [E249_29]
      source_commit:
        description: Full immutable candidate SHA, equal to the workflow ref
        required: true
        type: string

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      request_id: ${{ steps.request.outputs.id }}
    steps:
      - id: request
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE: ${{ github.sha }}
          REQUESTED_SOURCE: ${{ inputs.source_commit }}
          ENTRY: ${{ inputs.entry }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, os, re
          if (os.environ['ENTRY'] != 'E249_29' or
              os.environ['REPOSITORY'] != 'wcook04/plectis-erdos-lean' or
              not re.fullmatch(r'[0-9a-f]{40}', os.environ['SOURCE']) or
              os.environ['REQUESTED_SOURCE'] != os.environ['SOURCE']):
              raise SystemExit('Exact E249 entry, repository and immutable workflow/source binding required')
          identity = ':'.join(os.environ[key] for key in ('RUN_ID', 'RUN_ATTEMPT', 'SOURCE'))
          request = hashlib.sha256(identity.encode()).hexdigest()[:12]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('id=' + request + '\n')
          PY
  verify:
    needs: select
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: ${{ needs.select.outputs.request_id }}
      mode: full
      options: '{"comparator_config_path":"PalomarCorpus/E249_29/comparator.json","formalization_metadata_path":"PalomarCorpus/E249_29/formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'
