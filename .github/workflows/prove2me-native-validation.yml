name: Prove2Me Pinned Native Validation 269 Full 71

on:
  push:
    branches: [codex/prove2me-native-validation-269-source-20260927]
    paths:
      - .github/workflows/prove2me-native-validation.yml
      - .github/prove2me-native-validation/**

permissions:
  contents: read

concurrency:
  group: prove2me-native-validation-269-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      LEAN_NUM_THREADS: '1'
      P2M_BUNDLE_SHA256: '48373e75a3b1737bbe454ad9690213d223dd3bc4c9ddbe8103f16c143588805d'
      P2M_SOURCE_COMMIT: 'cc7e541cf2081c6fef5a5e377d52e365e33b01eb'
    steps:
      - name: Check out reviewed control files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false
      - name: Check out exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.P2M_SOURCE_COMMIT }}
          path: source
          persist-credentials: false
      - name: Check out separate cache source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.P2M_SOURCE_COMMIT }}
          path: cache
          persist-credentials: false
      - name: Install pinned Lean and compiled Mathlib
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: cache
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
      - name: Build complete reviewed source closure
        shell: bash
        run: |
          mkdir -p output
          cd cache
          roots=(
            "ErdosProblems.Erdos269.ActualSharpTailMajorantR10"
            "ErdosProblems.Erdos269.LongWindowCapR11"
            "ErdosProblems.Erdos269.PaperCompleteR20.BoundedLatticeCollision"
            "ErdosProblems.Erdos269.PaperCompleteR20.DyadicAlphabetWhole"
            "ErdosProblems.Erdos269.PaperCompleteR20.EightScaleRigidity"
            "ErdosProblems.Erdos269.PaperCompleteR20.FixedBaseRecoding"
            "ErdosProblems.Erdos269.PaperCompleteR20.LiteralTriangleReal"
            "ErdosProblems.Erdos269.PaperCompleteR20.OcticEscapeWhole"
            "ErdosProblems.Erdos269.PaperCompleteR20.PhaseStripDecomposition"
            "ErdosProblems.Erdos269.PaperCompleteR20.RealBaseShortInterval"
            "ErdosProblems.Erdos269.PaperCompleteR20.RealBoundDenominatorReduction"
            "ErdosProblems.Erdos269.PaperCompleteR20.RealCutoffs"
            "ErdosProblems.Erdos269.PaperCompleteR20.RealTwoPrimeKernel"
            "ErdosProblems.Erdos269.PaperCompleteR20.WeightedShiftValue"
            "ErdosProblems.Erdos269.PaperCompleteR21.TwoPrimeSums"
            "ErdosProblems.Erdos269.PaperExactDenominatorR13"
            "ErdosProblems.Erdos269.PaperFixedStartResidueR14"
            "ErdosProblems.Erdos269.PaperR7ActualOrbit"
            "ErdosProblems.Erdos269.PaperR7BasicAssembly"
            "ErdosProblems.Erdos269.PaperR7FiniteCutRank"
            "ErdosProblems.Erdos269.PaperR7RationalBridge"
            "ErdosProblems.Erdos269.PaperR7SeriesIdentification"
            "ErdosProblems.Erdos269.PaperR7WindowResults"
            "ErdosProblems.Erdos269.PaperR8RankMajorant"
            "ErdosProblems.Erdos269.PaperR8UniformRank"
            "ErdosProblems.Erdos269.ResidueEscape"
            "ErdosProblems.Erdos269.RestrictedFloorSum"
            "ErdosProblems.Erdos269.ThreePrimeRunningLcm"
          )
          lake build "${roots[@]}" 2>&1 | tee ../output/source-cache-build.log
      - name: Validate exact generated native actions
        shell: bash
        run: |
          mkdir -p output
          pinned_lean="$(cd cache && elan which lean)"
          test -f "$pinned_lean"
          test ! -L "$pinned_lean"
          python3 control/.github/prove2me-native-validation/transport.py run-pending \
            --bundle "$GITHUB_WORKSPACE/control/.github/prove2me-native-validation/input-269.zip" \
            --bundle-sha256 "$P2M_BUNDLE_SHA256" \
            --source-checkout "$GITHUB_WORKSPACE/source" \
            --cache-checkout "$GITHUB_WORKSPACE/cache" \
            --lean-binary "$pinned_lean" \
            --out "$GITHUB_WORKSPACE/output/validation" \
            --max-load 10 --timeout-seconds 1800 \
            2>&1 | tee output/validation-console.log
      - name: Preserve validation and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prove2me-native-269-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
