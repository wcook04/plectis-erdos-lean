name: Prove2Me Pinned Native Validation 243 Six Target Alias

on:
  push:
    branches: [codex/prove2me-native-validation-243-six-target-alias-20260927]
    paths:
      - .github/workflows/prove2me-native-validation.yml
      - .github/prove2me-native-validation/**

permissions:
  contents: read

concurrency:
  group: prove2me-native-validation-243-six-target-alias-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      LEAN_NUM_THREADS: '1'
      P2M_BUNDLE_SHA256: '49f2b1503451593aec9b1a75da1d137cdfbf09f65976dea5e4d9aaf46f026a60'
      P2M_SOURCE_COMMIT: 'fbf41fb8b571d217b1648070dcc39d5eda5394ad'
    steps:
      - name: Check out reviewed control files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false
      - name: Check reviewed bundle before Lean setup
        shell: bash
        run: |
          echo "P2M_DEADLINE_EPOCH=$(( $(date +%s) + 20400 ))" >> "$GITHUB_ENV"
          mkdir -p output
          python3 control/.github/prove2me-native-validation/transport.py preflight-bundle \
            --bundle "$GITHUB_WORKSPACE/control/.github/prove2me-native-validation/input-243-six-target-alias.zip" \
            --bundle-sha256 "$P2M_BUNDLE_SHA256" \
            --source-commit "$P2M_SOURCE_COMMIT" \
            | tee output/bundle-preflight.json
      - name: Check out exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.P2M_SOURCE_COMMIT }}
          path: source
          persist-credentials: false
      - name: Check out separate cache source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.P2M_SOURCE_COMMIT }}
          path: cache
          persist-credentials: false
      - name: Install pinned Lean and compiled Mathlib
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: cache
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
      - name: Build complete reviewed source closure
        shell: bash
        run: |
          mkdir -p output
          cd cache
          roots=(
            "ErdosProblems.Erdos243.PaperCompleteR11.InclusiveLimsup"
            "ErdosProblems.Erdos243.PaperCompleteR21.DoubleLogOrbitBound"
            "ErdosProblems.Erdos243.PaperCompleteR7.LcmDefect"
            "ErdosProblems.Erdos243.PaperCompleteR8.CanonicalWeightedRecords"
            "ErdosProblems.Erdos243.ReciprocalTailRigidity"
            "ErdosProblems.Erdos243.SparseResetRecovery"
          )
          remaining=$(( P2M_DEADLINE_EPOCH - $(date +%s) ))
          test "$remaining" -gt 0
          timeout --signal=TERM --kill-after=30s "$remaining" lake build "${roots[@]}" 2>&1 | tee ../output/source-cache-build.log
      - name: Validate exact generated native actions
        shell: bash
        run: |
          mkdir -p output
          pinned_lean="$(cd cache && elan which lean)"
          test -f "$pinned_lean"
          test ! -L "$pinned_lean"
          python3 control/.github/prove2me-native-validation/transport.py run-pending \
            --bundle "$GITHUB_WORKSPACE/control/.github/prove2me-native-validation/input-243-six-target-alias.zip" \
            --bundle-sha256 "$P2M_BUNDLE_SHA256" \
            --source-checkout "$GITHUB_WORKSPACE/source" \
            --cache-checkout "$GITHUB_WORKSPACE/cache" \
            --lean-binary "$pinned_lean" \
            --out "$GITHUB_WORKSPACE/output/validation" \
            --max-load 10 --timeout-seconds 1800 \
            2>&1 | tee output/validation-console.log
      - name: Preserve validation and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prove2me-native-243-six-target-alias-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
