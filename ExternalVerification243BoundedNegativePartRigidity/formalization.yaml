version: "v0.4"

project:
  name: "Erdős #243: bounded-negative-part rigidity for reciprocal-tail dynamics"
  description: >-
    Clearing denominators in the rational case of Erdős Problem 243 produces an
    exact integer orbit: multipliers a n greater than 1 drive
    C (n+1) + D n = a n * C n and D (n+1) = a n * D n, and the centred error is
    E n = D n - (a n - 1) * C n. The compared theorem proves complete rigidity
    of the bounded-negative branch of that orbit. An eventual one-sided lower
    bound -B ≤ E n on the centred error, together with division-free normalized
    vanishing K * Int.natAbs (E n) < C n at every scale K, forces two
    conclusions at once: the centred error is exactly zero from some index
    onward, and the multipliers satisfy the exact Sylvester recurrence
    a (n+1) = a n ^ 2 - a n + 1 from some index onward. The second conclusion is
    the Sylvester recurrence itself, which is the target shape for this
    dynamics, so the theorem reaches that endpoint inside the stated regime. The
    hypothesis list contains no periodicity assumption, no eventual periodicity
    assumption, and no sign condition on the centred error, so the statement
    covers aperiodic orbits and orbits whose centred error changes sign
    infinitely often. The
    normalized-vanishing hypothesis is stated division-free over the natural
    numbers, so the theorem consumes no real-analytic input. Eventual strict
    centring Int.natAbs (E n) < C n is the K = 1 instance of normalized
    vanishing and is absorbed into that hypothesis. The proof runs a natural-tail
    descent on the eventually nonnegative branch and a gcd-stabilisation and
    scale-reduction obstruction on the recurring bounded-negative branch, then
    composes the resulting zero-defect statement with the algebraic step that
    turns a vanishing centred state into the Sylvester successor. The exact
    recurrence, the one-sided lower bound, and normalized vanishing are
    hypotheses of the theorem. No declaration in this package produces them for
    an arbitrary orbit, orbits with cofinally unbounded negative centred error
    lie outside the statement, and Erdős Problem 243 remains open.
  authors:
    - "Will Cook"
  responsible_maintainers:
    - "Will Cook"
  license: "Apache-2.0"

