project:
  name: 'Erdős #249: Farey-window totient-series denominator exclusion'
  description: The binary totient series is not a/d for any integer a and any
    denominator at most 79639646646701375323355774875831053, and therefore is
    not any rational whose reduced denominator lies in that range. Finite
    exclusion only; the series is not proved irrational.
