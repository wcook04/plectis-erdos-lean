  description: >-
    7 theorems of the substantive development for Erdős problem #243
    restated against Mathlib alone and transported from the source declarations named
    below. The substantive formalization lives in ErdosProblems.Erdos243.PaperCompleteR11.LogLogNormaliser, ErdosProblems.Erdos243.PaperCompleteR21.ClassicalHalfspaceSigns, ErdosProblems.Erdos243.PaperCompleteR21.SlowGrowthProductIncrements, ErdosProblems.Erdos243.PaperCompleteR7.CanonicalState, ErdosProblems.Erdos243.PaperCompleteR7.Frontier, ErdosProblems.Erdos243.PaperCompleteR7.ProductDefect, ErdosProblems.Erdos243.PaperCompleteR7.QuantitativeTail, ErdosProblems.Erdos243.ReciprocalTailRigidity in this repository and at
    public commit f436a7ec0f7bf035828a7eec37fd29ae74d17d84 of https://github.com/wcook04/plectis-erdos. This entry is a comparison
    interface over that development. 6 statements transport by direct term
    application, which certifies definitional identity with the source statement;
    1 transport through a tactic bridge, which certifies implication only. The
    parent Erdős problem remains open.
