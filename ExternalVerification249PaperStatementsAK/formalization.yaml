    27 theorems of the substantive development for Erdős problem #249
    restated against Mathlib alone and transported from the source declarations named
    below. The substantive formalization lives in Erdos249257.GapFareyBound, Erdos249257.GcdMomentCalculus, Erdos249257.GeometricCoprimality, ErdosProblems.Erdos249.PaperCompleteR21.ActualLcmShortWindowArithmetic, ErdosProblems.Erdos249.PaperCompleteR21.CoprimeLatticeSumsAndLambert, ErdosProblems.Erdos249.PaperCompleteR21.FareyDenominatorFloorExtension, ErdosProblems.Erdos249.PaperCompleteR21.FareyExactRangeAndDenominatorExclusion, ErdosProblems.Erdos249.PaperCompleteR21.GeneralIrrationalityCriteriaAndGapBounds, ErdosProblems.Erdos249.PaperCompleteR21.MersennePrimeSupportAnchors, ErdosProblems.Erdos249.PaperCompleteR21.MobiusMersenneLadderLogConcavity, ErdosProblems.Erdos249.PaperCompleteR21.RationalTailPeriodWitnesses, ErdosProblems.Erdos249.PaperCompleteR21.ShortWindowSupplyAndSixteenShifts, ErdosProblems.Erdos249.PaperCompleteR21.ThreeParticularEquivalences, ErdosProblems.Erdos249.PaperCompleteR21.TopEdgeCorridorAndSeparation, ErdosProblems.Erdos249.PaperCompleteR21.TwoAdicPulseCertificateFailure, ErdosProblems.Erdos249.PrimeRayCyclotomicCurvature in this repository and at
