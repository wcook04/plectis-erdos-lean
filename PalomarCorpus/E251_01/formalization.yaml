version: v0.4
project:
  name: Uniform sparse rationalisation of dyadic series
  description: Given any convergent dyadic series with nonnegative integer coefficients, any finite prefix
    and any eventually unbounded correction allowance, one common permitted set of upper Banach density
    zero supports nonnegative integer corrections realising every target in a nondegenerate interval above
    the original sum. Each fixed modulus eventually divides both corrections and cumulative corrections
    beyond a cutoff independent of the target. With polylogarithmic allowance, the selected theorem also
    bounds support in dyadic windows and preserves empirical block distributions in total variation for
    lengths o(log log X), uniformly in the target. The entry additionally states exact prime-to-gap summation
    identities and tail rationality criteria. It does not select the prime-gap joint countermodel, which
    in the paper uses named outside inputs, and makes no claim that corrected cumulative positions are
    prime or that the original prime series is irrational.
  authors:
  - Will Cook
  license: Apache-2.0
  responsible_maintainers:
  - Will Cook
