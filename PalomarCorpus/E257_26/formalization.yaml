version: v0.4
project:
  name: 'Erdős #257, record section 6.2: exact identities and reductions (part 6 of 6)'
  description: >-
    This entry states 9 theorems that the long record for Erdős problem #257 states in section 6.2 (exact identities and reductions): the lemma “An integer test for the interval between the dyadic and Mersenne weights” (section 6.2), as greedyHalf_mem_nextMersenneDyadicSliver_iff_excess; the lemma “The odd denominator survives dyadic subtraction” (section 6.2), as dyadicResidual_denominator_sandwich; the lemma “A guaranteed divisor of a reduced denominator” (section 6.2), as divisor_dvd_divInt_den and survivingDivisor_dvd_scaled_divInt_den; the lemma “Commuting prime-power differences” (section 6.2), as primePowerLayer_comm and mixedPrimePowerLayerTwo_supportCoeffInt; the proposition “Achievement-set topology: compact, closed, perfect, measure exactly one” (section 6.2), as paper_achievement_set_topology; the theorem “Nonmembership of one half and a finite fatal gap” (section 6.2), as half_mem_mersenneAchievementSet_iff_no_existsFatalHalfGap and half_mem_mersenneAchievementSet_or_exists_fatal_gap.

    8 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 1 is derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #257 remains open, and no theorem in this entry decides it.
