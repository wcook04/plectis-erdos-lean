version: v0.4
project:
  name: 'Erdős #249, record section 6.2.1: initial implications (part 1 of 2)'
  description: >-
    This entry states 40 theorems that the long record for Erdős problem #249 states in section 6.2.1 (initial implications): the proposition “The prefix-tail identity” (section 6.2.1), as tail_diff_mem_int_iff_scaled_series_mem_int and prefix_fractional_part; the lemma “The necessary depth inequality” (section 6.2.1), as certifiedKill_depth_floor, certificate_logarithmic_depth and fixed_depth_bounds_indices; the proposition “A certificate implies nonintegrality” (section 6.2.1), as tail_diff_notMem_int_of_certifiedKill and totient_scaled_truncation_error; the theorem “Nonintegrality gives a certificate at some depth” (section 6.2.1), as exists_certifiedKill_iff_tail_diff_notMem_int; the proposition “An irrationality criterion from rational approximations” (section 6.2.1), as irrational_of_den_mul_abs_sub_tendsto_zero; the proposition “An irrationality criterion from near integers” (section 6.2.1), as irrational_of_int_mul_near_int, irrational_of_pow_mul_near_int, irrational_of_near_integer_base_powers, irrational_of_near_integer_multiples, one_div_den_le_abs_int_combination, digit_block, exists_irrational_basePower_bounded_away, fract_mem_Icc_of_no_three_equal, fract_two_pow_mul_xi_mem_Icc, irrational_tail_zero, irrational_xi, no_three_consecutive_equal, not_approaches_int, not_eventually_periodic, not_near_integer_along_powers_of_two, one_div_eight_le_abs_sub_int, one_div_eight_le_dist_xi, strict_lower_bound_needed, tail_mem_Icc and upper_bound_needed_for_every_q; the proposition “A nonzero evaluation minor gives independence” (section 6.2.1), as linearIndependent_of_separatedMinorCertificate; the proposition “The gap between distinct rational numbers” (section 6.2.1), as positive_rational_difference_lower_bound, rational_cross_numerator_positive, rational_difference_exact and rational_error_denominator_bound; the proposition “The Möbius identity for S” (section 6.2.1), as totient_series_eq_half_add_moebius_mersenne_square and tsum_moebius_lambert_sq; the corollary “An equivalent irrationality question” (section 6.2.1), as irrational_totient_iff_moebius_square; the proposition “The weight of pairs divisible by a fixed integer” (section 6.2.1), as pair_divisibility_mass and tsum_geometric_multiples; the proposition “The sum over coprime directions” (section 6.2.1), as tsum_pos_coprime_inv_mersenne_eq_one.

    34 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 6 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #249 remains open, and no theorem in this entry decides it.
