version: v0.4
project:
  name: 'Erdős #249, record section 6.2.2: equivalent quantified certificate conditions'
  description: >-
    This entry states 27 theorems that the long record for Erdős problem #249 states in section 6.2.2 (equivalent quantified certificate conditions): the corollary “Equivalent conditions stated without certificates” (section 6.2.2), as irrational_totient_series_of_lcm_diagonal_nonintegrality_supply, periodLcm_diagonal_kill_iff_tail_diff_notMem_int and irrational_totient_series_iff_all_tail_diffs_nonintegral; the proposition “Soundness of a second-difference certificate” (section 6.2.2), as abs_tail_diff_scaled_sub_window_le, second_difference_cell_one_eight, second_difference_certificate_sound and second_difference_error_bound; the theorem “A finite-grid condition gives a nonintegral pair” (section 6.2.2), as finite_grid_nonintegral_pair and paperGridNumerator_eq; the theorem “A sufficient quantified finite-grid condition” (section 6.2.2), as finite_grid_supply_irrational; the proposition “A finite carry test implies nonintegrality” (section 6.2.2), as finite_carry_candidate_count, finite_carry_test_sound and finite_carry_true_orbit; the theorem “The block norm condition implies irrationality” (section 6.2.2), as nine_tenths_lt_cos_pi_div_eight, exists_certificate_of_first_harmonic_norm_bound, exists_certificate_of_first_harmonic_real_bound, first_harmonic_re_bound_of_norm_bound and irrational_of_first_harmonic_norm_gap; the theorem “A four-tail residue criterion” (section 6.2.2), as four_tail_checked_instance, four_tail_combination_eq, four_tail_criterion_sound, four_tail_error_bound, four_tail_window_eq, irrational_of_four_tail_supply, rational_forces_four_tail_diagonals_integral, totientTail_bounds and windowDiscrepancy_diagonal_eq.

    20 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 7 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #249 remains open, and no theorem in this entry decides it.
