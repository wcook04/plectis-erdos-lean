version: v0.4
project:
  name: 'Erdős #68, the multiplicative successor rigidity, prime pole and prime unit translator families'
  description: >-
    This entry states 12 theorems of the multiplicative successor rigidity, prime pole and prime unit translator developments of the Lean formalisation of Erdős problem #68, to which no paper statement is bound. eventually_dvd_gapSuccessor_of_not_irrational: If `d` is a positive natural number and `S` fails to be irrational, then there is a bound `B` with `d ∣ Z m` for every `m > B`; on the rational branch every fixed modulus eventually divides the strict successor. irrational_factorialGapSeries_of_cofinal_not_dvd_gapSuccessor: The contrapositive producer: if `d` is a positive natural number and for every bound `B` there is `m > B` with `d` not dividing `Z m`, then `S` is irrational. irrational_factorialGapSeries_of_cofinal_odd_gapSuccessor: The case `d = 2` of the preceding criterion: if for every bound `B` there is `m > B` with `Z m` odd, then `S` is irrational. not_eventually_odd_gapSuccessor_of_not_irrational: If `S` fails to be irrational, then there is a bound `B` beyond which `Z m` is even, so the strict successors cannot be odd cofinally on the rational branch. factorialGapPrefixLCMNumerator_mod_prime: If `q` is prime, `e ≥ 1`, no index `n` with `2 ≤ n ≤ M` has `q^(e + 1)` dividing `n!. primeTranslator_moment_zero: Component fact: for `p > 0` the prime translator has factorial moment zero, since `p * (p - 1)!. primeTranslator_channel_zero_of_lt_p: Component fact: for a prime `p` and a channel `d` with `2 ≤ d < p`, the channel numerator of the prime translator vanishes. primeTranslator_channel_at_prime: Component fact: for a prime `p` the channel numerator of the prime translator at the channel `p` equals `p!. primeTranslator_channel_zero_of_p_lt: Component fact: for `p > 0` and any channel `d > p`, the channel numerator of the prime translator vanishes. primeTranslator_channelResidual_eq_one: For `2 ≤ D` and a prime `p > D`, the residual of the prime translator beyond the cutoff `D` equals exactly `1`, so the translator is an exact unit direction for the residual. channelResidual_appendPrimeTranslator: For any finite coefficient family, any `2 ≤ D` and any prime `p > D`, enlarging the family by `z` copies of the prime translator changes the residual beyond `D` by exactly the integer `z` and leaves the rest of the residual unchanged. exists_remote_factorialGrid_primeTranslator_reduction: For every cutoff parameter `n` and every support threshold `B` there exist a prime `p` and an integer `z` such that the Cramer coefficient vector on the factorial grid starting at `B + 1`, enlarged by `z` copies of the prime translator at `p`, has every support index above `B`, has vanishing channel numerator at every `d` with `2 ≤ d ≤ n + 2`, has nonzero factorial moment, and has residual beyond `n + 2` of absolute value at most `1/2`.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #68 remains open, and no theorem in this entry decides it.
