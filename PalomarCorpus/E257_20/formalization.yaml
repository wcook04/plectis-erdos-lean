version: v0.4
project:
  name: 'Erdős #257, record section 6.2: exact identities and reductions (part 2 of 6)'
  description: >-
    This entry states 15 theorems that the long record for Erdős problem #257 states in section 6.2 (exact identities and reductions): the lemma “The values on either side of an eventual right continuation” (section 6.2), as prefix_add_mersenneTail_lt_half_of_eventually_right; the lemma “Each Mersenne weight exceeds its remaining tail” (section 6.2), as halfTwoChannelCap_lt_mersenneTail, mersenneTail_eq_weight_add, mersenneTail_le_two_mul_weight, mersenneTail_lt_weight and two_mul_mersenneWeight_succ_lt; the lemma “The two next-prefix intervals and their gap” (section 6.2), as half_step_forced and isStraddlePrefix_step_trichotomy; the lemma “A greedy gap excludes every representation” (section 6.2), as depth_prefix_interval_disjoint, fatal_gap_endpoint_bounds, fatal_gap_excludes_every_representation and fatal_gap_within_prefix_interval; the lemma “No finite Mersenne sum equals one half” (section 6.2), as half_ne_coe_finset_add_mersenneTail and positiveMersenneSupportValue_coe_finset_ne_half; the theorem “Last-skip iff local fatality: a pointwise criterion” (section 6.2), as half_mem_iff_every_actual_skip_survives.

    11 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 4 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #257 remains open, and no theorem in this entry decides it.
