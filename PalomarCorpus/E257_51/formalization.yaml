- title: "On arithmetical properties of Lambert series"
  authors:
  - "Paul Erdos"
  type: "paper"
  relationship: "background"
  note: "J. Indian Math. Soc. 12 (1948), 63-66. Source of the classical irrationality of the full support value at every integer base, which is the historical starting point for the problem. That classical result is the analytic input to the forward implication of the rational membership criterion compared here, since finitely many greedy omissions would write the full support value as a rational plus a finite rational Mersenne sum. No statement compared in this entry is Erdős's, and no priority over him is claimed."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "Refinement of the Chowla-Erdős method and linear independence of certain Lambert series"
  authors:
  - "Daniel Duverney"
  - "Yohei Tachiya"
  id: "https://doi.org/10.1515/forum-2018-0299"
  type: "paper"
  relationship: "background"
  note: "Forum Math. 31 (2019), no. 6, 1557-1566. Corollary 1.2 and Example 1.1 give irrationality and linear independence for the squarefree support at every base 2^j with j at least 1. That family is prior art and is credited to these authors; no theorem compared in this entry is derived from it."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "Quantitative correlations and some problems on prime factors of consecutive integers"
  authors:
  - "Terence Tao"
  - "Joni Teravainen"
  id: "arXiv:2512.01739"
  type: "paper"
  relationship: "background"
  note: "Theorem 1.3 proves irrationality of the prime support value at base two, with the extension to other integer bases and to prime power supports stated as remarks. That case is prior art and is credited to these authors; no theorem compared in this entry uses their correlation input."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "On several irrationality problems for Ahmes series"
  authors:
  - "Vjekoslav Kovac"
  - "Terence Tao"
  id: "https://doi.org/10.1007/s10474-025-01528-0"
  type: "paper"
  relationship: "background"
  note: "Acta Math. Hungar. 175 (2025), 572-608. Remark 4.1 records the strict tail inequality and the resulting Cantor structure of the fixed base achievement set, which is the classical context for the geometry compared here. The exact Lebesgue measure dichotomy and the rational fibre null theorem are not taken from this source."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "On the set of partial sums of an infinite series"
  authors:
  - "Soichi Kakeya"
  id: "https://doi.org/10.11429/ptmps1907.7.14_250"
  type: "paper"
  relationship: "background"
  note: "Tokyo Sugaku-Buturigakkwai Kizi Dai 2 Ki 7 (1914), no. 14, 250-251. Kakeya proves that the subsum set of an absolutely convergent series is perfect and states the interval filling criterion and the nowhere density assertion. Perfectness and nowhere density in AchievementSetGeometry are classical in this sense; the exact measure dichotomy is not taken from this source."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "On an incomplete argument of Erdős on the irrationality of Lambert series"
  authors:
  - "J. Vandehey"
  id: "arXiv:1206.0340"
  type: "paper"
  relationship: "background"
  note: "Completes a different unprinted Erdős argument: irrationality of the divisor-function Lambert series at negative integer bases, with bounded nonzero integer weights. It does not treat subsums over a support, so it neither anticipates nor overlaps the reciprocal summable theorem compared here; it is cited as the nearest published completion of an Erdős gap in this circle."
  license: "unknown"
  author_endorsement: "not-contacted"
