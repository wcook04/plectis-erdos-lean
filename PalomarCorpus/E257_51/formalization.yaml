version: v0.4
project:
  name: 'Erdős #257, the literal weighted cover, paper structures CI and paper structures CO families'
  description: >-
    This entry states 9 theorems of the literal weighted cover, paper structures CI, paper structures CO, positive skip equivalence and rational membership developments of the Lean formalisation of Erdős problem #257, to which no paper statement is bound. exists_weighted_not_strengthened_host: There is an infinite set A of positive exponents with 0 not in A that has finite prime part weighted mass at base 2, has divergent reciprocal mass, admits no strengthened positive cover, admits no logarithmic budget cover at all, and all of whose infinite subsets have irrational support series at every integer base at least 2. exists_weighted_obstruction_with_mixed_heredity: There is an infinite set A of positive exponents with 0 not in A that has finite prime part weighted mass at base 2, admits no logarithmic budget cover, and yet can be combined with an arbitrary strengthened positive cover host V so that every infinite subset of the union of A and V has irrational support series at every integer base at least 2. exists_strengthened_not_old_or_weighted_host: States res:weighted-cover-incomparability from the short record for Erdős problem #257. finite_monotone_witness_rule_realised: States prop:257-finite-witness-rule from the long record for Erdős problem #257. greedyMersenneRemainderRat_half_pos: Every finite rational greedy remainder of the target one half is strictly positive, so no finite greedy prefix represents one half exactly. greedyMersenneSkippedSupport_infinite_iff_cofinal_skips: For every real x, the set of positive ranks skipped by the greedy Mersenne rule on x is infinite if and only if for every K there is an n at least K at which the weight at n+1 exceeds the greedy remainder after rank n. infinite_greedyMersenneSkippedSupport_of_rat_mem: If a rational q belongs to the base two Mersenne achievement set, then the greedy Mersenne rule on q skips infinitely many positive ranks. rat_mem_mersenneAchievementSet_iff_greedySkippedSupport_infinite: For every nonnegative rational q, membership of q in the base two Mersenne achievement set is equivalent to the greedy Mersenne rule on q skipping infinitely many positive ranks. rat_mem_mersenneAchievementSet_iff_cofinal_greedy_skips: For every nonnegative rational q, membership of q in the base two Mersenne achievement set is equivalent to the greedy rule skipping at arbitrarily late ranks, that is to the condition that for every K some n at least K has the weight at n+1 exceeding the greedy remainder after rank n.

    2 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #257 remains open, and no theorem in this entry decides it.
