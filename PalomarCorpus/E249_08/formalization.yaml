version: v0.4
project:
  name: 'Erdős #249, record section 6.2.1: initial implications (part 2 of 2)'
  description: >-
    This entry states 22 theorems that the long record for Erdős problem #249 states in section 6.2.1 (initial implications): the proposition “A cyclotomic congruence” (section 6.2.1), as cyclotomic_dvd_mobiusNumeratorPolynomial_sub, jordanTotientTwo_eq_prod_primeFactors and mobiusNumerator_mod_cyclotomicEval; the proposition “Adjoining a prime: new divisors” (section 6.2.1), as cyclotomic_dvd_primeJump_new_fibre; the proposition “Adjoining a prime: existing divisors” (section 6.2.1), as cyclotomic_dvd_primeJump_old_fibre; the proposition “Lambert-series identities” (section 6.2.1), as lambertValue_eq_divisor_sum_series, alpha_divisor_sum_eq_totient and lambertValue_alpha_eq_totientSeries; the proposition “An affine combination annihilates the specified divisor terms” (section 6.2.1), as joint35_coefficient_moments, joint35_mobiusTermKernel_zero, mobiusTermKernel_affine_in_multiplier, mobiusTermKernel_moment_annihilation, joint35ConeWindow_eq, joint35_nonintegral_of_separated_window, joint35_truncation_error, totientTail_enclosure and transportResidueKernel_eq_mobiusTermKernel; the proposition “The error under composite dilation” (section 6.2.1), as composite_dilation_defect_eq_zero_of_prime_support, composite_dilation_defect_univ_six_one, composite_dilation_defect_univ_six_one_card, sum_divisors_totient_ne_totient and composite_dilation_divisor_count.

    21 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 1 is derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #249 remains open, and no theorem in this entry decides it.
