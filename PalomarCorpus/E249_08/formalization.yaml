version: v0.4
project:
  name: 'Erdős #249, record section 6.2.1: initial implications (part 2 of 2)'
  description: >-
    This entry states 26 theorems that the long record for Erdős problem #249 states in section 6.2.1 (initial implications): the proposition “A Stern-Brocot recursion with stopping” (section 6.2.1), as divisibility_mass, stopping_probability_ge_third, stopping_transition_probabilities_sum_one, cylinderMass_eq_divisibility_mass_mul, cylinder_mediant_split, cylinder_root_values and normalised_split_probabilities; the proposition “Convergence with an explicit error” (section 6.2.1), as cylinderMass_children_le, sternBrocotDepthMass_error and tendsto_sternBrocotDepthMass; the proposition “A numerator polynomial and its coefficients” (section 6.2.1), as mobiusNumeratorPolynomial_coeff and mobiusNumeratorPolynomial_coeff_pos; the proposition “Evaluation at two” (section 6.2.1), as numerator_eval_two_divisors; the proposition “Decomposition by the radical” (section 6.2.1), as radical_decomposition; the proposition “A cyclotomic congruence” (section 6.2.1), as cyclotomic_dvd_mobiusNumeratorPolynomial_sub, jordanTotientTwo_eq_prod_primeFactors and mobiusNumerator_mod_cyclotomicEval; the proposition “Adjoining a prime: new divisors” (section 6.2.1), as cyclotomic_dvd_primeJump_new_fibre; the proposition “Adjoining a prime: existing divisors” (section 6.2.1), as cyclotomic_dvd_primeJump_old_fibre; the proposition “Lambert-series identities” (section 6.2.1), as lambertValue_eq_divisor_sum_series, alpha_divisor_sum_eq_totient and lambertValue_alpha_eq_totientSeries; the proposition “An affine combination annihilates the specified divisor terms” (section 6.2.1), as joint35_coefficient_moments, joint35_mobiusTermKernel_zero, mobiusTermKernel_affine_in_multiplier and mobiusTermKernel_moment_annihilation.

    23 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 3 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #249 remains open, and no theorem in this entry decides it.
