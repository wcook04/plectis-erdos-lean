version: v0.4
project:
  name: 'Erdős #243, the bounded negative part rigidity, bounded rise reduced tail and periodic negative orbit families'
  description: >-
    This entry states 16 theorems of the bounded negative part rigidity, bounded rise reduced tail, periodic negative orbit, primitive record rigidity and protected epoch energy developments of the Lean formalisation of Erdős problem #243, to which no paper statement is bound. boundedNegativePart_completeRigidity: Principal integer-state theorem: for natural sequences with `a n > 1` and `C n > 0` obeying the exact cleared dynamics `C (n+1) + D n = a n * C n` and `D (n+1) = a n * D n`, with centred error `E n = D n - (a n - 1) * C n` taken in the integers, if `E` has an eventually bounded negative part, meaning `-B ≤ E n` for all `n` past some index, and satisfies division-free normalised vanishing, meaning that for every scale `K` one eventually has `K * |E n| < C n` in the naturals, then `E n = 0` from some index onward and `a (n+1) = a n ^ 2 - a n + 1` in the integers from some index onward. no_boundedRise_of_tailAvoidance: An unbounded natural sequence cannot have bounded upward increments while avoiding every earlier modulus in a pairwise coprime tail of moduli greater than one. no_boundedRise_reducedTail: Unconditional exclusion: there is no reduced exact tail of naturals with `a n > 1` for every `n`, `u n` coprime to `v n` for every `n`, `u (n+1) + v n = a n * u n`, `v (n+1) = a n * v n`, a fixed `B > 0` with `u (n+1) ≤ u n + B` at every index, and `u n → ∞`. no_eventuallyBoundedRise_reducedTail: The reduced numerator of a reciprocal-tail recurrence cannot tend to infinity while having eventually bounded upward increments. no_phasePrimitivePeriodicNegative_orbit: Unconditional exclusion of a phase-primitive periodic negative-error orbit: for natural sequences with `a n ≥ 2`, `0 < e n < a n`, `D (n+1) = a n * D n`, `C (n+1) = C n + e n`, the shape equation `D n + e n = (a n - 1) * C n`, a period `h > 0` with `e (n+h) = e n`, a positive drift `C (n+h) = C n + M` with `M > 0`, and the primitivity condition that no prime dividing `M` divides both `C 0` and every value of `e`, the hypotheses are contradictory. no_periodicNegative_orbit: The same exclusion at an arbitrary common scale, with the primitivity condition removed: for natural sequences with `a n ≥ 2`, `0 < e n < a n`, `D (n+1) = a n * D n`, `C (n+1) = C n + e n`, `D n + e n = (a n - 1) * C n`, period `h > 0` and positive drift `C (n+h) = C n + M` with `M > 0`, the hypotheses are contradictory. no_eventuallyPeriodicNegative_orbit: Eventual form of the periodic exclusion, with every hypothesis imposed only from an offset `N`: `a n ≥ 2` for `n ≥ N`, `0 < e (N+n) < a (N+n)` for every `n`, `D (n+1) = a n * D n`, `C (n+1) = C n + e n` and `D n + e n = (a n - 1) * C n` for `n ≥ N`, `e (N+n+h) = e (N+n)` with `h > 0`, and `C (N+n+h) = C (N+n) + M` with `M > 0`. primitive_valuation_no_drop: Supporting lemma on one primitive step with arbitrary cancellation: given `w + v = a * u`, `w = hc * u'` and `a * v = hc * v'` with `u` coprime to `v`, `v > 0` and `w > 0`, a prime power `p ^ l` dividing `v` still divides the next denominator `v'` as soon as the raw numerator satisfies `w < p ^ (l+1)`. protectedPrimePower_persists: Supporting lemma: along a primitive orbit with arbitrary cancellation from index `s`, satisfying `w n + v n = a n * u n`, `w n = hc n * u (n+1)`, `a n * v n = hc n * v (n+1)`, `u n` coprime to `v n`, `v n > 0`, `w n > 0` and the slow bound `2 * w n ≤ 3 * u n`, if `p` is prime with `p ^ l ∣ v s` and the height `H` obeys `3 * H < 2 * p ^ (l+1)`, then `p ^ l ∣ v n` at every index `n ≥ s` whose strictly earlier window `s ≤ k < n` keeps `u k < H`. odd_record_cut: Supporting lemma, the odd cut: under the same primitive-orbit hypotheses from `s` with the slow bound `2 * w n ≤ 3 * u n`, a prime `p`, an exponent `l ≥ 1`, an odd height `H` divisible by `p` with `runningMax u s < H` and `3 * H < 2 * p ^ (l+1)`, `p ^ l ∣ v s`, and every record-setting step from `s` onward rising by at most `2`, the numerator satisfies `u n < H` for every `n ≥ s`. exists_oddMultiple_trapHeight: Supporting lemma: for an odd `p ≥ 2`, an exponent `l ≥ 1` and a bound `R` with `3 * R < p ^ l`, there exists an odd multiple `H` of `p` with `R < H` and `3 * H < 2 * p ^ (l+1)`, so a large odd power `p ^ l` always supplies a trap height above the current record and below the protection ceiling. numerator_bounded_of_oddPrimePower: Supporting lemma combining the trap height with the odd cut: for a primitive orbit from `s` with arbitrary cancellation, meaning `w n + v n = a n * u n`, `w n = hc n * u (n+1)`, `a n * v n = hc n * v (n+1)`, `v n > 0`, `w n > 0` and `u n` coprime to `v n` at every `n ≥ s`, with the slow bound `2 * w n ≤ 3 * u n`, every record-setting step rising by at most `2`, an odd prime `p`, an exponent `l ≥ 1`, `p ^ l ∣ v s` and `3 * runningMax u s < p ^ l`, the numerator is bounded: there is an `H` with `u n < H` for every `n ≥ s`. centeredZero_forces_unit: Supporting lemma: at a primitive step with `u` coprime to `v`, `w + v = a * u` and `w = hc * u'`, a vanishing centred error `v - (a - 1) * u = 0` in the integers forces `u = 1`, `w = 1`, `hc = 1` and `u' = 1`, so the tail sits in its unit normal form with no cancellation at that step. sylvesterStep_of_centeredZero_pair: Supporting lemma: at a primitive step with `u` coprime to `v`, `w + v = a * u`, `w = hc * u'` and `a * v = hc * v'`, if both centred errors vanish, that is `v - (a - 1) * u = 0` and `v' - (a' - 1) * u' = 0` in the integers, then the two multipliers satisfy `a' = a ^ 2 - a + 1`. recordRiseTwo_sylvesterNext_eventually: Rigidity for the class of tails whose record-setting steps rise by at most two: along a reduced reciprocal tail from index `N` with arbitrary cancellation, obeying `w n + v n = a n * u n`, `w n = hc n * u (n+1)`, `a n * v n = hc n * v (n+1)`, `v n > 0`, `w n > 0` and `u n` coprime to `v n`, with centred error `e n = v n - (a n - 1) * u n` satisfying `2 * |e n| < u n` and division-free normalised vanishing at every scale, if every record-setting step rises by at most `2` and odd prime powers `p ^ l`, `l ≥ 1`, with `p ^ l ∣ v s` and `3 * runningMax u s < p ^ l` recur at arbitrarily late `s`, then `a (n+1) = a n ^ 2 - a n + 1` from some index onward. protected_epoch_energy_integer: Protected-epoch record energy: for an odd prime `p`, an exponent `l ≥ 1` and a primitive orbit from `s` with arbitrary cancellation, `u n` coprime to `v n`, `v n > 0`, `w n > 0`, `w n + v n = a n * u n`, `w n = hc n * u (n+1)`, `a n * v n = hc n * v (n+1)` and the slow bound `2 * w n ≤ 3 * u n`, if `Q = p ^ l` divides `v s` with `Q ≥ 16` and `4 * runningMax u s < p * Q`, and `s < τ` with `p * Q ≤ 2 * u τ`, then there is a finite set `J` of indices in `[s, τ)`, each a global record step with `hc n = 1` and jump `u n + 3 ≤ u (n+1)`, such that `p * Q ≤ (8 * p + 8) * J.card + 4 * ∑_{n ∈ J} (u (n+1) - u n - 2) + 8 * p`, the inner subtraction being natural subtraction.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #243 remains open, and no theorem in this entry decides it.
