- title: "On the irrationality of certain Ahmes series"
  authors:
  - "Paul Erdős"
  - "Ernst G. Straus"
  id: "https://users.renyi.hu/~p_erdos/1964-19.pdf"
  type: "paper"
  relationship: "background"
  note: "Theorem 3, page 132, gives the classical criterion that a counterexample has positive limit superior for lcm(a 1, ..., a n) / a (n+1) times (a (n+1) ^ 2 / a (n+2) - 1), whose growth factor sits one index later than the product defect compared here; no proof, lemma or formal statement is taken from it, and the present bounded-defect criterion needs only a finite upper bound in place of a nonpositive limit superior, for a prefix-product quantity at index n where their Theorem 3 bounds an lcm-scale quantity at index n + 1."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "Irrationality of the reciprocal sum of doubly exponential sequences"
  authors:
  - "Junnosuke Koizumi"
  id: "arXiv:2504.05933"
  type: "paper"
  relationship: "background"
  note: "Supplies the cleared coordinates in which the integer-state theorems are read, and the eventually nonnegative case of the conclusion in Proposition 1(2), which Koizumi attributes to Badea; the bounded-negative-part and summable-mass theorems here are stated and proved independently of that source, and no analytic bridge from this article is formalised in the Challenge."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "A theorem on irrationality of infinite series and applications"
  authors:
  - "Catalin Badea"
  id: "https://matwbn.icm.edu.pl/ksiazki/aa/aa63/aa6342.pdf"
  type: "paper"
  relationship: "background"
  note: "Gives the positive-term irrationality criterion and the rationality-forces-equality companion that stand behind the eventually nonnegative case; its positive-term hypotheses do not cover the mixed-sign integer states studied here, and nothing in the Challenge recovers its statements."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "Irrationality of fast converging series of rational numbers"
  authors:
  - "Daniel Duverney"
  id: "https://www.ms.u-tokyo.ac.jp/journal/pdf/jms080206.pdf"
  type: "paper"
  relationship: "background"
  note: "Corollary 3.2 settles a signed form of the problem under convergence of the series of growth defects, a hypothesis assumed nowhere in this entry; no result here is derived from it and no comparison of priority is made."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "On several irrationality problems for Ahmes series"
  authors:
  - "Vjekoslav Kovač"
  - "Terence Tao"
  id: "arXiv:2406.17593"
  type: "paper"
  relationship: "background"
  note: "Calibrates the growth hypothesis by recording that the classical sufficient condition for irrationality is sharp for doubly exponential sequences; the article resolves other Erdős and Graham problems on Ahmes series and does not treat problem 243, so nothing here rests on it."
  license: "unknown"
  author_endorsement: "not-contacted"
