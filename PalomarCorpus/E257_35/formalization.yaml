version: v0.4
project:
  name: 'Erdős #257: uniqueness for gap-dominated finite weights; a geometric form of the quotient condition; bounds for a general coefficient sequence'
  description: >-
    This entry states 18 theorems that the long record for Erdős problem #257 states in sections the unnumbered section uniqueness for gap-dominated finite weights, the unnumbered section a geometric form of the quotient condition, the unnumbered section bounds for a general coefficient sequence and the unnumbered section restrictions on a support with rational value: the proposition “Gap domination of the integer weights”, as localMersenneWeights_gapDominates_odd; the proposition “Uniqueness of the finite greedy representation”, as localMersenneHalfTarget_lower_word_eq_greedy_and_remainder_eq; the theorem “A division-free form of the binary bound”, as localMersenneQuotient_eq_geometric, localBinarySuffix_two_mul_sub_two_lt_criticalCapacity_iff_geometric and localBinarySuffix_two_mul_sub_two_lt_criticalCapacity_iff_geometricCore; the theorem “An upper bound for a binary coefficient tail”, as binaryCoeffTail_div_pow_tendsto_zero and binaryCoeffTail_le; the theorem “Rationality through an integer recurrence”, as not_irrational_binaryCoeffSeries_iff_exists_temperedBinaryOrbit; the theorem “Möbius inversion of the divisor counts”, as mobius_supportCoeff_boolean, mobius_supportCoeff_eq_one_iff and moebius_mul_supportCoeffAF; the theorem “The support series as a coefficient series”, as supportCoeff_le_card_divisors, supportCoeff_le_self, erdosSupportSeries_rational_iff_exists_temperedCarry and erdosSupportSeries_two_eq_binaryCoeffSeries; the theorem “A restriction on dyadic rational values”, as dyadic_support_fraction_reciprocalMass_diverges_or_gt_one and one_lt_reciprocalMass_of_dyadic_support_fraction_of_two_pos_mem; the theorem “Unboundedness of a positive shifted recurrence”, as exists_unbounded_shifted_odd_tail_nat_state_of_support_fraction.

    16 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 2 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #257 remains open, and no theorem in this entry decides it.
