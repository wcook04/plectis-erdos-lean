version: v0.4
project:
  name: 'Erdős #257, the twenty one fatal branch family'
  description: >-
    This entry states 5 theorems of the twenty one fatal branch development of the Lean formalisation of Erdős problem #257, to which no paper statement is bound. twentyOneClosedRow_forces_quotientGreedy: Closed row canonicalisation: if a Boolean word has the same length as the local Mersenne weight list at binary scale 2R through rank R, its selected weight plus a residual s equals the denominator twenty one capacity at that scale, and the residual satisfies s at most 2 to the power R, then the word is exactly the integer greedy word and s is exactly the greedy remainder. one_div_twenty_one_mem_mersenneAchievementSet_of_closedLowerStates: Conditional on the closed lower state supply condition, one over twenty one belongs to the base two Mersenne achievement set. one_div_twenty_one_mem_iff_not_fatalAlignedBranch: Membership of one over twenty one in the base two Mersenne achievement set is equivalent to the failure of the explicit fatal aligned branch. twentyOneFatalAlignedBranch_eventually_strict_supercapacity: Inside the fatal aligned branch, the canonical quotient greedy remainder eventually stays strictly above the closed binary capacity, that is there is a threshold beyond which 2 to the power R is strictly below the greedy remainder at every rank R. twentyOneFatalAlignedBranch_eventually_affine_supercapacity: Inside the fatal aligned branch, the greedy support and remainder eventually follow one exact affine recurrence: beyond a threshold the support at R+1 is the support at R with the rank R+1 inserted, and the remainder at R+1 equals four times the remainder at R plus the target two step pulse at binary scale 2R, minus the two step divisor pulse of the support at that scale, and then minus the sum of 2 to the power R+1 and 1.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #257 remains open, and no theorem in this entry decides it.
