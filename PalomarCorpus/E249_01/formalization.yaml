version: v0.4
project:
  name: 'Erdős #249, record section 1.1: unconditional results'
  description: >-
    This entry states 23 theorems that the long record for Erdős problem #249 states in section 1.1 (unconditional results): the theorem “Denominator exclusion from a fixed Farey window” (section 1.1), as tsum_totient_div_pow_two_ne_ratCast_of_den_le_79639646646701375323355774875831053 and gap_check_window_1_240_first_failure; the proposition “Finite certificate computations” (section 1.1), as certifiedKill_all_upto_sixteen, certifiedKill_diagonal_all_imported_through_t64, certifiedKill_101_300, certifiedKill_121_300, certifiedKill_125_300, certifiedKill_127_300, certifiedKill_128_300, certifiedKill_67_300, certifiedKill_81_300, certifiedKill_97_300, exists_diagonalKill_le_82 and certifiedKill_diagonal_t64; the proposition “Positivity does not exclude an integer” (section 1.1), as actualLcmTailDiff_shift_pos, actualLcm_integral_forces_topEdgeResidue and carryOrbit_eq_tail_diff; the proposition “Equivalent certificate conditions” (section 1.1), as irrational_totient_series_iff_lcm_diagonal_certificate_supply, dtwWindowSeparatedPairs_iff_irrational_totient_series, irrational_totient_series_iff_certificate_supply, irrational_totientSeries_iff_cofinalDirectedLcmCertificateSupply and periodMultipleKillSupply_iff_irrational; the proposition “A rational sequence preserving size bounds, parity and aperiodicity” (section 1.1), as exists_totientParity_arbitrarilyManySeparatedCarry_rational_countermodel.

    15 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 8 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #249 remains open, and no theorem in this entry decides it.
