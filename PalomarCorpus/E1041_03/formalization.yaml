version: v0.4
project:
  name: 'Erdős #1041, record section 7.1: collinear roots and Chebyshev comparison'
  description: >-
    This entry states 12 theorems that the long record for Erdős problem #1041 states in section 7.1 (collinear roots and Chebyshev comparison): the theorem “Chebyshev comparison” (section 7.1), as exists_peak_le_comparisonBound; the theorem “a sharp bound for collinear roots” (section 7.1), as collinearDiameterBound_sharpConstant, exists_collinear_factorisation, sharpConstant_le_of_collinearDiameterBound, sharp_collinear_root_diameter, sharp_collinear_root_diameter_monic, chebyshev_configuration_attains, exists_gap_le_comparisonBound, monicScaledChebyshev_eq_prod and sharp_collinear_equality_attained; the corollary “collinear Erdős case” (section 7.1), as collinear_erdos_1041 and collinear_erdos_1041_monic.

    12 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    A degree-seven counterexample due to ani, formalised in this corpus, refutes the total-variation formulation of Erdős problem #1041; the theorems in this entry keep their stated hypotheses.
