version: v0.4
project:
  name: 'Erdős #1049, record section 10.3: a restriction on Mahler functional equations'
  description: >-
    This entry states 2 theorems that the long record for Erdős problem #1049 states in section 10.3 (a restriction on Mahler functional equations): the proposition “no finite simultaneous 2/3-system” (section 10.3), as no_finite_simultaneous_two_three_system and no_finite_simultaneous_two_three_system_unconditional.

    2 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #1049 remains open, and no theorem in this entry decides it.
