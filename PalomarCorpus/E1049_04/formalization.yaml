version: v0.4
project:
  name: 'Erdős #1049, record sections 3 to 4: power comparisons and Hankel determinants; rescaling integer rows'
  description: >-
    This entry states 10 theorems that the long record for Erdős problem #1049 states in sections 3 (power comparisons and Hankel determinants) and 4 (rescaling integer rows): the theorem “the first nonzero term at every rank” (section 3.1), as order_zudilinNormalizedHankelDet_all; the lemma “a coefficient of each transformed row” (section 3.1), as paperE_eq_rowExponent, paperRatio_agree, paperReciprocal_rec, paperReciprocal_zero, all_row_initial, all_row_initial_dvd and all_row_initial_reciprocal; the proposition “finite coefficient positivity and pencil roots” (section 3.2), as coefficientPencil_finitePencil; the theorem “rescaling rows and their determinant” (section 4), as integer_scalar_content.

    6 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 4 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #1049 remains open, and no theorem in this entry decides it.
