version: v0.4
project:
  name: 'Erdős #249, record sections 12.3 to 12.5: the four-term decomposition; depth equal to a period multiple'
  description: >-
    This entry states 3 theorems that the long record for Erdős problem #249 states in sections 12.3 (the four-term decomposition) and 12.5 (depth equal to a period multiple): the proposition “A one-sided bound for the unassigned terms” (section 12.3), as prop_dickman; the proposition labelled prop:route4 (section 12.5), as bracket_of_two_sided_separation and certifiedKill_of_fullDepth_phase_separation.

    2 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 1 is derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #249 remains open, and no theorem in this entry decides it.
