version: v0.4
project:
  name: 'Erdős #257: one-step quotient identities; bounds for the remaining binary positions; doubling the endpoint'
  description: >-
    This entry states 24 theorems that the long record for Erdős problem #257 states in sections the unnumbered section one-step quotient identities, the unnumbered section bounds for the remaining binary positions, the unnumbered section doubling the endpoint, the unnumbered section approximation error and finite denominators and the unnumbered section uniqueness for gap-dominated finite weights: the theorem “The next floor quotient”, as paper_floor_quotient_geometric_sum, paper_next_floor_quotient, paper_next_floor_quotient_no_fixed_point and paper_next_quotient_sum; the theorem “The next quotient sum”, as localPrefixQuotient_succ; the theorem “The signed endpoint recurrence”, as paper_repair_integer_eq_endpoint_defect, paper_signed_endpoint_defect_succ, paper_signed_endpoint_recurrence and paper_endpoint_term_counts_divisors; the theorem “Equivalent forms of the sharper bound”, as localBinarySuffix_two_mul_sub_two_lt_criticalCapacity_iff; the theorem “An unconditional bound with one extra bit”, as paper_capacity_band_exclusion, paper_sharper_additive_estimate and paper_unconditional_bound_one_extra_bit; the theorem “The binary bound after doubling”, as exists_exactRowStrictUpperExtension_two_mul_sub_one_of_exact_below and localBinarySuffix_two_mul_sub_one_lt_upperWindow_of_exact_below; the proposition “Every exact sum contains exponent two”, as two_mem_of_exact_localMersenneQuotient; the proposition “Error in the finite subseries value”, as abs_localMersennePrefixValue_sub_half_le; the proposition “No finite support has value one half”, as paper_finite_sum_inv_odd_den_odd, paper_finite_sum_inv_odd_ne_half, paper_finiteErdosSum_den_odd, paper_finite_support_series_ne_half and paper_half_representing_support_is_infinite; the proposition “Gap domination of the integer weights”, as localMersenneWeightsFrom_gapDominates and localMersenneWeights_gapDominates_even.

    20 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 4 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #257 remains open, and no theorem in this entry decides it.
