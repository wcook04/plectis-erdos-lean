version: v0.4
project:
  name: 'Erdős #269, the integral branch pinning and three prime structure families'
  description: >-
    This entry states 11 theorems of the integral branch pinning and three prime structure developments of the Lean formalisation of Erdős problem #269, to which no paper statement is bound. trueNormalizedState_pinning: For every scale `a` the genuine state satisfies `X a = m a / b a + X (a + 1) / b a`, with the actual ordered digit and the actual radix cast to the reals, so each state equals its digit anchor `m a / b a` plus the next state divided by the same radix. trueNormalizedState_eq_telescope: For every base index `m` and depth `K`, the genuine state at `m` equals the finite mixed-radix sum of the ordered digits at `m, ..., m + K - 1` divided by the running products of the radices, plus the exact remainder `(H (2 ^ m) / 2)` times the tail at `m + K`. integral_state_upward_closed: If the genuine state equals an integer at one scale `a`, then it equals an integer at every scale `n` at least `a`. surviving_window_orbit_eq_true_state: A rigidity statement from a base index `A`: if a real sequence `y` satisfies the actual recurrence `y (n + 1) = b n * y n - m n` at every `n` at least `A`, if both `y n` and the genuine state lie in the window that is open at `m n / b n` and closed at `m n / b n + width n` for every such `n`, and if `width (A + k) / 2 ^ k` falls below every positive bound for all large `k`, then `y A` equals the genuine state at `A`. smoothPrefixLcm_eq_threePrimeHeight: For pairwise distinct primes `p`, `q`, `r` and every nonzero `x`, the least common multiple of the `{p, q, r}`-smooth numbers at most `x` equals `p ^ Nat.log p x * q ^ Nat.log q x * r ^ Nat.log r x`, the product of the three maximal pure prime powers not exceeding `x`. threePrimeKernelQ_eq_of_sameLogCell: With no hypothesis on the generators, the kernel takes equal values at two exponent triples whose smooth values lie in the same logarithmic cell, that is whose three integer logarithms in the bases `p`, `q` and `r` agree. threePrimePositiveJumpSet_card: For pairwise distinct primes `p`, `q`, `r`, the first `count` positive powers in the three channels are all distinct, so the jump set has exactly `3 * count` elements. smoothExponentShell_card_quadratic: Under the hypotheses that `r` is positive, the shell width satisfies `hi ≤ r * lo`, the exponent bounds are sorted as `hp ≤ hq ≤ hr`, and `hp + hq + hr = j`, nine times the cardinality of the exponent shell is at most `(j + 3) ^ 2`. kernel_235_minor_eq_neg_one_fifteen: The two by two minor of the `{2,3,5}` kernel on the exponent pairs `(0,0)`, `(1,1)`, `(1,0)` and `(0,1)` in the layer `k = 0` equals `-1/15`; those four entries are `1`, `1/60`, `1/2` and `1/6` in that order, so the determinant is `1/60 - 1/12`. exists_uniform_nonsingular_threePrimeKernel_minor: For natural numbers `p`, `q`, `r` each greater than 1 such that neither `Real.logb r p` nor `Real.logb r q` has a positive integer multiple that is an integer, and for every order `n`, there are injective index maps `I` and `J` from `Fin n` to the naturals such that the `n` by `n` determinant of the kernel entries `K (I a) (J b) k` is nonzero for every value `k` of the third exponent, with one choice of `I` and `J` valid in all layers at once. threePrimeKernel_infiniteRank_and_noFiniteSeparation: For primes `p`, `q`, `r` with `p ≠ r` and `q ≠ r`, and with no hypothesis relating `p` and `q`, two conclusions hold: for every order `n` there are injective index maps giving a nonzero `n` by `n` kernel minor simultaneously in every layer `k`; and for no natural number `d` are there rational-valued functions `f` and `G` with `K i j k` equal to the sum over `l < d` of `f l i * G l j k` for all `i`, `j`, `k`.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #269 remains open, and no theorem in this entry decides it.
