version: v0.4
project:
  name: 'Erdős #243, record sections 7 to 9: new maxima of reduced numerators; descent when the error is nonnegative; when the negative error is constant'
  description: >-
    This entry states 17 theorems that the long record for Erdős problem #243 states in sections 7 (new maxima of reduced numerators), 8 (descent when the error is nonnegative) and 9 (when the negative error is constant): the proposition “comparison of the two signs” (section 7.5), as growthDefect_eq_neg_relativeError_add_shiftedCorrection, shiftedCorrectionTerm_pos_and_lt_three_div, sylvesterTail_shiftedCorrection, canonicalCorrection_pos_and_lt_three_div, canonical_growthDefect_identity, canonicalError_div_overlapDebt, digitProductScale_eq_canonicalDenominator, erdosStrausQuantity_ne_productDefect_ne_lcmShift, erdosStrausQuantity_sign, erdosStraus_lcm_includes_digit_not_denominator, overlapDebt_dvd_gcd and overlapDebt_mul_lcmClearedNumerator; the proposition “an elementary interval bound” (section 7.5), as exists_avoiding_in_window and exists_slow_rise_avoiding_sequence; the theorem “descent” (section 8), as centeredState_eventually_zero; the theorem “no constant negative magnitude” (section 9), as no_constantNegative_shapeEquation and no_eventuallyConstantNegative_shapeEquation.

    7 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 10 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #243 remains open, and no theorem in this entry decides it.
