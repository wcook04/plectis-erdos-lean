version: v0.4
project:
  name: 'Erdős #257, record sections 12 to 13: what is open, stated exactly; logarithmic cost under arithmetic sampling'
  description: >-
    This entry states 9 theorems that the long record for Erdős problem #257 states in sections 12 (what is open, stated exactly) and 13 (logarithmic cost under arithmetic sampling): the proposition “Infinitely many positive skips are equivalent to half-membership” (section 12.3.1), as paper_cpgs_equiv; the proposition “Terminal carry bounds are equivalent to half-membership” (section 12.3.1), as paper_relaxed_constant_six_every_depth and paper_terminal_strip_equiv; the theorem “arithmetic logarithmic counterexample” (section 13.1), as arithmetic_logarithmic_counterexample and no_absolute_dyadic_kappaOne_constant; the corollary “finite-functional separation” (section 13.2), as exists_support_paperCoverCost_ge, no_absolute_paperCoverCost_kappaOne_constant and sup_condExceedProb_le_paperCoverCost; the proposition “ordinary initial intervals” (section 13.3), as logarithmic_initial_interval.

    2 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 7 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #257 remains open, and no theorem in this entry decides it.
