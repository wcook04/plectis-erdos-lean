version: v0.4
project:
  name: 'Erdős #249, record section 6.4: further exact identities (part 2 of 3)'
  description: >-
    This entry states 22 theorems that the long record for Erdős problem #249 states in section 6.4 (further exact identities): the proposition “The factor in a second difference” (section 6.4), as fixedRank_cleanWindow_structure and two_mul_totient_dvd_totient_second_difference; the proposition “Carry displacement and tail integrality” (section 6.4), as carryShift_dvd_iff_tailDiff_integral and temperedCarry_eq_scaledTail_and_shift; the proposition “A consequence of rationality and its limitation” (section 6.4), as rationality_forces_mod_period_and_unbounded_rank; the proposition “A totient difference congruent to two modulo four” (section 6.4), as exists_prime_totient_shift_four_mul_congr_two_mod_four; the proposition “An arbitrarily long zero prefix followed by a two-adic pulse” (section 6.4), as exists_prime_integral_tailDiff_half_pulse, exists_prime_twoAdic_pulse_block and pulse_delta_of_divisor_data; the proposition “A Möbius-inversion formula for the tail” (section 6.4), as forwardMultipleShift_least, forwardMultiple_enumeration, forwardMultiple_spec and totientTail_eq_tsum_mobius_inversion; the proposition “Explicit finite examples” (section 6.4), as shortWindow_inequalities, actualLcmTailOrbit_eq_tail_difference and shortWindow_certificates_kill_omega_four_and_six; the proposition “Rationality gives an eventual tail period” (section 6.4), as totient_one_eq_one, eventual_tail_period_of_not_irrational, exists_certifiedKill_iff_tail_diff_nonintegral, irrational_of_certificate_supply, rational_tail_period_explicit_witnesses and tail_diff_notMem_int_of_irrational.

    19 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 3 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #249 remains open, and no theorem in this entry decides it.
