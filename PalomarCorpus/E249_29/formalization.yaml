version: v0.4
project:
  name: 'All-base bases and integral relations for the totient kernel'
  description: >-
    For every integer base k at least two and depth e at least one, the rational span of the sections n ↦ φ(k^j n+r) through level e has dimension k^e+1. An explicit retained family is a basis, every omitted section is an integer multiple of a retained section, and these reductions form a basis for all integral relations, with rank Σ_(1≤j<e) k^j. The entry also gives the full dyadic basis and an affine independence theorem. The retained positive residues satisfy k ∤ r, a weaker condition than gcd(k,r)=1. Martin’s earlier theorem already implies affine independence, and Coons proved non-k-regularity; the exact finite-level basis and integral normal form are the contribution here. This configuration does not prove irrationality of Σ φ(n)2^(-n). The retained family includes φ(n), φ(kn), and all positive residues r with k ∤ r at every level through e. The integral relations are indexed by omitted channels, each with coefficient one at its own channel, which supplies uniqueness over Z.
  authors:
  - Will Cook
  license: Apache-2.0
  responsible_maintainers:
  - Will Cook
