version: v0.4
project:
  name: 'Erdős #249, note section 1; the totient kernel basis family: a basis and all its relations; proof of the basis theorem'
  description: >-
    This entry states 3 theorems that only the short note for Erdős problem #249 states, in sections 1 (a basis and all its relations) and 1.1 (proof of the basis theorem): the theorem “A basis through each finite level” (section 1), as displayed_all_base_kernel; the corollary “Dyadic basis” (section 1.1), as displayed_full_dyadic_basis; the corollary “Integral coordinates and all integral relations” (section 1.1), as displayed_integral_normal_form.

    It also states 2 theorems of the totient kernel basis development of the Lean formalisation of Erdős problem #249, to which no paper statement is bound. allSlopeAffineTotientFormsLinearIndependent: All-slope affine independence: for a finite index type and affine forms `a i · n + b i` with `a i > 0` and `b i > 0` that are pairwise non-proportional, meaning `a i · b j ≠ a j · b i` whenever `i ≠ j`, the sequences `n ↦ φ(a i n + b i)` are linearly independent over `ℚ`. allBaseTotientKernelBasisRankAndRelationDimension: Unconditional all-base structure theorem: for every base `k ≥ 2` and depth `e ≥ 1`, the canonical family is `ℚ`-linearly independent, it spans the same subspace as the complete unreduced family through level `e`, that span therefore carries a basis indexed by the canonical index, its `finrank` is exactly `k ^ e + 1`, and the relation module has `finrank` exactly `∑_{1 ≤ j < e} k ^ j`.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #249 remains open, and no theorem in this entry decides it.
