version: v0.4
project:
  name: 'Erdős #257, record section 6.2: exact identities and reductions (part 5 of 6)'
  description: >-
    This entry states 17 theorems that the long record for Erdős problem #257 states in section 6.2 (exact identities and reductions): the lemma “Spacing of reverse-carry words” (section 6.2), as paper_reverse_carry_word and reverse_carry_word_common_bound_sharp; the lemma “Linear functionals factoring through one value” (section 6.2), as linearDescender_eq_smul_eval and relationInvariantLinearChannels_det_eq_zero; the theorem “Two-thirds band: exact localisation of post-take skip-unsafety” (section 6.2), as paper_two_thirds_band; the theorem “A weaker sufficient test against the remaining tail” (section 6.2), as paper_sharp_fatal_gap; the lemma “Summability of one gap length per level” (section 6.2), as mersenneGap_pos, mersenneGap_tail_le, summable_mersenneGap_succ and tendsto_mersenneGap_tail_zero; the lemma “The effect of adding one divisor” (section 6.2), as supportCoeff_extend_true_eq_false_add_one_at_double and supportCoeff_insert_eq_add_indicator; the theorem “Uniqueness of an integer recurrence with a vanishing scaled limit” (section 6.2), as binaryCoeffSeries_rational_iff_exists_temperedBinaryOrbit and temperedBinaryOrbit_eq_scaledTail; the lemma “Changing finitely many support elements” (section 6.2), as irrational_erdosSupportSeries_of_tail and irrational_erdosSupportSeries_tail_of_irrational; the lemma “An integer test for the interval between the dyadic and Mersenne weights” (section 6.2), as divInt_le_nextDyadic_iff_excess_nonpos.

    15 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 2 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #257 remains open, and no theorem in this entry decides it.
