version: v0.4
project:
  name: 'Erdős #257, record section 6.2: exact identities and reductions (part 1 of 6)'
  description: >-
    This entry states 11 theorems that the long record for Erdős problem #257 states in section 6.2 (exact identities and reductions): the theorem “The Lambert-series identity for the Möbius function” (section 6.2), as tsum_moebius_div_two_pow_sub_one_eq_half; the corollary “Negative-Möbius Boolean support overshoots 1/2” (section 6.2), as half_lt_tsum_negativeMobius and tsum_negativeMobius_eq_half_add_positiveMobiusTail; the theorem “The half-skip dichotomy via Erdős-Borwein irrationality” (section 6.2), as irrational_erdosBorweinMersenneConstant and half_mem_mersenneAchievementSet_iff_greedySkippedSupport_infinite; the theorem “Equivalent descriptions of half-membership” (section 6.2), as half_mem_mersenneAchievementSet_iff_no_lastHalfGreedySkip, half_mem_mersenneAchievementSet_iff_cofinalTerminalFalse, half_mem_mersenneAchievementSet_iff_exists_unboundedSkippedRanksAlong, half_mem_mersenneAchievementSet_iff_not_seamGreedyEventuallyRight, half_mem_mersenneAchievementSet_iff_unboundedTerminalFalse and unboundedTerminalFalse_iff_greedyMersenneSkippedSupport_infinite.

    4 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 7 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #257 remains open, and no theorem in this entry decides it.
