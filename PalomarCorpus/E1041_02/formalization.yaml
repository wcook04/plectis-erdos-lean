version: v0.4
project:
  name: 'Erdős #1041, record sections 4 to 7; the cubic path family: a path estimate from area and boundary length; degree three; collinear roots and two sparse polynomial families'
  description: >-
    This entry states 6 theorems that the long record for Erdős problem #1041 states in sections 4 (a path estimate from area and boundary length), 5 (degree three) and 7 (collinear roots and two sparse polynomial families): the theorem “a uniform path bound at level 2μ” (section 4), as cfa_constant_factor_path; the corollary “a criterion using the number of roots at the first merger” (section 4), as cfa_arity_criterion; the corollary “a criterion using component capacity” (section 4), as cfa_capacity_criterion; the theorem “a path from a subcritical perimeter bound” (section 4), as subcritical_perimeter_path_paper; the theorem “the cubic case” (section 5), as cubic_paper_complete; the theorem “a cubic composed with a power map” (section 7.3), as complete_translated_cubic_quotient_fibres.

    It also states 1 theorem of the cubic path development of the Lean formalisation of Erdős problem #1041, to which no paper statement is bound. monic_cubic_connector: The same degree-three theorem with the cubic given by monicity and degree in place of a root list: for monic p of natural degree 3 every zero of which has modulus strictly below 1, there are zeros a and b of p and a hub c such that hub a c b is continuous, has bounded variation on Icc 0 2, satisfies ‖p.eval (hub a c b t)‖ < 1 for every t in Icc 0 2, and has extended variation strictly below ENNReal.ofReal 2; a second existential gives some curve γ continuous on Icc 0 2 with γ 0 = a, γ 2 = b and the same bounds, without asserting that γ is that hub path.

    cfa_constant_factor_path assumes the named input CFAPathConstruction as a hypothesis: for every monic complex polynomial f of degree n ≥ 3 with root enumeration z whose least modulus at a critical point is μ > 0, and all r with 0 < r < 1 and λ > 1, there is k ≥ 2 such that two zero occurrences of f are joined inside the open sublevel set {|f| < λμ} by a continuous path of length at most the paper's bracket (CF) at (n, k, λ, r) times μ^(1/n). This is the paper's own constant-factor construction, whose proof uses Pólya's area inequality, the Koebe distortion theorem and the coarea formula; this repository does not formalise it.

    cfa_arity_criterion assumes the named input CFAArityConstruction as a hypothesis: when μ > 0, at least one of three cases holds: μ ≤ 1/2 and k₀ ≥ 17, μ ≤ 1/4 and k₀ ≥ 12, or μ ≤ 1/8 and k₀ ≥ 10, and in that case two zero occurrences of f are joined inside {|f| < 1} by a continuous path of length at most √(2/k₀) times √2 r/(1 - r)² + √(log(λ/r)) + π/√(log λ), with (λ, r) equal to (2, 13/100), (4, 3/25) or (8, 11/100) respectively. This is the paper's own arity construction, the constant-factor construction specialised to the first-merge component; this repository does not formalise it.

    cfa_capacity_criterion assumes the named input CFACapacityConstruction as a hypothesis: two zero occurrences of f are joined inside {|f| < 1} by a continuous path of length at most √(2/k₀) times √2 (1/20)/(1 - 1/20)² + κ(√(log 40) + π/√(log 2)), where κ is the paper's capacity ratio of the component of {|f| < 2μ} containing the first-merge critical point. This is the paper's own capacity construction, which reruns the averaging proof with the area-capacity inequality on that component; this repository does not formalise it, and the pinned Mathlib has no logarithmic capacity.

    subcritical_perimeter_path_paper assumes the named input SubcriticalSplitExists as a hypothesis: there are distinct roots a and b of the polynomial and sets U_a and U_b containing them whose frontiers share a point, each frontier of one-dimensional Hausdorff measure at most β μ^(1/n), and each set joining every interior point to every frontier point inside {|p| ≤ μ} by a path of length at most half its perimeter. It packages classical results that this repository does not formalise: the component-wise Riemann-Hurwitz count of Ebenfelt, Khavinson and Shapiro (Contemporary Mathematics 553, 2011, Proposition 2.1), the continuous extension of an inverse branch at a critical point, lower semicontinuity of length under uniform convergence, and the Jordan curve theorem.

    4 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    A degree-seven counterexample due to ani, formalised in this corpus, refutes the total-variation formulation of Erdős problem #1041; the theorems in this entry keep their stated hypotheses.
