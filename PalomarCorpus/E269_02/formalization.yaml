version: v0.4
project:
  name: Infinite rank of the three-prime running-LCM kernel
  description: For pairwise distinct primes p, q and r, the three-prime reciprocal running-LCM kernel
    has nonzero square minors of every order, with row and column indices chosen independently of the
    third exponent. Consequently it admits no finite rational separated representation. The selected entry
    also proves an exact rank formula for threshold-column matrices, an explicit two-by-two example at
    2,3,5, separation in the two-prime comparison, and the four-base dyadic recurrence for the actual
    2,3,5 sum. A uniform finite-rank approximation statement concerns the rescaled carry matrix. The stronger
    unit-determinant modular minors are in E269_08 and are outside this configuration. Infinite kernel
    rank does not prove irrationality of the running-LCM series. In the selected rank theorem the determinants
    remain nonzero for every fixed third exponent k using the same injective row and column maps. The
    distance theorem concerns a rescaled real carry matrix and is not an approximation lower bound for
    the original summable kernel.
  authors:
  - Will Cook
  license: Apache-2.0
  responsible_maintainers:
  - Will Cook
