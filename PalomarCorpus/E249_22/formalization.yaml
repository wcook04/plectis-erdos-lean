version: v0.4
project:
  name: 'Erdős #249, record sections 9.3.1 to 9.3.2: positivity and the remaining residue inequality; an exact endpoint identity'
  description: >-
    This entry states 15 theorems that the long record for Erdős problem #249 states in sections 9.3.1 (positivity and the remaining residue inequality) and 9.3.2 (an exact endpoint identity): the theorem labelled statement:sha256:f1520b262b31fe4b136f140f7a811f92f2d8398ab99dfda36cf2c46892e72f6a (section 9.3.1), as actualLcm_corridor_pos, corridor_height_lt_letter and corridor_letter_pos; the theorem “The proved implications” (section 9.3.2), as irrational_of_topEdgeResidueGapSupply, topEdgeResidueGap_forces_nonintegral, topEdgeResidueGap_orbit_nonintegral and topEdgeResidueGap_unfolded; the proposition “Five sufficient conditions” (section 9.3.2), as irrational_of_paperAdjacentSuffixMidbandSupply, paperAdjacentSuffixMidbandSupply_of_adjacentSuffixMidband, paperAdjacentSuffixMidbandSupply_of_flexibleActualTopEdgeMagnitude, paperAdjacentSuffixMidbandSupply_of_oddGuardTopEdgeHalfWordBand, paperTeChain_fifth_gives_nonintegrality, paperTeChain_first_four_imply_topEdgeSupply, paperTeChain_five_sufficient_for_irrationality and paperTeChain_item_one_unfolded.

    15 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #249 remains open, and no theorem in this entry decides it.
