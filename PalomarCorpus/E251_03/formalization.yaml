version: v0.4
project:
  name: 'Erdős #251, record sections 8.2 to 8.6: algebraic nonconcentration survives the rationalising perturbation; the two-window event has density zero; recurring gap values differing by two do not suffice'
  description: >-
    This entry states 10 theorems that the long record for Erdős problem #251 states in sections 8.2 (algebraic nonconcentration survives the rationalising perturbation), 8.3 (the two-window event has density zero), 8.4 (recurring gap values differing by two do not suffice) and 8.6 (polynomial coefficients and telescoping sums): the proposition “finite counting for shifted gap differences” (section 8.2), as shifted_count_bound; the theorem “nonconcentration is perturbation-stable” (section 8.2), as finite_perturbation_stability; the corollary “nonconcentration does not force irrationality” (section 8.2), as nonconcentration_does_not_force_irrationality; the proposition “nonconcentration under sparse changes” (section 8.2), as sparse_nonconcentration; the corollary “simultaneous prime-gap countermodel” (section 8.2), as long_joint_prime_gap_countermodel; the theorem “sparsity of the two-window event” (section 8.3), as prime_gap_equal_shift_zeroDensity and prime_gap_two_window_sparse; the theorem “recurring values are not enough” (section 8.4), as exists_logarithmic_recurring_values_countermodel; the proposition “quadratic polynomial-shift countermodel” (section 8.6), as polynomial_countermodel; the proposition “exact telescoping” (section 8.6), as carryPartialSum_eq.

    nonconcentration_does_not_force_irrationality and long_joint_prime_gap_countermodel assume the named input PrimeNumberTheorem as a hypothesis: the prime number theorem in the form p_n / (n log n) → 1, where p_n is the n-th prime counted from p_0 = 2. This is the prime number theorem of Hadamard and de la Vallée Poussin (1896); it enters as a hypothesis and this repository does not prove it.

    nonconcentration_does_not_force_irrationality, long_joint_prime_gap_countermodel, prime_gap_equal_shift_zeroDensity and prime_gap_two_window_sparse assume the named input SchlagePuchtaLemma4 as a hypothesis: for every k and every nonzero polynomial F in k + 1 variables with integer coefficients, the indices n with F(g_n, g_(n+1), ..., g_(n+k)) = 0 form a set of natural density zero, where g_n = p_(n+1) - p_n is the n-th gap between consecutive primes. This is Lemma 4 of Schlage-Puchta (Acta Arithmetica 126, 2007), proved there with Selberg's sieve; it is a published result that this repository does not formalise.

    8 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 2 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #251 remains open, and no theorem in this entry decides it.
