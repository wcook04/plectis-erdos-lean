version: v0.4
project:
  name: 'Erdős #249, record sections 9.3.10 to 9.3.13: the residue margin at an LCM jump; a certificate for a four-tail combination; denominators of Möbius sums'
  description: >-
    This entry states 23 theorems that the long record for Erdős problem #249 states in sections 9.3.10 (the residue margin at an LCM jump), 9.3.11 (a certificate for a four-tail combination), 9.3.12 (denominators of Möbius sums) and 9.3.13 (rationality and carry rank): the theorem “Arbitrarily large prime-power LCM jumps” (section 9.3.10), as periodLcm_strict_jump_at_prime_pred and periodLcm_zero_and_one_eq_one; the proposition “A sufficient inequality” (section 9.3.10), as canonicalAdjacentSuffixCentralSlack_paper_formula and irrational_of_powerTwo_postJump_slack_supply; the theorem labelled statement:sha256:c3e694410757f100030d20cf579a0a491038962e9fe8adb5cc75fde4a76cf0ea (section 9.3.11), as primeJumpSharpRadius_formula, primeJumpSharpRadius_lt_twoCellRadius, primeJumpSharpRadius_saves_pH and primeJumpTailCommutator_notMem_int_of_central_window; the theorem “One explicit witness” (section 9.3.11), as irrational_of_primeJumpSharp_supply, periodLcm_four_eq_twelve, primeJumpTailCommutator_twelve_five_notMem_int and primeJump_witness_twelve_five_values; the theorem labelled statement:sha256:6818675acca63a0990cb479014c18be286f96c48b5cf51f4bb509f1b62e1e265 (section 9.3.12), as lcmHeight_eq_periodLcm, exists_upperHalf_channel_paper, upperHalfMersenneProduct_between_bounds, upperHalfPrimes_member_bounds, upperHalfPrimes_nonempty_paper and upperHalfPrimes_spec; the proposition “The additional approximation hypothesis” (section 9.3.12), as den_mul_abs_sub_ge_one_div_den and irrational_totientSeries_of_rational_separation; the theorem labelled statement:sha256:2e67fcb025e18410bcdb03ab51508f2c1632a1198d264087e535d47d18963919 (section 9.3.13), as canonicalTotientKernelFamily_entries, completeLevelZeroTruncation_is_totient_and_rank_one and retainedSections_basis_and_rank.

    18 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 5 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #249 remains open, and no theorem in this entry decides it.
