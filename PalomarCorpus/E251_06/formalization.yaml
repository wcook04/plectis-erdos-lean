  type: "paper"
  relationship: "background"
  note: "Section 7 proves a dyadic irrationality theorem for bounded digits recording comparisons of largest prime factors; the prime numerators and prime gaps treated here are unbounded, so that theorem is context and supplies no step of any proof in this entry."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "Erdős Problem #251 problem page and comment thread"
