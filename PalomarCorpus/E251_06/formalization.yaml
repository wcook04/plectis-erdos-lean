  license: "unknown"
  author_endorsement: "not-contacted"
- title: "On the Erdős problem #251"
  authors:
  - "V. Kovač"
  id: "https://web.math.pmf.unizg.hr/~vjekovac/files/Erdos_problem_251.pdf"
  type: "other"
  relationship: "background"
  note: "Refutes by a telescoping construction the adjacent variable-denominator conjecture printed under the same catalogue number, and leaves the fixed-denominator question of this entry undecided; the quadratic countermodel here uses a construction of the same species and claims no priority over it. The note records a language model run orchestrated by the named author."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "On several irrationality problems for Ahmes series"
  authors:
  - "V. Kovač"
  - "Terence Tao"
  id: "10.1007/s10474-025-01528-0"
  type: "paper"
  relationship: "background"
  note: "Recent work on irrationality of series with prescribed denominators, which locates the research area of this entry; no lemma of that paper is used in any declaration here."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "The irrationality of some number theoretical series"
  authors:
  - "Jan-Christoph Schlage-Puchta"
  id: "arXiv:1105.1451"
  type: "paper"
  relationship: "background"
  note: "The nearest located neighbour for the tail criteria recorded here, with no antecedent located: its Theorem 2 treats base-b digit strings that concatenate the representations of a slowly growing integer sequence, and its Theorem 3 gives linear independence over the rationals for series of prime powers over factorials. Its Lemma 4, a Selberg-sieve density-zero statement for polynomial relations among consecutive prime gaps, is used in the companion reasoning record; the compared declarations that need it carry it as the named hypothesis SchlagePuchtaLemma4 and do not formalise it."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "Bounded gaps between primes"
  authors:
  - "Yitang Zhang"
  id: "10.4007/annals.2014.179.3.7"
  type: "paper"
  relationship: "background"
  note: "Theorem 1 produces infinitely many bounded consecutive-prime gaps; it is recorded to mark the boundary, because it supplies no joint dyadic distribution of a block of consecutive gap differences and is used by no declaration here."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "Small gaps between primes"
  authors:
  - "James Maynard"
  id: "10.4007/annals.2015.181.1.7"
  type: "paper"
  relationship: "background"
  note: "it bounds the lower limit of p(n+m) - p(n) for every fixed m and gives the explicit bound 600 for consecutive gaps; both are context for the open boundary and neither is used by any declaration here."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "Long gaps between primes"
  authors:
  - "Kevin Ford"
  - "Ben Green"
  - "Sergei Konyagin"
  - "James Maynard"
  - "Terence Tao"
  id: "10.1090/jams/876"
  type: "paper"
  relationship: "background"
  note: "Theorem 1 on page 66 gives an effective lower bound for the largest single consecutive-prime gap below a threshold; unboundedness of the gaps is all that the non-periodicity argument here needs, and this stronger theorem supplies no residue-sensitive block estimate used by any declaration."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "A conditional proof of the irrationality of the dyadic prime series under a uniform Hardy-Littlewood prime-tuples conjecture, with a Lean formalisation of the conditional argument, posted in 2026 to the Erdős Problem #251 discussion"
  authors:
  - "J. Land"
  id: "https://github.com/beetree/math_erdos_251"
  type: "web discussion"
  relationship: "background"
  note: "Posted 5 September 2026 on the Erdős Problems discussion thread for #251 with the linked repository; Conjecture 1 there is the large-x form of Conjecture 1.3 of V. Kuperberg. As recorded in the public reasoning record for this problem, Land's argument assumes Kuperberg's uniform Hardy-Littlewood prime-tuples conjecture, constructs weighted prime-gap tails, and comes with a Lean formalisation of that conditional argument. The declarations compared here were proved independently of it and do not use, extend or contradict his conditional theorem; those that are conditional carry the prime number theorem or Schlage-Puchta's Lemma 4 as named hypotheses, none assumes Kuperberg's conjecture, and the parent problem remains open."
  license: "unknown"
  author_endorsement: "not-contacted"
