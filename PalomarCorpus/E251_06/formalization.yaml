version: v0.4
project:
  name: 'Erdős #251, the actual prime gap tail, affine circularity and all residue logarithmic countermodel families'
  description: >-
    This entry states 20 theorems of the actual prime gap tail, affine circularity, all residue logarithmic countermodel, free pair equivalence, kernel denominator floor and lcm diagonal criterion developments of the Lean formalisation of Erdős problem #251, to which no paper statement is bound. exists_rationalPrimeGapTailState_representation_of_not_irrational: Hypothesis: the sum of the prime-gap dyadic series fails to be irrational. rationalPrimeGapTailState_recurrence: For every rational `S`, with no rationality hypothesis on the series, the states `rationalPrimeGapTailState S` satisfy the dyadic tail recurrence whose digits are the actual consecutive prime gaps cast into the integers, that is `T (N + 1) = 2 * T N - g (N + 1)` at every index. rationalPrimeGapTailShift_eventuallyIntegral: For every rational `S` there exist a positive shift length `h` and a threshold `N₀` such that `tailShift (rationalPrimeGapTailState S) h N` is an integer at every index `N` at least `N₀`. rationalPrimeGapTail_has_positive_shift_not_eventually_small: For every rational `S` there exists a positive shift length `h` for which no threshold makes `tailShift (rationalPrimeGapTailState S) h N` lie strictly between -1 and 1 at every later index; non-periodicity of the actual prime gaps drives the denominator-selected integral shift out of the open unit interval infinitely often. adjacent_small_mismatch_iff_signed_two_window: Exact normal form for the adjacent unit-window event. cofinal_affinePowTwo_escape_iff_not_eventuallyIntegral: Route closure for the affine cylinder test. cofinal_blockResidue_escape_iff_not_eventuallyIntegral: Route closure for the fixed-lattice test. exists_every_residue_logarithmic_countermodel: Synthetic countermodel: there are integer sequences `digit`, `carry` and `position` with `position n = 3 + digit 1 + . irrational_primeGap_tsum_iff_cofinalFreePairNonintegral: Erdős problem 251 in free-pair form: the consecutive-prime-gap dyadic series is irrational exactly when its complete scaled real tails satisfy the free-pair criterion, that for every positive modulus and every threshold two indices beyond the threshold and congruent modulo that modulus have a non-integral difference of tails. irrational_initial_iff_cofinalFreePairNonintegral: For every real orbit `T` obeying the dyadic tail recurrence with integer digits `g`, the initial value `T 0` is irrational exactly when `T` satisfies the free-pair criterion. cofinalFreePairNonintegral_iff_cofinalNonintegralTailShifts: For every real orbit obeying the dyadic tail recurrence with integer digits, the free-pair criterion with free offset and the fixed-offset cofinal criterion are equivalent. exists_free_pair_lattice: Every rational orbit obeying the dyadic tail recurrence with integer digits has a threshold `N₀` and a positive modulus `t` such that for all indices `N` and `M` at least `N₀` the difference `T M - T N` is an integer exactly when `N` and `M` are congruent modulo `t`. free_pair_integral_iff_modEq: Supporting lemma identifying the modulus of that lattice: if the rational orbit obeys the dyadic tail recurrence with integer digits and the reduced denominator of `T N₀` is odd, then for indices `N` and `M` at least `N₀` the difference `T M - T N` is an integer exactly when `N` and `M` are congruent modulo the multiplicative order of 2 in the integers modulo that denominator. primeGapRealTail_recurrence: The complete scaled real tails of the prime-gap dyadic series obey the dyadic tail recurrence whose digits are the actual consecutive prime gaps cast into the integers. primeGapRealTail_zero: The tail at index 0 equals `2 * S - 1`, where `S` is the sum of the prime-gap dyadic series, so `S` and that tail have the same rationality status. cert_10000: The Lean kernel re-runs the trial-division sieve over the integers below 10000 and decides that the six conditions of `certCheck` hold for the recorded certificate constants. den_bound_of_certCheck: Hypotheses: the truncation index satisfies `9 <= c`, and `certCheck c u v u' v' X` is true. kernel_denominator_floor: Every representation of the normalised prime dyadic series as `a / b` with an integer `a` and a positive natural `b` has `b` at least `2 ^ 589`, a bound exceeding `10 ^ 177`. kernel_denominator_floor_primeGap: The same floor `2 ^ 589` for every representation `a / b`, with `a` an integer and `b` a positive natural number, of the consecutive-prime-gap dyadic series, whose value is 2 less than the prime series. notIrrationalInitial_iff_exists_integral_positive_tailShift: For every real orbit obeying the dyadic tail recurrence with integer digits, the initial value `T 0` fails to be irrational exactly when some positive shift length `h` and some index `N` make `T (N + h) - T N` an integer.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #251 remains open, and no theorem in this entry decides it.
