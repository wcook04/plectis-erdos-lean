version: v0.4
project:
  name: 'Erdős #1049, the rational base barrier and rational base region families'
  description: >-
    This entry states 5 theorems of the rational base barrier and rational base region developments of the Lean formalisation of Erdős problem #1049, to which no paper statement is bound. twoPow_le_rationalBaseForcingNat: For a genuine rational base, meaning denominator s >= 2, together with B >= 1 and coeff(N+1) >= 1, the forcing term is at least 2^(N+1). rational_base_region: For natural a>b>0 in the exact contour region, the literal Lambert value F(a/b) is irrational. thirtyone_four: The Lambert value F(31/4) is irrational. rational_base_measure: On the strict contour region for natural a>b>0, bounds the irrationality exponent of F(a/b) by the displayed exact rational-base expression. thirtyone_four_power_measure_lt_paper_fraction: For every positive natural r, the irrationality exponent of F((31/4)^r) is strictly less than the paper fraction 2981509/9909.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #1049 remains open, and no theorem in this entry decides it.
  authors:
  - Will Cook
  license: Apache-2.0
  responsible_maintainers:
  - Will Cook
