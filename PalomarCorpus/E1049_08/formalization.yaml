version: v0.4
project:
  name: 'Erdős #1049, the Archimedean cap, Bezout Plucker jets and Hermite Pade no go families'
  description: >-
    This entry states 11 theorems of the Archimedean cap, Bezout Plucker jets, Hermite Pade no go and paper statements u developments of the Lean formalisation of Erdős problem #1049, to which no paper statement is bound. archimedean_cap: Archimedean cap. anchor_det_zero_forces_all_det_zero: Let w be a family of pairs in a commutative ring R, indexed by any type, and let a and b in R be coprime in the Bezout sense. binary_row_collision_of_anchor_det_zero: Under the hypotheses above with R and the index type both finite, if the cardinality of R is smaller than 2 raised to the number of indices, then two distinct Boolean selectors have the same selected row sum in R times R. adjacent_det_zero_forces_all_det_zero: For a sequence of pairs in a commutative ring whose second coordinates are all units, vanishing of every adjacent minor implies vanishing of every pairwise minor. zmod_binary_tail_collision_of_two_three_depth: At the modulus 2^S 3^R with R > 0, let w be a sequence of pairs of residues whose second coordinates are units and whose adjacent minors all vanish. hpClearedGap_expansion: Exact polynomial identity after the substitution sigma = 1 + rho + u: the cleared gap equals -pi^2 rho^2 - pi^2 rho u - 2 pi^2 rho - 2 rho^2 - 10 rho u - 4 rho - 6 u^2 - 8 u. hpClearedGap_nonpos: On the admissible region rho >= 0 and sigma >= 1 + rho the cleared comparison functional is nonpositive. hpClearedGap_eq_zero_iff: On that same admissible region the cleared comparison functional vanishes if and only if rho = 0 and sigma = 1, the classical one-function endpoint. rectangular_hp_threshold_le_classical: Over the whole admissible cone rho >= 0 and sigma >= 1 + rho, the rectangular two-function threshold of this explicit exponent model is at most 1/2 - 1/pi^2 = 0.398678816..., the classical one-function value. rectangular_hp_threshold_eq_classical_iff: On the same cone the threshold equals 1/2 - 1/pi^2 if and only if rho = 0 and sigma = 1. sharp_fixed_base_exists: States res:sharp-fixed-base from the short record for Erdős problem #1049.

    1 of the restated theorems is proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #1049 remains open, and no theorem in this entry decides it.
