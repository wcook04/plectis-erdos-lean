version: v0.4
project:
  name: 'Erdős problem #251: shifted prime-gap coincidences reduce to an explicit four-prime count, with exact tail-shift criteria, a kernel-decided denominator floor, and rational countermodels to coarse gap hypotheses'
  description: >-
    Erdős problem #251 asks whether the dyadic prime series 2/2 + 3/4 + 5/8 and so on is irrational. The principal result here turns a prime-specific obstruction into a counting problem about four primes. Write `p n` for the primes indexed from `p 0 = 2` and `g n = p (n + 1) - p n` for the consecutive gaps. For every shift `h` at least 2, every integer `r`, and all `N` and `H`, the number of indices `n < N` with `g (n + h) - g n = r`, multiplied by `H + 1`, is at most `(h + 1) * p (N + h + 1)` plus `H + 1` times the number of triples `(x, d, s)` with `x < p N`, `0 < d < s` at most `H`, `d + r > 0`, and all four of `x`, `x + d`, `x + s`, `x + s + d + r` prime. That inequality is finite, unconditional, and assumes no sieve estimate. A second theorem shows that an explicit quadruple-sieve hypothesis, recorded as `SeparatedQuadSieve_target`, forces those indices to have density zero. This package does not prove that hypothesis, and the case `h = 1` is excluded because two of the four prime positions would coincide. Independently of the theorems here, J. Land posted in 2026 on the problem's discussion thread a proof of irrationality that is conditional on Kuperberg's uniform Hardy-Littlewood prime-tuples conjecture, with a Lean formalisation of that conditional argument; the declarations compared here assume no such conjecture and remain unconditional, and the parent problem remains open unconditionally. The unconditional reduction retains its interest beside any conditional proof: it is finite, assumes no sieve estimate, and places the obstruction in the standard separated four-prime shape for which sieve theory already has machinery.

    The audience is the irrationality-of-series community Erdős addressed, together with workers on prime-gap distribution and formalised number theory. Erdős recorded this series as unproved in 1958 (page 94), repeated it with Graham in 1980 (page 62), and again in the chapter cited below (page 103). His dyadic irrationality theorem with Pomerance (1978, section 7) needs bounded digits and does not reach unbounded prime numerators or gaps. Kovač refuted in 2026 an adjacent conjecture printed under the same catalogue number, in which the denominators vary; that refutation left the fixed-denominator question here undecided. No antecedent for the tail criteria has been located, and the nearest located neighbour is Schlage-Puchta (2011), which treats a different object. What this entry adds is machine-checked in Lean 4 over Mathlib: a one-way route from the shifted-gap obstruction to a named four-prime sieve input, exact tail-shift classifiers for irrationality, a kernel-decided denominator floor, and two rational countermodels closing families of soft arguments. Erdős problem #251 remains open, and no declaration here asserts irrationality of any of the three series.

    The reformulation layer is unconditional and exact. The elementary bound `p n <= 1250 * (n + 1) ^ 4`, proved here from a central binomial estimate, makes both series summable without the prime number theorem. Summation by parts over the dyadic weights gives `sum p n / 2 ^ (n + 1) = 2 + sum g n / 2 ^ (n + 1)` and `sum p n / 2 ^ n = 4 + 2 * sum g n / 2 ^ (n + 1)`, so the three series share one irrationality status. That identity was given by Terence Tao on the public problem thread on 7 October 2025 and is checked here without a priority claim. These are exact changes of coordinate and they decide no value.

    The tail layer studies the recurrence `T (N + 1) = 2 * T N - g (N + 1)` obeyed by the rescaled tails `T N = sum over j at least 1 of g (N + j) / 2 ^ j`, for arbitrary integer digits. For every such real orbit, `T 0` is rational exactly when one shift `T (N + h) - T N` with `h` positive is an integer at one index. Irrationality is therefore equivalent to cofinal non-integrality of every fixed positive shift, to the free-pair condition with the offset `M - N` free, and to non-integrality on the single diagonal at shift length and basepoint both `lcm (1, ..., j)`. At a rational basepoint the integral shift lengths are exactly the multiples of the multiplicative order of 2 modulo the reduced denominator. Two escape tests, the data-dependent affine cylinder and a fixed lattice of multiples of `2 ^ r`, are proved equivalent to the non-integrality they were introduced to establish. These are exact reformulations and route closures. They are not progress on the value.

    One unconditional numerical exclusion is recorded. Every representation of the prime series as `a / b` with `b` a positive natural number has `b` at least `2 ^ 589`, which exceeds `10 ^ 177`, and the same floor holds for the prime-gap series. It is decided inside the Lean kernel from a trial-division sieve below 10000, returning the 1229 primes there and the scaled prefix, together with a Farey certificate of four explicit constants of 177 and 178 digits. A denominator floor is a finite exclusion, compatible with rationality, and it proves no irrationality.

    Two synthetic countermodels bound what a soft argument may use. The first constructs an integer word whose digits from index 1 are positive, even, at most `4 * log (n + 1) + 24`, unbounded, and without positive eventual period, which takes both values 2 and 4 at arbitrarily late indices in every residue class modulo every positive `t`, whose cumulative positions are strictly increasing and odd with `position N / (N * log N)` tending to 1, and whose dyadic series has the exact value 6 with every complete tail and every difference of tails an integer. That word is synthetic: it asserts no primality and says nothing about the actual prime gaps. An argument using only those properties cannot force a non-integral tail shift. The second is the quadratic word `a n = 2 * (n ^ 2 + 4 * n + 2)` with orbit `U n = 2 * (n + 4) ^ 2`: positive, even, strictly increasing, every shift integral, every adjacent difference `4 * n + 10` and hence never 2 or -2, and dyadic sum exactly 32. It is likewise synthetic. A telescoping construction of the same species was published first by Kovač in April 2026, with no priority claimed here.

    What remains open is a statement about the actual primes: for every fixed positive `h` and every threshold, produce an index beyond it at which two adjacent shifts of length `h` both lie strictly between -1 and 1 while the two corresponding gaps differ. One theorem here puts that configuration in exact normal form under the hypothesis that the two gaps differ by an even number, forcing that difference to be exactly 2 or -2. Zhang (2014), Maynard (2015), and Ford, Green, Konyagin, Maynard and Tao (2018) address a different question and supply none of the joint dyadic block distribution the finite criterion needs. Erdős problem #251 remains open.
