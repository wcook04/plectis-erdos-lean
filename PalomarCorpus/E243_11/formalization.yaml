version: v0.4
project:
  name: 'Erdős #243, the record amplified cancellation visibility, record increment barrier and repair entropy families'
  description: >-
    This entry states 13 theorems of the record amplified cancellation visibility, record increment barrier, repair entropy, saturated square transport, slow rise barrier, summable negative mass rigidity and weighted record excess developments of the Lean formalisation of Erdős problem #243, to which no paper statement is bound. recordAmplified_error_after_cancellation: Local visibility estimate: with `s + 1 ≤ t`, the relations `w n + v n = a n * u n`, `w n = hc n * u (n+1)`, `w n > 0` and `e n = v n - (a n - 1) * u n` for `n ≥ s`, if `e j ≥ 0` for every `j` strictly between `s` and `t` and `e t < 0`, then `u t ≤ u (s+1)` and `u s * u t ≤ runningMax u t * |e t| * u (s+1)`, so a cancellation paid at `s` is still quantitatively visible at the first later negative error. recordIncrementOne_sylvesterNext_eventually: Rigidity for tails whose running maximum increases by at most one: along a reduced reciprocal tail from `N` with arbitrary cancellation, obeying `w n + v n = a n * u n`, `w n = hc n * u (n+1)`, `a n * v n = hc n * v (n+1)`, `v n > 0`, `w n > 0` and `u n` coprime to `v n`, with centred error `e n = v n - (a n - 1) * u n` satisfying `2 * |e n| < u n` and division-free normalised vanishing at every scale, if `runningMax u (n+1) ≤ runningMax u n + 1` at every late step and prime powers `p ^ l`, `l ≥ 1`, with `p ^ l ∣ v s` and `runningMax u s + 3 ≤ p ^ l` recur at arbitrarily late `s`, then `a (n+1) = a n ^ 2 - a n + 1` from some index onward. repairedFamily_recovery_energy_divisionFree: Repair-entropy inequality: for positive naturals `u n` and `h n` and integers `e n` with `h n * u (n+1) = u n - e n` in the integers, a window `[r, r+L)` with `L > 0` on which `K * |e (r+i)| < u (r+i)` for a fixed `K > 0`, a recovery `u r ≤ u (r+L)`, naturals `c n` with `c n ^ 2 ∣ h n` on the window, and a finite family `R` of moduli `m q` each dividing the product of `c` over that window, one has `K ^ L * (R.lcm m) ^ 2 < (K+1) ^ L`. repaired_card_bound_of_independent: Corollary of the repair-entropy law for an independent family: under the same window hypotheses, if the family satisfies `2 ^ R.card ≤ R.lcm m`, then `K ^ L * 4 ^ R.card < (K+1) ^ L`, which bounds how many independent old moduli can be deleted inside a recovery carrying a fixed relative-error budget. eventually_recoveryPayment_eq_one_of_fixedLength: For positive naturals `u n` and `h n` and integers `e n` with `h n * u (n+1) = u n - e n`, under division-free normalised vanishing at every scale `K`, each fixed window length `L > 0` has an index `N` beyond which every recovery `u r ≤ u (r+L)` with `r ≥ N` pays nothing: `∏_{i < L} h (r+i) = 1`. saturated_square_transport_raw: Exact divisibility with no hypothesis beyond the three cocycle equations `w + v = a * u`, `w = hc * u'` and `a * v = hc * v'` and the two centred-error definitions `e = v - (a - 1) * u` and `e' = v' - (a' - 1) * u'`: the whole next numerator `u'` divides `hc * e * e' - v ^ 2` in the integers. legendre_defect_forces_nonsquare_content: Bare divisibility implication over naturals `b`, `s`, `u'`, `p` and integers `e`, `e'`, with no primality and no orbit hypothesis: if `u'` divides `b * e * e' - (b * s) ^ 2` in the integers, `p` divides `u'`, and the product of the images of `e` and `e'` in `ZMod p` is not a square, then `b ≠ 1`. no_slowRise_reducedTail: Slow-rise exclusion, a companion to the uniform bounded-rise barrier that neither implies nor is implied by it: no reduced exact tail from index `N`, with `a n > 1`, `u n` coprime to `v n`, `u (n+1) + v n = a n * u n`, `v (n+1) = a n * v n` and `u n → ∞`, can for some block length `B` start below the product `P = ∏_{i < B} a (N+i)` at index `N + B` and then rise by at most `B` at every index `n ≥ N + B` where the numerator is below `2 * P`. summableNegativeMass_completeRigidity: Second conditional endpoint: for integer multipliers `a n` and denominators `D n` and positive natural numerators `C n` with `D (n+1) = a n * D n`, `C (n+1) = a n * C n - D n`, the step identity `C (n+1) = C n - E n` for the centred error `E n = D n - (a n - 1) * C n`, division-free normalised vanishing at every scale `K`, and summability of the normalised negative mass `n ↦ (-E n)_+ / C n`, the centred error vanishes from some index onward and `a (n+1) = a n ^ 2 - a n + 1` from some index onward. finite_negative_mass_scalar: Scalar finite-mass criterion, with no denominator dynamics and no normalised-vanishing hypothesis: if `C n` are positive naturals, `E n` are integers with `C (n+1) = C n - E n`, and the normalised negative mass `n ↦ (-E n)_+ / C n` is summable, then `E n = 0` from some index onward. canonical_finite_negative_mass: The finite-mass criterion placed on the canonical state built from the problem's own data: for positive naturals `a n` whose reciprocal series has sum the rational number `p / q` with `q > 0`, if the real series whose terms are the positive part of the negation of the centred error of the canonical denominator `q * P n` and the canonical numerator, divided by that canonical numerator, is summable, then `a (n+1) = a n ^ 2 - a n + 1` in the integers from some index onward. weighted_record_excess: Exact reformulation in the record coordinates: for `a` strictly increasing positive integers with reciprocal sum the rational `p / q`, `q > 0`, and `a (n+1) / a n ^ 2 → 1`, and for a weight `f` that is nonnegative and antitone on `[1, ∞)` with `∫_1^x f → ∞`, the sequence satisfies `a (n+1) = a n ^ 2 - a n + 1` from some index onward if and only if the weighted record-excess series `∑ (-V n - B)_+ f (U n)` over strict record indices is summable for some natural baseline `B`. weighted_growth_record_excess: The same exact reformulation with the summand expressed in the original growth coordinates: under the same hypotheses on `a` and on the weight `f`, the sequence satisfies `a (n+1) = a n ^ 2 - a n + 1` from some index onward if and only if `∑ U n f (U n) (a n ^ 2 / a (n+1) - 1 - B / U n)_+` over strict record indices is summable for some natural baseline `B`.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #243 remains open, and no theorem in this entry decides it.
