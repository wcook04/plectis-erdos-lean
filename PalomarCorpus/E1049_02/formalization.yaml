version: v0.4
project:
  name: 'Erdős #1049, record section 2.6: proofs, earlier work and limitations'
  description: >-
    This entry states 4 theorems that the long record for Erdős problem #1049 states in section 2.6 (proofs, earlier work and limitations): the theorem “a degree restriction for estimates valid at every base” (section 2.6), as long_record_archcap; the corollary “nondecay when b<a<b^2” (section 2.6), as cleared_below_square_not_tendsto_zero; the lemma “coefficient heights of the constructed polynomials” (section 2.6), as exists_quadratic_source_height_bound and maxPairHeight_source_eq.

    1 of the restated theorems is proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 2 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #1049 remains open, and no theorem in this entry decides it.
