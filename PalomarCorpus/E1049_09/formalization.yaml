version: v0.4
project:
  name: 'Erdős #1049, the paper structures AA, paper structures AB and paper structures v families'
  description: >-
    This entry states 4 theorems of the paper structures AA, paper structures AB, paper structures v and paper structures w developments of the Lean formalisation of Erdős problem #1049, to which no paper statement is bound. rogers_factorisation_proposition: States long1049:prop:rogers-factorisation from the long record for Erdős problem #1049. sharp_fixed_base: States long1049:thm:sharp-fixed-base from the long record for Erdős problem #1049. tail_prefix_lattice: States long1049:res:tail-lattice from the long record for Erdős problem #1049. geometric_universality: States long1049:thm:geometric-universality from the long record for Erdős problem #1049.

    2 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 2 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #1049 remains open, and no theorem in this entry decides it.
