version: v0.4
project:
  name: 'Formal reductions for Erdős problem #1049'
  description: >-
    A Comparator-checkable restatement of the paper-linked Lean theorems that
    actually have proof coverage for Erdős problem #1049. The compared
    surface includes 40 independently stated declarations
    (exists_distinct_binary_selectors_same_fourJet_of_power_certificate, exists_distinct_binary_selectors_same_fourJet_of_rank_41, exists_ne_map_eq_map_ne_of_card_mul_lt, fourJet_card_gt_two_pow_of_rank_41, threeHalves_hankelChargeThreshold_lt_eightFortyOne, threeHalves_rectangular_hp_gap_gt_threeThirteenths, threePow_fortyOne_lt_twoPow_sixtyFive, three_two_scalar_margin_lt_explicit, twoPow_sixtyFour_lt_threePow_fortyOne, zudilinScalarContent_cannot_meet_required_charge, zudilinScalarPlusBorder_cannot_meet_required_charge, zudilinSharpHankelOrderAndCoeff_algebraicAssembly, and 28 more). The parent problem remains open. This repository
    is the substantive formalization, not a thin wrapper around another public
    repo. This entry is one of eight problem-level Palomar configurations at
    the same repository and commit.
  authors:
  - Will Cook
  license: Apache-2.0
  responsible_maintainers:
  - Will Cook
