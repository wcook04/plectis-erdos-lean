version: v0.4
project:
  name: 'Erdős problem #1049: an Archimedean one-half cap on base-uniform polynomial approximation to Lambert values, with sharp Hermite-Padé and adelic height exclusions at the base 3/2'
  description: >-
    Erdős problem #1049 asks whether the Lambert value F(t) = sum over n >= 1 of 1/(t^n - 1), which equals sum over n >= 1 of tau(n) t^(-n), is irrational for every rational t > 1. The problem remains open, and the first resistant explicit base is 3/2. This entry collects exact boundaries on the methods used to attack it, with the arithmetic they rest on. No theorem here proves irrationality of F at any base.

    The principal theorem is an Archimedean cap on base-uniform polynomial approximation. Let (U_n, V_n) be pairs of integer polynomials, let F be a real function, and put Lambda_n(x) = U_n(x) F(x) - V_n(x). Suppose constants sigma > 0, delta > 0 and h >= 0, independent of the evaluation point, bound the degrees eventually by (delta + eps) n^2 and the logarithm of the larger l^1 coefficient norm eventually by (h + eps) n^2 for every eps > 0, and that at every real x > 1 the remainder is eventually nonzero with log |Lambda_n(x)| = -sigma n^2 log x + o(n^2). Then sigma/(sigma + delta) <= 1/2, and the cleared forms b^(width n) Lambda_n(a/b) tend to zero for all naturals 1 <= b < a with log b / log a < sigma/(sigma + delta). The cutoff of any such family is therefore at most 1/2, while 3/2 sits at log 2 / log 3 = 0.63092975..., so the sufficient region this cutoff furnishes never contains 3/2. A second theorem turns failure of the cutoff test into failure of decay: with the height measured by the largest absolute coefficient, the undivided forms do not tend to zero whenever 1 <= b < a < b^2, with no limit of the normalised width assumed. Both statements hold for an arbitrary real function F.

    The readership is the community working on irrationality and irrationality measures of Lambert and q-series. Bundschuh and Väänänen (1994) proved F(a/b) irrational for coprime a > b >= 1 with log b / log a < 1/2 - 1/pi^2 = 0.398678816..., which already covers non-integer bases such as 7/2. Van Assche (2001) recovered the integer-base exponent 2 pi^2/(pi^2 - 2) by little q-Legendre Padé approximants, and Zudilin (2004) obtained the smaller exponent 2.46497868... from Heine's basic transform and a permutation group. Zudilin (2016) announced a rational-base extension with an unspecified computable constant and proved that his normalised Hankel determinant has q-order at least N(N-1)(2N-1)/6. Against that record this entry supplies exact exclusions, each tied to one named mechanism, with the inequalities behind them.

    Two families concern the Hermite-Padé route. In the explicit rectangular two-function exponent model the threshold over the whole admissible cone rho >= 0, sigma >= 1 + rho is at most 1/2 - 1/pi^2, with equality only at the classical one-function endpoint rho = 0, sigma = 1. The adelic height family fixes the bracket 2^64 < 3^41 < 2^65, with 65 not replaceable by 64, and derives obstructions at 3/2. The rectangular threshold falls short of log 2 / log 3 by more than 3/13 on that cone. The surviving charge threshold (log 3 / log 2 - 1)/3 lies below 8/41, so more than 39/41 of the raw denominator power 4N^3 - 3N^2 of the cubic Hankel determinant must be cleared, which neither scalar content of degree at most N^3 - N nor that content with the forced border of degree at most 2N^3 - N achieves; the scalar ray 2 C_0 <= C_1 misses the balance by the fixed margin 17/41. The same bracket lowers the four-jet collision threshold from 4R + 2S to 130T + 2S at bottom depth 41T, with 130 exact at T = 1. In every column the first transformed row of the normalised moments has order exactly l + 1 and coefficient exactly -6. For the normalised Hankel determinant of rank N, whose moments and determinant are Zudilin's construction (Acta Arith. 111 (2004); Res. Number Theory 2 (2016), Art. 15), the order equals N(N-1)(2N-1)/6 and the leading coefficient equals (N!)^2 (N+1)!/2^N at every rank N; Zudilin (2016, Section 4) proves that the order is at least N(N-1)(2N-1)/6. Two division-free closed forms for the assembled order and leading coefficient are also proved as an algebraic identity.

    Four further families record exact necessary conditions and one more exclusion. The prime-support selectors prove the sharp separation |B (a/q) - A| >= 1/q for a nonvanishing integral linear form at a rational target a/q with q > 0, its two-row version under a nonzero exterior determinant, the impossibility of joint decay of two such rows, a tradeoff bounding that determinant by eps (|B_1| + |B_2|) when both remainders are at most eps, and prime and prime-power specialisations certifying the nonvanishing. The rational-base barrier gives the exact cleared-tail recurrence, the lower bound 2^(N+1) on its forcing term at any denominator at least 2 with clearing constant and coefficient at least 1, and impossibility of the coordinatewise clearing corridor at 3/2. The Bezout-Plucker family propagates one vanishing anchor or adjacent minor to every pairwise minor and halves the selector threshold from 2S + 4R to S + 2R, under a minor hypothesis not established here. The published height regions record 3^81 < 2^200, hence 81/200 < log 2 / log 3, and place 3/2 outside both that threshold and the Bundschuh-Väänänen region, the 81/200 cutoff being this entry's own elementary sub-boundary rather than a published criterion.

    Every declaration here is proved over Mathlib alone, with no analytic theorem imported as an axiom and no result of a cited paper assumed: the Hermite-Padé no-go, the rational-base barrier, the adelic height bridge with its integer certificates such as 3^41 against 2^65, the prime-support selectors, the published height regions, the Bezout-Plucker jets and the Archimedean cap stand on the hypotheses written into their own statements. Several of those hypotheses, among them the minor vanishing in the Bezout-Plucker family and the degree ceilings in the charge comparisons, are not established here for any actual approximation family. The strongest result of the wider project for this problem is not among them: irrationality of F(a/b) for coprime a > b >= 1 with log b / log a < 0.40568302..., and of F((31/4)^r) for every integer r >= 1, is an ordinary complete proof citing published lemmas of Zudilin (2004), namely the polynomial conclusion of Lemma 7 with the inputs of its proof. It is not formalised here and is not among the theorems compared in this entry. Membership in a height region is applicability of a method; failure of membership proves neither rationality nor irrationality. The exclusions say what a named construction cannot do, they do not cover every construction, and none bounds the denominator of F(3/2). Novelty of the individual certificates has not been settled by a literature search and is recorded as unknown. The first transformed row and the order and leading coefficient of the normalised Hankel determinant are statements about Zudilin's construction, and the order inequality of Zudilin (2016, Section 4) is their antecedent. Erdős problem #1049 remains open.
