version: v0.4
project:
  name: 'Erdős #249, record sections 6.2.1 to 6.2.2: initial implications; equivalent quantified certificate conditions'
  description: >-
    This entry states 30 theorems that the long record for Erdős problem #249 states in sections 6.2.1 (initial implications) and 6.2.2 (equivalent quantified certificate conditions): the proposition “An affine combination annihilates the specified divisor terms” (section 6.2.1), as joint35ConeWindow_eq, joint35_nonintegral_of_separated_window, joint35_truncation_error, totientTail_enclosure and transportResidueKernel_eq_mobiusTermKernel; the proposition “The error under composite dilation” (section 6.2.1), as composite_dilation_defect_eq_zero_of_prime_support, composite_dilation_defect_univ_six_one, composite_dilation_defect_univ_six_one_card, sum_divisors_totient_ne_totient, composite_dilation_divisor_count, composite_dilation_divisor_count_prime_support, lambert_support_series, lambert_support_series_restricted, totient_convolution_weight_mul_zeta, totient_convolution_weight_not_periodic, totient_convolution_weight_prime and totient_convolution_weight_unbounded; the theorem “It suffices to use multiples of a period” (section 6.2.2), as irrational_of_period_multiple_certificate_supply, period_multiple_certificate_at_one, period_multiple_certificate_supply_iff and rational_forces_period_multiple_integrality; the lemma “Nondivisors in a short LCM window” (section 6.2.2), as eq_prime_pow_of_not_dvd_periodLcm; the proposition “Totient factorisation on an LCM progression” (section 6.2.2), as clean_lcm_ray_factorisation and unclean_lcm_ray_counterexample; the theorem “Rationality forces tail integrality on an LCM grid” (section 6.2.2), as certificate_denominator_exclusion, lcm_grid_flatness, lcm_grid_fractional_parts and lcm_grid_supply_iff; the theorem “A sufficient nonintegrality condition on the grid” (section 6.2.2), as lcm_grid_multiplier_positive; the corollary “Equivalent conditions stated without certificates” (section 6.2.2), as irrational_totient_series_of_lcm_cone_nonintegrality_supply.

    23 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 7 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #249 remains open, and no theorem in this entry decides it.
