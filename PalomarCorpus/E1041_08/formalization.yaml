version: v0.4
project:
  name: 'Erdős #1041, the solved families and tetranomial spokes families'
  description: >-
    This entry states 9 theorems of the solved families and tetranomial spokes developments of the Lean formalisation of Erdős problem #1041, to which no paper statement is bound. cubic_safeRootSpoke: For complex r, s, v of modulus strictly below 1, at least one of three statements holds, the first being that for every real t in [0, 1] the product (t * r - r) * (t * r - s) * (t * r - v) has modulus at most 1. primitiveQuintic_twoStrictTailEnergies: Finite real selector for the sparse quintic z ^ 5 + a z ^ 4 + b z + c: given a real r with 0 < r < 2 and five pairs (x k, s k) with 0 ≤ s k ≤ 1 and x k ^ 2 ≤ s k satisfying the three rotated Newton moment equations, the sum of the x k equal to -r, the sum of 2 x k ^ 2 - s k equal to r ^ 2, and the sum of 4 x k ^ 3 - 3 s k x k equal to -r ^ 3, at least one of the ten unordered index pairs has both tail energies s ^ 4 * (s + r ^ 2 + 2 r x) strictly below 1. existsPeakLeComparisonBound: Alternation kernel of the sharp collinear theorem: if p is a real monic polynomial of degree m + 2 with p (-1) = 0 and p 1 = 0, and c is a strictly increasing family of m + 1 nodes with -1 < c 0, c (Fin.last m) < 1 and |c i| ≤ 1 for every i, whose values alternate in sign in the sense that p (c i) * p (c (i+1)) < 0 for every consecutive pair, then some node satisfies |p (c i)| ≤ comparisonBound (m + 2). tetranomialRoot_spoke_factorization: Exact Abel identity at a root of a centred tetranomial: if w satisfies w ^ m + a * w ^ r + b * w ^ s + c = 0 then for every real u the value of z ↦ z ^ m + a z ^ r + b z ^ s + c at the point u * w equals (1 - u ^ s) * c - (u ^ s - u ^ r) * (a * w ^ r + w ^ m) - (u ^ r - u ^ m) * w ^ m, with the real coefficients cast into the complex numbers. tetranomialRoot_spoke_norm_lt_one_of_rootBudget: Root-dependent budget: for 1 ≤ s ≤ r ≤ m, a root w of z ^ m + a z ^ r + b z ^ s + c with ‖w‖ < 1 and ‖c‖ < 1 satisfying ‖c‖ + ‖b‖ * ‖w‖ ^ s < 1, and every real u in [0, 1], the tetranomial has modulus strictly below 1 at u * w. tetranomialRoot_spoke_norm_lt_one_of_lowCoeffBudget: Coefficient-only corollary of the same conclusion, with the root-dependent budget replaced by ‖b‖ + ‖c‖ ≤ 1 under the same hypotheses 1 ≤ s ≤ r ≤ m, w a root of z ^ m + a z ^ r + b z ^ s + c, ‖w‖ < 1, ‖c‖ < 1 and u in [0, 1]: the complete spoke of every such root lies in the open unit lemniscate, again with a unrestricted. sum_normSq_const_add_mul: Exact energy identity for a finite family: for a Finset S, a family v of complex numbers indexed by its type, and complex b and c, the sum over i in S of Complex.normSq (c + b * v i) equals the cardinality of S, cast to a real, times Complex.normSq c, plus Complex.normSq b times the sum of Complex.normSq (v i), plus twice the real part of conj c * b * (the sum of the v i). exists_two_tails_norm_lt_one_of_exact_L2_budget: Pigeonhole consequence of that identity: if S has at least two elements and the energy on the right of the identity is strictly less than the cardinality of S, cast to a real, minus 1, then there are two distinct indices i and j in S with ‖c + b * v i‖ < 1 and ‖c + b * v j‖ < 1. exists_two_tetranomialRoot_safeSpokes_of_moment_coeff_budget: Indexed-root form: for a Finset S with at least two elements, a family w with every w i, i in S, a root of z ^ m + a z ^ r + b z ^ s + c of modulus below 1, exponents 1 ≤ s ≤ r ≤ m, ‖c‖ < 1, signed moment equal to the sum of the w i ^ s over S, and coefficient budget card S * (Complex.normSq b + Complex.normSq c) + 2 * (conj c * b * moment).re < card S - 1, there are two distinct indices i and j in S whose complete spokes u ↦ u * w i and u ↦ u * w j, for u in [0, 1], keep the tetranomial strictly below modulus 1.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    A degree-seven counterexample due to ani, formalised in this corpus, refutes the total-variation formulation of Erdős problem #1041; the theorems in this entry keep their stated hypotheses.
