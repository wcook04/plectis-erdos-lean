version: v0.4
project:
  name: 'Erdős #269, the actual shell orbit, all scale lattice and carry mechanism families'
  description: >-
    This entry states 12 theorems of the actual shell orbit, all scale lattice and carry mechanism developments of the Lean formalisation of Erdős problem #269, to which no paper statement is bound. actual_dyadicShellOrbit_recurrence_and_escape: Three unconditional assertions about the literal `{2,3,5}` shell orbit: the shell masses are summable; at every scale the normalized state satisfies the exact affine recurrence `X (a + 1) = b a * X a - m a` with the actual radix `dyadicBlockBase235 a` and the actual ordered digit `dyadicOrderedBlockDigit235 a` cast to the reals; and either some normalized state equals an integer, or for every index there is a later scale whose state lies at distance at least `1/31` from every integer. smoothHeight_mul_prime_dvd_boundaryHeight: For `p` equal to 2, 3 or 5, for `x` positive and `x < p ^ m`, the product `p * H x` divides `H (p ^ m)`, where `H` is the three-prime height for 2, 3 and 5. two_mul_heightNormalizer235: For `a` at least 1, twice the natural-number normalizer `H (2 ^ a) / 2` equals `H (2 ^ a)`, so the three-prime height at a dyadic boundary is even and the truncating division is exact. heightNormalizer235_mul_windowMass_eq_int: For every start index and window length, the normalizer at the top of the window, `H (2 ^ (start + count)) / 2`, multiplied by the rational mass of that window of shells is a natural number, so a finite window of shell masses is cleared exactly by the height at its upper endpoint. dyadicShellTsumTailR235_eq_range_add: For all `a` and `k`, the tail at `a` equals the finite sum of the shell masses at `a, ..., a + k - 1` plus the tail at `a + k`, the exact finite-depth splitting identity for the actual infinite tail. qsmul_normalizedTailState_eq_int_of_value_eq_rat: If `q` is positive and the tail from the first dyadic shell onward equals `p / q` as a real number, then for every `a` at least 1 the product of `q` with the normalized state at scale `a` is an integer. exists_normalizedTailState_collision_of_value_eq_rat: If `q` is positive and the tail from the first dyadic shell onward equals `p / q`, then there are indices `i < j` and an integer `z` with the difference of the normalized states at scales `1 + j` and `1 + i` equal to `z`, so rationality forces two distinct scales whose normalized states are congruent modulo 1. no_carryLift_of_errorBound_below_twoPow: A contradiction from the following hypotheses taken together: an integer carry with `carry (n + 1) = base n * carry n - D * digit n` at every index; a surjective channel labelling into `Prime235`; block-nullity of the perturbation of a candidate integer lift `z`; genuine `two` to `three` and `two` to `five` transitions at which that perturbation vanishes; a nonzero lift error at index 0; a bound sequence dominating the absolute lift error everywhere; every radix at least 2; and one index `N` at which the bound is smaller than `2 ^ N`. no_unitAccurateLift_with_twoAnchors_and_firstTwoBlockNull: A finite four-state incompatibility: four reals in the open unit interval, four integers each within distance strictly less than 1 of the corresponding real, the two anchor equations `2 * z0 - z1 - 1 = 0` and `2 * z2 - z3 - 1 = 0`, and the vanishing first block sum `(2 * z0 - z1 - 1) + (3 * z1 - z2 - 1) = 0` cannot hold together. perturbation_eq_zero_of_blockNull_twoAnchors: If the channel labelling into `Prime235` is surjective, the integer sequence `ε` is block-null for it, and `ε` vanishes at an index carrying a genuine `two` to `three` transition and at an index carrying a genuine `two` to `five` transition, then `ε` vanishes at every index. carryLift_blockDefect: An exact identity for any integer carry obeying `carry (n + 1) = base n * carry n - D * digit n` and any `a ≤ b`: `D` times the sum of the lift perturbation over the interval from `a` to `b` equals the lift error at `a` minus the lift error at `b`, plus the sum over that interval of `(base n - 1)` times the lift error at `n`. carry_eq_residueDigit_add_coboundary: For `B` positive and any integer carry with `carry (n + 1) = base n * carry n - B * digit n`, writing the residue as `carry n` modulo `B` and the quotient as `carry n` divided by `B`, every digit decomposes as the residue digit at that step plus `base n` times the quotient at `n` minus the quotient at `n + 1`.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #269 remains open, and no theorem in this entry decides it.
