  authors:
  - "Steve Fan"
  id: "https://www.erdosproblems.com/forum/thread/269"
  type: "web discussion"
  relationship: "background"
  note: "Gives the running least common multiple factorisation identity for an arbitrary finite prime set, the two-prime factorisation of the repeated sum with its Hecke-Mahler reduction and transcendence conclusion, and the remark that the argument does not appear to extend to three or more primes. The identity smoothPrefixLcm_eq_threePrimeHeight formalises his identity at three primes and is not claimed as new; the compared two-prime theorems state the transcendence conclusion with the Bugeaud-Laurent theorem as a named hypothesis, and no priority over this comment is claimed."
  license: "unknown"
  author_endorsement: "not-contacted"
