  - "Michel Laurent"
  id: "10.4064/aa220323-18-1"
  type: "paper"
  relationship: "background"
  note: "Theorem 1.1 supplies the transcendence of the Hecke-Mahler value behind the two-prime comparison; the compared two-prime theorems assume it as the named hypothesis BugeaudLaurentTranscendence and do not formalise it."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "Arithmetic properties of certain functions in several variables III, Bulletin of the Australian Mathematical Society 16 (1977), 15-47"
  authors:
