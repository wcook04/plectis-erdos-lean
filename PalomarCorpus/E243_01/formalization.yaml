version: v0.4
project:
  name: 'Erdős #243, record section 2: irrationality at the cubic rate; reduction under the zero lower-density assumption; a square condition from three consecutive numerators'
  description: >-
    This entry states 13 theorems that the long record for Erdős problem #243 states in sections 2 (irrationality at the cubic rate), 2.1 (reduction under the zero lower-density assumption), 2.2 (a square condition from three consecutive numerators), 2.3 (the square condition forces m=12), 2.4 (the two remaining cubics fail modulo seven) and 2.5 (from an asymptotic ratio to an exact polynomial): the theorem “cubic-rate irrationality” (section 2), as cubic_rate_irrationality_unconditional; the theorem “rising-factorial cubic exclusion” (section 2), as cubic_exclusion_unconditional; the lemma “periodic obstruction principle” (section 2.1), as fixed_offsets_periodic_lowerDensity; the lemma “gcd stabilisation and the primitive shape” (section 2.1), as cubic_profile_gcd_stabilisation_and_primitive_shape; the lemma “the multiplier supply, and the reducible case” (section 2.1), as primitive_zero_density_paper_multiplier_lemma; the lemma “square specialisation” (section 2.2), as squareSpecialisation; the proposition “the square forced by the numerator recurrence” (section 2.2), as transport_square_unconditional; the lemma “classification of the scales” (section 2.3), as scale_twelve_of_square_in_rootField; the lemma “the two forbidden words” (section 2.4), as minus_one_forbidden_word and plus_one_forbidden_word; the lemma “integer extraction at a regular rate” (section 2.5), as regular_rate_extraction and regular_rate_extraction_cubic; the lemma “the tail ratio reads the growth defect” (section 2.5), as canonical_tail_ratio_quantitative.

    11 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 1 is derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #243 remains open, and no theorem in this entry decides it.
