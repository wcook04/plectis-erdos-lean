version: v0.4
project:
  name: Cubic-rate irrationality for reciprocal sums
  description: 'Every positive strictly increasing zero-indexed integer sequence a with n^3(a_n^2/a_(n+1)
    - 1 - 3/n) tending to zero has an irrational reciprocal sum. The entry also states the exact integer-tail
    and number-field steps used to exclude the resulting cubic profile: positive-density exceptions, primitive
    gcd reduction, square specialisation, scale twelve, forbidden words modulo seven, and regular-rate
    extraction. The printed one-indexed paper theorem uses its stated finite-prefix argument. The separate
    bounded-increment Sylvester criterion in the paper is outside this configuration, and the unrestricted
    Erdős problem #243 remains open. The selected Challenge explicitly retains the strict monotonicity
    and positivity of a, the HasSum witness for its reciprocal series, and the n³-scaled rate limit. It
    does not silently infer that rate from the weaker condition a_(n+1)/a_n² → 1.'
  authors:
  - Will Cook
  license: Apache-2.0
  responsible_maintainers:
  - Will Cook
