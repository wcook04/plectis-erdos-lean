version: v0.4
project:
  name: 'Erdős #249, record sections 6 to 9: detailed statements; index of unproved conditions'
  description: >-
    This entry states 19 theorems that the long record for Erdős problem #249 states in sections 6 (detailed statements) and 9 (index of unproved conditions): the proposition “The bound is preserved by positive normalised averaging” (section 6.6.13), as positive_direct_sum_sub_theta_two_gt and primitive_form_abs_gt; the theorem “Concatenation and specified period multiples” (section 6.6.14), as cyclotomic_four_eval, cyclotomic_four_two_pow_eq_cyclotomic_two, cyclotomic_three_eval_two_not_dvd_doubling_chain, cyclotomic_three_two_pow, orderOf_two_mod_seven, three_not_dvd_two_pow, totientBlock_concatenation, totientBlock_doubling and totientBlock_eq_paper_indexed_sum; the theorem “A real-part bound gives a certificate” (section 9.2), as exists_certifiedKill_of_block_real_part_bound and windowFirstCos_unfolded; the theorem “The same implication for a nonempty subset” (section 9.2), as block_real_part_bound_of_subset_form and exists_certifiedKill_of_subset_real_part_bound; the theorem “A norm bound gives the real-part criterion” (section 9.2), as blockNormCondition_unfolded, exists_certifiedKill_of_block_norm_bound, irrational_of_blockNormCondition and real_part_bound_of_norm_bound.

    18 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 1 is derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #249 remains open, and no theorem in this entry decides it.
