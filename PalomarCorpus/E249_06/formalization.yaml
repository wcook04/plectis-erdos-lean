version: v0.4
project:
  name: 'Erdős #249, record section 6.1: unconditional structure and finite examples'
  description: >-
    This entry states 10 theorems that the long record for Erdős problem #249 states in section 6.1 (unconditional structure and finite examples): the proposition “The exact reduced denominator” (section 6.1), as lcmHeight_scaledMobiusShadow_den_exact; the proposition “Nonvanishing of a signed dyadic sum” (section 6.1), as signed_dyadic_clearing, signed_dyadic_sum_ne_zero and scaled_dyadic_sum_odd; the proposition “Small certificates” (section 6.1), as small_certificate_windows and small_certificates_and_exclusions; the proposition “A common certificate for sixteen shifts” (section 6.1), as sixteen_certificate_windows and sixteen_certificates_and_exclusions; the proposition “Historical diagonal examples and the complete band through 82” (section 6.1), as historical_table_size_and_initial_depths and historical_table_and_complete_band.

    6 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 4 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #249 remains open, and no theorem in this entry decides it.
