version: v0.4
project:
  name: 'Erdős #269, record sections 6 to 7: bounding the tails and clearing a rational denominator; a residue criterion and the bounds it allows'
  description: >-
    This entry states 7 theorems that the long record for Erdős problem #269 states in sections 6 (bounding the tails and clearing a rational denominator) and 7 (a residue criterion and the bounds it allows): the proposition “exact denominators and minimal clearing” (section 6), as exact_denominators_and_minimal_clearing; the proposition “propagation of integrality and uniqueness of a small solution” (section 6), as paper_pinning_and_eight_scale_rigidity; the proposition “a smaller quadratic bound” (section 6.1), as actual_sharp_tail_bound; the proposition “least positive residues” (section 7), as no_bounded_positive_int_state_of_leastPositiveResidue; the proposition “the fixed-start residue limit” (section 7), as eventually_fixedStartResidue_formula, fixedStartResidue_ratio_tendsto and eventually_fixedStartResidue_eq_tail_of_integral.

    4 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #269 remains open, and no theorem in this entry decides it.
