version: v0.4
project:
  name: 'Erdős problem #68: a three-halves lower growth bound for the common denominators lcm(n! - 1), with multiplicative successor rigidity, exact carry reformulations, and channel route closures for the series sum of 1/(n! - 1)'
  description: >-
    Erdős Problem 68 asks whether S = sum over n >= 2 of 1/(n! - 1) is irrational. The question is open and no theorem here decides it.

    The principal result is the common denominator growth bound. Write L_N for the least common multiple of n! - 1 over 2 <= n <= N. The lower limit of log L_N / (N^(3/2) log N) is at least 2 sqrt 2 / 3, stated both as an eventual lower bound and as a literal extended real liminf, which admits an infinite value. The estimate balances a terminal block of consecutive indices against the pairwise loss recorded by gcd(i! - 1, j! - 1) dividing j!/i! - 1. The bound recorded in this development before the present one was deduced by the author from Theorem 12 of Garaev, Luca and Shparlinski (2004) and has exponent 4/3; that deduction is not theirs, and the exponent 3/2 and the explicit constant use no multiplicity theorem. A literature search located no antecedent for a lower bound on the least common multiple of the numbers n! - 1, so novelty is unassessed rather than claimed.

    The boundary is exact. L_N is a common denominator of the partial sums. It is not the reduced denominator of a hypothetical rational representation of S: a prime can occupy the common denominator and vanish from the reduced prefix, and the prime pole formula here is the exact criterion for that survival; its reciprocal residue vanishes at the prime 139 for the prefix through index 138, a computation recorded in the public Erdős problem 68 note and reasoning record at https://github.com/wcook04/plectis-erdos and not among these declarations. What the bound closes is a proof architecture, since L_N times the positive tail S - H_N tends to infinity and clearing a prefix by its full least common multiple therefore cannot make the remaining tail small.

    The strongest reduction is multiplicative successor rigidity. Write H_m for the exact rational prefix, Z_m for the least integer strictly above m! H_m, and b_m for the carry in Z_m = m Z_(m-1) + 1 - b_m. If S is rational then the carry is eventually 1, the recurrence degenerates to Z_m = m Z_(m-1), and every fixed positive modulus d eventually divides Z_m. The contrapositive is a family of sufficient conditions: cofinal failure of one congruence fixed in advance implies irrationality, and at d = 2 it is enough that Z_m be odd infinitely often. This reduction replaces the moving condition m divides Z_m by a fixed modulus, and supplies no cofinal failure.

    Several statements are exact reformulations rather than progress on the value. Irrationality is equivalent to cofinally many non unit carries, and equivalently to cofinal failure of m dividing Z_m. The companion constant C = sum over n >= 2 of 1/(n!(n! - 1)) satisfies C + (e - 2) = S, and S is rational exactly when floor(m! C) is congruent to -2 modulo m for all large m; that orbit criterion is proved at an arbitrary real base point and specialises the classical factorial base criterion of Cantor (1869), recorded by Galambos (1976, Chapter 1). The telescope C = S - e + 2, the exceptional digit m - 2 and the arbitrary base point are what is added. None of these equivalences produces the event it names.

    The integral channel calculus is developed next: the channel numerator at d divides out the powers of d! and agrees with the factorial moment modulo d! - 1. The attainable moments are determined exactly: for D >= 2 the moments of admissible vectors annihilating the channels 2 through D are the multiples of one positive generator, independent of the eligible prime that cuts the horizon and attained by a primitive vector of content one. The transparency identity gives the full residual of every vector written in the low channel normal form of the statement as t L_D (S - H_D) plus an integer, so at fixed moment an integral correction moves it only by an integer. The prime unit translator is the constructive half: the pair (p, -1) on indices (p - 1, p) has zero moment, annihilates every channel except p, and has residual exactly 1 beyond any cutoff at least 2 and below p, so a Cramer vector on a remote factorial grid supplies, beyond any support threshold, coefficients with vanishing channels through a chosen cutoff, nonzero moment, and residual at most 1/2 in absolute value, a bound that is not strict, so nonintegrality is not established.

    Three families close routes. The channel radius family shows that a positive moment divisible by every channel modulus through 2t^2 and smaller than (R + 1)! - 1 forces 3t^3 < 2(R + 1) once t >= 2^32, and t^3 < 8(R + 1) from t >= 4096; in sequence form neither reverse inequality holds eventually, and R(t) + 1 is not little o of t^3. The adjacent unit carry window makes one proposed argument circular: window denominator and offset both factor through the exact transition normalisers, and cancelling them leaves an inequality that every reduced predecessor gap already satisfies. Fixed owner absorption shows that once the block parameter passes i! - 1 and j! - 1 both private quotients equal 1, so no fixed pair of denominator owners feeds the two conditional block criteria cofinally; their cofinal certificates are stated and unproved.

    Two finite exclusions constrain any representation S = a/q with q > 0. A single non unit carry at an index m at least 3 forces q not to divide (m - 1)!, so the Kempner index of q, the least k with q dividing k!, is at least m; the entry instantiates this at index 60, so q does not divide 59!. Exact dyadic and Farey data separately force 2^39990 <= q and 10^12040 < q with no reducedness hypothesis. The first restricts the multiplicative structure of q and the second its magnitude.

    The readers addressed work on irrationality of rapidly converging series of rational terms: Hančl and Tijdeman (2005) on factorial series, Duverney (2001) and Koepf and Schmersau (2011) on fast converging reciprocal sums, and Barreto, Kang, Kim, Kovač and Zhang (2026) on the rapid growth problem of Erdős and Graham, whose hypothesis fails for n! - 1. For them this entry supplies an explicit growth rate for the common denominators, a restatement of the target as one congruence on a computable sequence, a fixed modulus sufficient condition, and a record of the clearing architectures now excluded. A second audience is the arithmetic of n! + 1 and n! - 1 studied by Garaev, Luca and Shparlinski, by Stewart and by Lai. Erdős Problem 68 remains open.
