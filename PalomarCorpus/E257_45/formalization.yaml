version: v0.4
project:
  name: 'Erdős #257, record sections 11.1 to 11.5: reset bounds and finite weighted divisor sums; equivalent carry conditions at perfect-square depths; sparse and dense supports under the certificate criterion'
  description: >-
    This entry states 19 theorems that the long record for Erdős problem #257 states in sections 11.1 (reset bounds and finite weighted divisor sums), 11.4 (equivalent carry conditions at perfect-square depths) and 11.5 (sparse and dense supports under the certificate criterion): the lemma “Divisor-residue form of the short-window phase”, as Psi_eq_of_residues_eq, card_divisors_sub_one, dvd_add_iLeast, geometric_term_eq_zero_of_lt_iLeast, iLeast_congr, iLeast_mem_Icc, mCount_eq_zero_of_lt_iLeast, not_dvd_of_lt_iLeast, residue_condition_iff, residue_cutoff_reading_fails, theta_eq_Psi, theta_eq_divisorResidueSum, theta_eq_geometricForm, theta_eq_tsum_divisorResidue, theta_eq_tsum_geometricForm, theta_one_one and theta_one_three; the lemma “The terminal bound at square depths”, as paper_square_depth_terminal_bound; the proposition “Squarefree support: exact engine ceiling, not an open value”, as paper_squarefree_support_engine_ceiling.

    18 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 1 is derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #257 remains open, and no theorem in this entry decides it.
