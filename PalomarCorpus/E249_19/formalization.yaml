version: v0.4
project:
  name: 'Erdős #249, record sections 6.6.9 to 6.6.13: coprime-pair sums; the single-parameter diagonal condition; prime divisors of Mersenne factors and finite exclusions'
  description: >-
    This entry states 24 theorems that the long record for Erdős problem #249 states in sections 6.6.9 (coprime-pair sums), 6.6.10 (the single-parameter diagonal condition), 6.6.11 (prime divisors of Mersenne factors and finite exclusions), 6.6.12 (a sufficient hypothesis for unbounded prime support) and 6.6.13 (the lower bound for rank-one quotients): the theorem “The classical coprime-pair Lambert identity” (section 6.6.9), as coprimeLattice_plain_half_eq_series_sub_half; the theorem “Nondivisors in a short LCM window” (section 6.6.10), as dvd_periodLcm and short_lcm_window_nondivisor; the theorem “Unbounded prime support in Mersenne factors” (section 6.6.11), as mersenneLayer_prime_divisor_order and mersenneLayer_unbounded_prime_support; the theorem “A prime satisfying the stated cyclotomic conditions” (section 6.6.11), as cyclotomic_layer_prime_order_decomposition_paper and exists_clean_cyclotomic_anchor_paper; the theorem “A sufficient order hypothesis for unbounded prime support” (section 6.6.12), as binaryCyclotomicLayer_eventual_instance, binaryCyclotomic_allPrime_form_fails, boundedDegreeOrderConsumer_unfolded, boundedOrder_witness_iff_orderOf_le, coprime_of_dvd_pow_sub_one, dvd_pow_sub_one_iff_orderOf_dvd, eventual_orderConsumer_conclusions, mersenneLayer_orderConsumer_instance, orderConsumer_finite_prime_escape, orderConsumer_index_lt_pow, orderConsumer_unbounded_prime_divisors and unbounded_prime_divisors_of_escape_of_nontrivial; the theorem “A uniform positive gap for rank-one quotients” (section 6.6.13), as mobiusMersenneTheta_two_eq_totient_offset, abs_mobiusMersenneTheta_sub_prefix_le, mobiusMersenneTheta_ge_alpha, mobiusMersenneTheta_lt_one and rankOneSubrankQuotient_sub_theta_two_gt.

    20 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 4 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #249 remains open, and no theorem in this entry decides it.
