version: v0.4
project:
  name: 'Erdős #269, the window escape equivalence family'
  description: >-
    This entry states 9 theorems of the window escape equivalence development of the Lean formalisation of Erdős problem #269, to which no paper statement is bound. actualCofinalLocalWindowEscape_iff_irrational_value: An unconditional equivalence: the actual cofinal local-window escape holds if and only if `dyadicShellTsumTailR235 0` is irrational, that is if and only if the reciprocal running least common multiple sum of Erdős problem 269 at the prime set `{2, 3, 5}` is irrational. actualCofinalLocalWindowEscape_iff: An unconditional equivalence: the actual cofinal local-window escape holds if and only if the tail `dyadicShellTsumTailR235 1` from the first dyadic shell onward is irrational. cofinalLocalWindowEscape_of_irrational: The forward direction of the equivalence: irrationality of `dyadicShellTsumTailR235 1` implies the actual cofinal local-window escape. cofinalLocalWindowEscape_of_irrational_of_quadratic: If `dyadicShellTsumTailR235 1` is irrational, then for every short bound `sb` admitting a function `c` with `sb B n ≤ c B * (n + 1) ^ 2` for all `B` and `n`, the cofinal local-window escape holds at the actual radix word and the actual ordered digit for that short bound. exists_reducedCarry_of_value_eq_rat: If `q` is positive and `dyadicShellTsumTailR235 1` equals `p / q`, then there are a positive `B` coprime to 30, a finite onset index, and an integer sequence `d` satisfying `d (n + 1) = b n * d n - B * m n`, positivity of `d n`, and `|d n| ≤ B * 90 * (n + 1) ^ 2` at every index from that onset onward, where `b` and `m` are the actual radix word and the actual ordered digit. trueNormalizedState_window: The exact window identity for the genuine normalized state: for all `lo` and `len`, the state at `lo + len` equals the integer window base of the actual radix word times the state at `lo`, minus the accumulated integer forcing of the actual ordered digits over that window, both integers cast to the reals. near_integer_of_residue_le_general: If `B` is positive, `K` is at least `B * 90 * (lo + len + 1) ^ 2`, and the least positive residue of `-B` times the window forcing, modulo the absolute window base, is at most `K`, then some integer `k` satisfies `|B * X lo - k| ≤ K / 2 ^ len` for the genuine normalized state `X`. exists_pow_gt_quadratic: For every `c` and `lo` there is a positive window length `len` with `c * (lo + len + 1) ^ 2 < 2 ^ len`, the elementary fact that a power of two eventually overtakes a quadratic. octic_escape_whole: The full long-paper escape proposition: every natural cap dominating the long-paper cap and tending to zero after division by 8^a gives an escape condition equivalent to irrationality of the literal {2,3,5} reciprocal running-LCM series.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #269 remains open, and no theorem in this entry decides it.
