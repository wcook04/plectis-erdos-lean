version: v0.4
project:
  name: 'Erdős #269, note sections 2 to 5: nonsingular minors of every order; the recurrence for the repeated sum; a window test and the remaining arithmetic'
  description: >-
    This entry states 6 theorems that only the short note for Erdős problem #269 states, in sections 2 (nonsingular minors of every order), 4 (the recurrence for the repeated sum) and 5 (a window test and the remaining arithmetic): the corollary “the same minors modulo integers coprime to 30” (section 2), as admissible_modular_minors; the lemma “integer coefficients and four possible bases” (section 4), as dyadic_alphabet_whole; the proposition “the tail recurrence and a quadratic bound” (section 4), as short_actual_orbit; the theorem “rationality gives positive integer tails” (section 4), as short_fixed_split_bridge; the lemma “least positive residues” (section 5), as paper_finite_endpoint_obstruction; the theorem “a residue criterion for irrationality” (section 5), as short_window_equivalence.

    5 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 1 is derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #269 remains open, and no theorem in this entry decides it.
