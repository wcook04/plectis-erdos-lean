version: v0.4
project:
  name: 'Erdős #257, note sections 1 to 9: introduction and main results; finite-support denominator periods; greedy membership and an integer recurrence'
  description: >-
    This entry states 8 theorems that only the short note for Erdős problem #257 states, in sections 1 (introduction and main results), 4 (finite-support denominator periods), 8 (greedy membership and an integer recurrence) and 9 (further questions): the theorem “a weighted condition on the support” (section 1), as finitePrimeWeighted_fixedBase_hereditary; the theorem “reciprocal-summable supports” (section 1), as irrational_erdosSupportSeries_of_summable_reciprocal; the theorem “the exact denominator period” (section 4), as coprime_base_den_finiteErdosSum and lcm_lt_den_finiteErdosSum; the theorem “membership and nonincreasing integer remainders” (section 8), as paper_general_repair_criteria; the theorem “integer-quotient tests for 1/21” (section 9), as one_div_twenty_one_mem_mersenneAchievementSet_of_cofinalGreedyDecay and twentyOneCofinalEvenQuotientGreedyDecay_of_closedRows; the theorem “finite approximations with vanishing scaled error” (section 9), as paper_terminalhalf.

    5 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 3 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #257 remains open, and no theorem in this entry decides it.
