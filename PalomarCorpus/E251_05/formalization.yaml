version: v0.4
project:
  name: 'Erdős #251, note sections 1 to 4: introduction; the prime series and its actual tails; integral shifts: an exact algebraic classification'
  description: >-
    This entry states 10 theorems that only the short note for Erdős problem #251 states, in sections 1 (introduction), 2 (the prime series and its actual tails), 3 (integral shifts: an exact algebraic classification) and 4 (a local certificate and the missing prime input): the corollary “a rational sum with the stated prime-gap statistics” (section 1), as short_joint_prime_gap_countermodel; the theorem “prime-to-gap identity” (section 2), as irrational_realPrimeGapTail_zero_iff, irrational_tsum_primeDyadicTerm_iff_primeGap, realPrimeGapTail_eq_tsum_shifted_gaps, realPrimeGapTail_recurrence and realPrimeGapTail_zero; the theorem “exact rationality classification” (section 3), as real_orbit_exact_den_and_shift; the proposition “two consecutive differences of absolute value less than one” (section 4), as signed_two_window_consequences and signed_two_window_iff; the proposition “finite separation criterion” (section 4.1), as irrational_prime_series_of_finite_truncation.

    short_joint_prime_gap_countermodel assumes the named input PrimeNumberTheorem as a hypothesis: the prime number theorem in the form p_n / (n log n) → 1, where p_n is the n-th prime counted from p_0 = 2. This is the prime number theorem of Hadamard and de la Vallée Poussin (1896); it enters as a hypothesis and this repository does not prove it.

    short_joint_prime_gap_countermodel assumes the named input SchlagePuchtaLemma4 as a hypothesis: for every k and every nonzero polynomial F in k + 1 variables with integer coefficients, the indices n with F(g_n, g_(n+1), ..., g_(n+k)) = 0 form a set of natural density zero, where g_n = p_(n+1) - p_n is the n-th gap between consecutive primes. This is Lemma 4 of Schlage-Puchta (Acta Arithmetica 126, 2007), proved there with Selberg's sieve; it is a published result that this repository does not formalise.

    7 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 3 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #251 remains open, and no theorem in this entry decides it.
