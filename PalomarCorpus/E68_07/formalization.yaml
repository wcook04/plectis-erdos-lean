  authors:
  - "Georg Cantor"
  type: "paper"
  relationship: "other"
  note: "Zeitschrift für Mathematik und Physik 14 (1869), pages 121 to 128, the source of the classical factorial base rationality criterion that the companion orbit statements specialise; the telescope C = S - e + 2, the exceptional digit value m - 2 and the arbitrary base point are not taken from it."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "Representations of Real Numbers by Infinite Series"
  authors:
  - "János Galambos"
  id: "10.1007/BFb0081642"
  type: "book"
  relationship: "other"
  note: "Lecture Notes in Mathematics 502, Springer 1976; its Chapter 1 is the standard modern reference for the same factorial base criterion, and the specialisation to this series and its carry coordinate are not taken from it."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "On the irrationality of factorial series"
  authors:
  - "Jaroslav Hančl"
  - "Robert Tijdeman"
  id: "10.4064/aa118-4-5"
  type: "paper"
  relationship: "background"
  note: "Lemma 2.1 and its remark give the standard tail integrality argument for integer coefficient factorial series; their finite difference criteria impose a coefficient regularity that the denominators n! - 1 do not satisfy, and no theorem here is taken from that paper."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "Irrationality of fast converging series of rational numbers"
  authors:
  - "Daniel Duverney"
  id: "https://www.ms.u-tokyo.ac.jp/journal/pdf/jms080206.pdf"
  type: "paper"
  relationship: "background"
  note: "Gives irrationality criteria for fast converging reciprocal sums under two sided quadratic denominator growth, a hypothesis that fails for n! - 1; recorded as a criterion tested and found inapplicable."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "Irrationality of certain infinite series II"
  authors:
  - "Wolfram Koepf"
  - "Dieter Schmersau"
  id: "10.1524/anly.2011.1094"
  type: "paper"
  relationship: "background"
  note: "Their floor criterion was tested at the natural clearing scale for this series and its tail hypothesis fails from index 4 onward; recorded as a criterion tested and found inapplicable."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "Irrationality of rapidly converging series: a problem of Erdős and Graham"
  authors:
  - "K. Barreto"
  - "J. Kang"
  - "S.-h. Kim"
  - "V. Kovač"
  - "S. Zhang"
  id: "arXiv:2601.21442v3"
  type: "paper"
  relationship: "background"
  note: "Proves irrationality of a reciprocal sum under a rapid growth hypothesis that fails for n! - 1, and identifies the clearing target that the growth bound here bounds from one side; no theorem in this entry is taken from it."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "Character sums and congruences with n!"
  authors:
  - "Moubariz Z. Garaev"
  - "Florian Luca"
  - "Igor E. Shparlinski"
  id: "10.1090/S0002-9947-04-03612-8"
  type: "paper"
  relationship: "background"
  note: "Theorem 12 bounds the number of solutions of n! congruent to a modulo a prime and yields a weaker lower exponent 4/3 for the same least common multiple; the exponent 3/2 and the explicit constant proved here use no multiplicity theorem of that kind."
  license: "unknown"
  author_endorsement: "not-contacted"
