version: v0.4
project:
  name: 'Erdős #68, the finite denominator, Kempner index and moment ideal families'
  description: >-
    This entry states 5 theorems of the finite denominator, Kempner index and moment ideal developments of the Lean formalisation of Erdős problem #68, to which no paper statement is bound. finite_denominator_exclusion: If `q` is a positive natural number, `a` is an integer and `S = a / q`, then `2^39990 ≤ q` and `10^12040 < q`; no reducedness or certificate validity hypothesis is imposed, so every displayed rational representation of the series has denominator above both explicit floors. rational_denominator_not_dvd_pred_factorial_of_nonunit_carry: If `m ≥ 3`, the carry at `m` differs from `1`, `q` is a positive natural number and `S = a / q` for an integer `a`, then `q` does not divide `(m - 1)!`; equivalently one non unit carry at `m` forces the Kempner index of every displayed denominator, the least `k` with `q ∣ k!`, to be at least `m`. rational_denominator_not_dvd_fiftynine_factorial: The instance of the preceding exclusion at the exact carry certificate of index `60`: if `q` is a positive natural number and `S = a / q` for an integer `a`, then `q` does not divide `59!`. attainable_moment_ideal: For `D ≥ 2` and a prime `p` with `D / 2 < p ≤ D`, where `D / 2` is natural division, an integer `m` is the factorial moment of some admissible vector annihilating the channels `2` through `D` if and only if `minimumMoment D p` divides `m`; the attainable moments are exactly that ideal. minimum_moment_content_one: Under the same hypotheses, some admissible vector annihilating the channels `2` through `D` has factorial moment exactly `minimumMoment D p` and coefficient content `1`.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #68 remains open, and no theorem in this entry decides it.
