version: v0.4
project:
  name: 'Erdős #257: restrictions on a support with rational value; the first crossing of the half-value; gap lengths and the measure of their union'
  description: >-
    This entry states 23 theorems that the long record for Erdős problem #257 states in sections the unnumbered section restrictions on a support with rational value, the unnumbered section the first crossing of the half-value, the unnumbered section gap lengths and the measure of their union and the unnumbered section a sufficient test for a safe skip: the theorem “Unboundedness of a positive shifted recurrence”, as one_add_mul_card_le_two_mul_shifted_state and shifted_state_unbounded_of_infinite_support; the theorem “Bounds for intervals with zero divisor counts”, as paper_zero_run_le_eps_logb and paper_zero_run_le_of_mem; the proposition “A subpower bound for divisor counts”, as card_divisors_le_divisorSubpowerConst_mul_rpow and card_divisors_pow_le_divisorSubpowerConst_pow_mul; the proposition “Two distinct prime-power differences commute”, as mixedPrimePowerLayerTwo_twelve_fixture; the theorem “Existence of a first crossing”, as exists_first_localMersenne_crossing; the theorem “The unweighted sum of remaining gap lengths”, as mersenneGap_le and summable_mersenneGap_shift; the theorem “A sufficient inequality for a safe skip”, as paper_dyadic_skip_test_iff, paper_sharp_gives_three_over_three_t_sub_one, paper_sharp_skip_safe_lb3, paper_sharp_strictly_weaker_realizable, paper_sharp_weaker_than_dyadic, paper_three_channel_margin_identity, paper_two_channels_insufficient, paper_exact_mass_threshold and paper_sharp_skip_safe_actual_tail; the proposition “Two unconditional safety cases”, as three_le_of_fatal_of_odd, two_le_of_fatal, unitNumerator_skipSafe and unitNumerator_skipSafe_actualTail.

    20 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 3 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #257 remains open, and no theorem in this entry decides it.
