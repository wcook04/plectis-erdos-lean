version: v0.4
project:
  name: 'Erdős #249, record sections 9 to 10: index of unproved conditions; counterexamples to proposed deductions'
  description: >-
    This entry states 10 theorems that the long record for Erdős problem #249 states in sections 9 (index of unproved conditions) and 10 (counterexamples to proposed deductions): the theorem labelled statement:sha256:88636df414ec77f88567cd90a7c9d7f2754d3fa91943994bcd5619f94058c22c (section 9.3.13), as rationalValue_integral_carry_and_rank_floor; the proposition “An additional hypothesis for a totient-specific rank argument” (section 9.3.13), as rationalControl_periodic_with_unbounded_carry_rank and rationality_gives_mod_period_and_unbounded_rank; the proposition “A rational series preserving totient parity and the stated separation properties” (section 10.2), as exists_later_arbitrarily_many_separated_parityCoboundaryWeight_carry_pairs, parityCoboundaryWeight_le_self, parityCoboundaryWeight_le_six and parityCoboundaryWeight_mod_two_eq_totient; the lemma “Complement divisibility after multiplication” (section 10.4), as complementDenominator_dvd_scalar; the proposition “A nonzero minor survives inverse-phase column weights” (section 10.6), as inversePhaseGauge_locks_row_and_preserves_minor; the theorem “Exact dyadic rank and infinite-dimensionality” (section 10.8), as canonicalTotientKernelFamily_independent_card_and_span.

    9 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 1 is derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #249 remains open, and no theorem in this entry decides it.
