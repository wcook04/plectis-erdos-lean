version: v0.4
project:
  name: 'Erdős problem #1041: a degree-seven total-variation counterexample and short connectors for restricted polynomial families'
  description: >-
    A monic complex polynomial of degree seven has distinct roots in the open unit disc, yet every continuous path in its strict unit lemniscate between distinct roots has total variation greater than 2. This formalisation of ani’s construction refutes the total-variation formulation of Erdős problem #1041. The compared declaration records this one instance. The other selected results give short connectors for restricted families, critical-point metric bounds, and obstructions to straight-line methods. These positive results retain their stated hypotheses.

    The complete degree-three case provides a positive contrast. For a monic cubic p whose three zeros all have modulus strictly below 1, monic_cubic_connector produces zeros a and b of p and a hub c such that the two-segment path from a through c to b is continuous, has bounded variation on [0, 2], keeps |p| strictly below 1 at every point of that interval, and has extended variation strictly less than 2. cubic_paper_complete states the same conclusion for a cubic presented by its three listed roots. Both give the connector explicitly, and both record that squarefreeness is what makes the two selected zeros distinct. Pendyala (arXiv:2606.24875) proves the degree-four case unconditionally, the comparable adjacent result; whether degree three was recorded earlier has not been adjudicated, so no priority is claimed. complete_translated_cubic_quotient_fibres takes the same two-segment path through a centre h for the function z ↦ P((z - h)^q), with P a monic cubic and q at least 2: when every zero of that function has modulus below 1 and two of its zeros are distinct, two distinct zeros are joined by the path through h, which keeps the function below modulus 1 on [0, 2] and has extended variation below 2. The factorisation of P and the choice of the two zeros are derived in the proof.

    The collinear case is settled in every degree with a sharp constant. Put C_n = 1 / (2^(n-1) cos^n(pi / (2n))). The ordinary theorem is that a monic polynomial of degree n with collinear zeros of diameter D has two zeros joined by their straight segment, of length at most D, on which |f| is at most C_n (D / 2)^n, the constant being attained by endpoint-normalised scaled Chebyshev configurations, an attainment fact the companion paper records and the compared declaration does not state. SharpCollinear.existsPeakLeComparisonBound is its alternation kernel: a real monic polynomial of degree m + 2 vanishing at -1 and at 1, with m + 1 strictly increasing interior nodes in [-1, 1] whose values alternate in sign, has a node where |p| is at most C_(m+2). Affine normalisation and gap-maximum selection are ordinary.

    Critical-point geometry gives an unconditional metric selection in every degree, and two exact configurations show that it alone does not deliver a contained path. criticalGeometricMean_twoRootProximity proves that for n at least 2, when c differs from every z_k and the reciprocals 1 / (c - z_k) sum to zero, so that c is a critical point, two distinct root occurrences satisfy |c - z_i| + |c - z_j| at most 2r, with r the geometric mean of the n distances from c; criticalDiskInverseBalance_twoRootProximity is a real-variable inequality in four scalars, with no polynomial in its statement, standing behind the unit-disc version. Against this, an explicit monic quintic with vanishing reciprocal sum at the origin has a strictly unique nearest root whose straight spoke leaves the open unit lemniscate, and the monic cubic z^3 - (99/100)^3 has all roots in the open unit disc with every root-pair midpoint outside the open unit lemniscate. Each closes one straight-line route; curved connectors remain permitted.

    paper_critical_value_mean bounds the critical values in every degree. For a monic polynomial p of degree n at least 2 whose zeros all lie in a closed disc of radius R at least 0 about any centre, with its n - 1 critical points c_1, ..., c_(n-1) listed with multiplicity through the factorisation p' = n (z - c_1) ... (z - c_(n-1)), the sum of |p(c_j)|^(2/(n-1)) is at most (n - 1) R^(2n/(n-1)) and the sum of |p(c_j)|^(1/n) is at most (n - 1) R. The exponents are real powers and the degenerate radius R = 0 is included.

    Sparse coefficient families are handled by complete radial spokes. For the trinomial z^m + a z^r + c an exact Abel identity at a root eliminates the middle coefficient, and for 1 at most r at most m, |w| < 1 and |c| < 1 the whole spoke from the origin to the root w stays strictly inside the unit lemniscate. For the tetranomial z^m + a z^r + b z^s + c with 1 at most s at most r at most m, a root w with |w| < 1 and a constant term with |c| < 1, the budgets |c| + |b| |w|^s < 1 and |b| + |c| at most 1 each force the whole spoke of w below modulus 1, an exact signed mixed-moment identity turns a global L2 energy below card(S) - 1 into two distinct indices whose tails have modulus below 1, and the matching coefficient budget over a finite family of roots selects two distinct indices with complete safe spokes. The sparse quintic z^5 + a z^4 + b z + c reduces to a finite real selector over the first three rotated Newton moments, returning two indices whose tail quantities, read in the intended identification as |b w + c|^2, are below 1. One of any three open-disc roots has its complete origin spoke inside the closed unit sublevel set of their monic cubic, the kernel of the translated cubic quotient-fibre family; the translated quartic quotient-fibre construction contributes a density comparison, an exact axis integral, and the endpoint budget a^alpha + b^alpha < 2 for alpha > 0 and moduli in [0, 1).

    A hypothesis on the critical spectrum, with no condition on the shape of the root set, gives the target constant 2 in every degree above an exact cutoff. Write C(n, S) = (1 + S)^(2/n) log(S / (S - 1)) for the squared-length coefficient produced by the ordinary analytic estimate at a simple saddle whose remaining critical values sit at normalised distance at least S. firstMerge_exact_convenient_thresholds proves C(n, 4) < 1 for n at least 3, C(n, 3) < 1 for n at least 4 and C(n, 2) < 1 for n at least 6, each cutoff being the first degree where its inequality holds, a sharpness fact the companion paper records and the declaration does not state, and firstMerge_length_lt_two_of_squared_bound turns a squared length at most 4 C(n, S), together with C(n, S) < 1, into a length below 2 with no sign hypothesis. The uniformisation, univalence, Bergman and Pólya inputs behind that squared bound are ordinary mathematics.

    Boundary. The degree-seven theorem concerns total variation on [0, 1]. It does not formalise ani’s whole small-parameter family or prove a comparison with a Hausdorff-measure formulation. Independent human review of the historical correspondence has not been recorded. Every conditional statement carries its hypothesis, the two exact configurations are described only by what they exclude, and the finite selectors are real-variable statements. Priority is unresolved: a bounded search found no earlier form of the quintic selector or of the separation thresholds, and the alternation argument sits in the classical Chebyshev context. Dubinin's neighbouring relative-area inequality (2012) is listed in the sources; its text was not obtained and no claim here rests on it.
