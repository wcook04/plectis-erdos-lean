version: v0.4
project:
  name: 'Formal reductions, obstruction theorems, and verified subfamilies for eight Erdős problems'
  description: >-
    A Comparator-checkable restatement of the paper-linked Lean theorems that
    actually have proof coverage across eight open Erdős problems (#68, #243,
    #249, #251, #257, #269, #1041, #1049). The compared surface includes
    157 independently stated declarations (allStraightCubic_every_pair_midpoint_escapes, allStraightCubic_roots, allStraightCubic_roots_in_unitDisk, criticalDiskInverseBalance_twoRootProximity, criticalDiskInverseBalance_twoRootProximity_strict, criticalGeometricMean_twoRootProximity, nearestSpoke_reciprocal_balance, nearestSpoke_unique_nearest_normSq, nearestSpoke_unique_nearest_spoke_escapes, cyclicTrinomial_two_short_fiber_displacements, trinomialRoot_spoke_factorization, trinomialRoot_spoke_norm_le_constant, and 145 more).
    Parent problems remain open. This repository is the substantive formalization,
    not a thin wrapper around another public repo.
  authors:
  - Will Cook
  license: Apache-2.0
  responsible_maintainers:
  - Will Cook
