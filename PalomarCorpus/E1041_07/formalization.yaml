version: v0.4
project:
  name: 'Erdős #1041, the critical geometry, cyclic trinomial fiber and degree seven counterexample families'
  description: >-
    This entry states 21 theorems of the critical geometry, cyclic trinomial fiber, degree seven counterexample, first merge critical value separation and quartic quotient fiber developments of the Lean formalisation of Erdős problem #1041, to which no paper statement is bound. criticalGeometricMean_twoRootProximity: For n at least 2, complex points z 0 through z (n-1) and a point c differing from every z k, if the reciprocals (c - z k)⁻¹ sum to zero, so that c is a critical point of the monic polynomial with those root occurrences, and r is the positive real with r ^ n equal to the product of the distances ‖c - z k‖, then two distinct indices i and j satisfy ‖c - z i‖ + ‖c - z j‖ ≤ 2 * r: some two root occurrences have total distance at most twice the geometric mean of all n root distances. criticalDiskInverseBalance_twoRootProximity: A real-scalar inequality in N, t, δ and e with no polynomial, root or critical point in its statement: for reals N ≥ 2, t < 1 and 0 < δ ≤ e with δ ≤ 1, e ≤ 1 + t, e ≤ (N - 1) * δ and N ≤ (1 - t ^ 2) * (1 / δ ^ 2 + (N - 1) / e ^ 2), the sum δ + e is at most 2. criticalDiskInverseBalance_twoRootProximity_strict: The same real-scalar hypotheses as criticalDiskInverseBalance_twoRootProximity with e ≤ 1 + t strengthened to e < 1 + t, which upgrades the conclusion from δ + e ≤ 2 to δ + e < 2; like that declaration it names no polynomial. nearestSpoke_reciprocal_balance: The reciprocals of the five listed roots sum to zero, so the origin is a critical point of the monic quintic whose roots are exactly those five points. nearestSpoke_unique_nearest_normSq: Every index k other than 0 satisfies Complex.normSq (root 0) < Complex.normSq (root k), so the real root a is the strictly unique nearest root to the critical point at the origin; squared moduli are used so that the exact certificate involves no square root. nearestSpoke_unique_nearest_spoke_escapes: Exact rational inequality stating that a displayed product of four positive rationals exceeds 1. allStraightCubic_roots: Each of the three listed points is a zero of that monic cubic. allStraightCubic_roots_in_unitDisk: Each of the three listed roots has modulus strictly less than 1, so this cubic satisfies the open-unit-disc hypothesis of the parent problem. allStraightCubic_every_pair_midpoint_escapes: For every pair of distinct indices i and j the midpoint (root i + root j) / 2 has cubic value of modulus strictly greater than 1, so for this cubic no straight segment between two roots stays inside the open unit lemniscate. trinomialRoot_spoke_factorization: Exact identity eliminating the middle coefficient of a trinomial at one of its roots: if w satisfies w ^ m + a * w ^ r + c = 0 then for every real u the value of z ↦ z ^ m + a * z ^ r + c at the point u * w equals (1 - u ^ r) * c - (u ^ r - u ^ m) * w ^ m, with the real coefficients cast into the complex numbers. trinomialRoot_spoke_norm_le_constant: If r ≤ m, w is a root of z ^ m + a * z ^ r + c with ‖w‖ ^ m ≤ ‖c‖, and u lies in [0, 1], then the trinomial has modulus at most ‖c‖ at the point u * w, so the whole spoke from the origin to such a root lies in the closed sublevel set of the constant term, that is in {|f| ≤ |f 0|}. trinomialRoot_spoke_norm_lt_one: Strict unit-lemniscate form of the preceding bound: adding ‖c‖ < 1 to the hypotheses r ≤ m, w a root of z ^ m + a * z ^ r + c, ‖w‖ ^ m ≤ ‖c‖ and u in [0, 1] gives modulus strictly below 1 at u * w, so the whole spoke of such a root lies in the open unit lemniscate. trinomialRoot_spoke_norm_lt_one_of_norm_lt_one: The form reaching every root of the trinomial: for 1 ≤ r ≤ m, a root w of z ^ m + a * z ^ r + c with ‖w‖ < 1, a constant term with ‖c‖ < 1, and u in [0, 1], the trinomial has modulus strictly below 1 at u * w. cyclicTrinomial_two_short_fiber_displacements: Supporting metric step for the fibre assembly: two complex numbers of modulus strictly below 1 have moduli summing to strictly less than 2, which is the length threshold of the parent problem. degreeSevenCounterexample: There exists a monic complex polynomial p of degree seven whose roots all have modulus strictly below 1 and whose root multiset has no repetitions. firstMerge_exact_convenient_thresholds: Three exact all-degree threshold regimes stated as one conjunction: C(n, 4) < 1 for every natural n at least 3, C(n, 3) < 1 for every n at least 4, and C(n, 2) < 1 for every n at least 6. firstMerge_length_lt_two_of_squared_bound: Numerical consumer of the thresholds: for any natural n and any reals S and length, if length ^ 2 ≤ 4 * C(n, S) and C(n, S) < 1, then length < 2. rootLift_kernel_le_axis: Elementary real inequality: for reals alpha ≤ 1 and x > 0 and any real d, the power (√(d ^ 2 + x ^ 2)) ^ (alpha - 1) is at most x ^ (alpha - 1), the exponent being nonpositive while √(d ^ 2 + x ^ 2) is at least x. rootLift_axis_integral: Elementary exact integral: for reals alpha > 0 and A ≥ 0, alpha times the interval integral of x ^ (alpha - 1) over [0, A] equals A ^ alpha, with real exponents throughout. rootLift_endpoint_budget_lt_two: For a real exponent alpha > 0 and endpoint moduli a and b in [0, 1), the powered budget a ^ alpha + b ^ alpha is strictly less than 2, which is the length threshold of the parent problem. rootLift_length_lt_two_of_le_endpoint_budget: Consumer of the endpoint budget: any real length bounded by a ^ alpha + b ^ alpha, with alpha > 0 and a, b in [0, 1), is strictly less than 2, with no sign hypothesis on length.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    A degree-seven counterexample due to ani, formalised in this corpus, refutes the total-variation formulation of Erdős problem #1041; the theorems in this entry keep their stated hypotheses.
