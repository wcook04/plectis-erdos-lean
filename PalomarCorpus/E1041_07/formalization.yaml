  authors:
  - "V. S. Pendyala"
  id: "arXiv:2606.24875"
  type: "paper"
  relationship: "background"
  note: "Settles the degree-four case of the parent problem unconditionally by a radial-arm argument from the centre of the smallest disc containing the four zeros, and is the directly comparable adjacent result. The spoke declarations here are origin spokes for sparse coefficient families and a three-point origin-spoke selector; that mechanism is shared with this paper and no priority is claimed for it. The degree-three theorem compared here was proved without this paper and takes no statement, constant, or argument from it."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "On the length of lemniscates"
  authors:
  - "Alexandre Eremenko"
  - "Walter Hayman"
  id: "arXiv:0805.2295"
  type: "paper"
  relationship: "background"
  note: "Bounds the total length of the level set |p| = 1 by 9.173 times the degree and shows an extremal level set is connected; that is a different metric quantity and supplies no internal root-to-root connector, so nothing here uses it."
  license: "unknown"
  author_endorsement: "not-contacted"
