version: v0.4
project:
  name: 'Erdős #249, record section 6.4: further exact identities (part 1 of 3)'
  description: >-
    This entry states 21 theorems that the long record for Erdős problem #249 states in section 6.4 (further exact identities): the proposition “The exact totient difference on an LCM progression” (section 6.4), as totient_mul_eq_totient_mul_gcd_div_totient_gcd, lcmRayArithmeticLetter_eq_totient_difference, lcmRay_divisor_clean_formula, lcmRay_divisor_denominators_pos, lcmRay_divisor_gcd_example, lcmRay_divisor_product_formula and lcmRay_nondivisor_literal; the proposition “A lower bound for the totient of a rough integer” (section 6.4), as rough_integer_prime_count_and_totient_bound; the proposition “Positivity of the short-window differences” (section 6.4), as shortWindow_totient_difference_pos; the proposition “The accumulated sum is the discrepancy” (section 6.4), as weighted_shortWindow_band_iff_certifiedKill and weighted_shortWindow_sum_eq_windowDiscrepancy; the proposition “A global-to-local identity” (section 6.4), as actualLcmTailOrbit_global_to_local; the proposition “A rational approximation with an error bound” (section 6.4), as tendsto_actualLcmRawErrorRadius_atTop_nhds_zero and abs_actualLcmTailOrbit_sub_rawApprox_lt_explicit; the proposition “Unconditional positivity” (section 6.4), as actualLcmTailOrbit_pos and actualLcm_tailDiff_shift_pos_paper; the proposition “The residue forced by integrality” (section 6.4), as actualLcm_integral_forces_topEdgeResidue_paper; the proposition “The penultimate term of a partial divisibility pattern” (section 6.4), as dyadicScale_unique_in_open_interval and penultimate_shortWindow_difference_eq_half; the proposition “An equivalent test using two residue bits” (section 6.4), as dyadicMixedGuard_iff_twoBitBand and exists_certifiedKill_iff_twoBitResidueTest.

    5 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 16 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #249 remains open, and no theorem in this entry decides it.
