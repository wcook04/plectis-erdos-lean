version: v0.4
project:
  name: 'Erdős #249, the carry rank frontier, dyadic totient kernel and Farey window exclusion families'
  description: >-
    This entry states 19 theorems of the carry rank frontier, dyadic totient kernel, Farey window exclusion, full depth ray amplifier and Mobius Mersenne ladder structure developments of the Lean formalisation of Erdős problem #249, to which no paper statement is bound. totient_carryKernel_diff: Supporting channel recovery: for a tempered integral carry `u` of `Nat.totient` with multiplier `v`, any level `j` and any residue `r > 0`, the scaled totient section `n ↦ v φ(2 ^ j n + r)` equals `n ↦ 2 u (2 ^ j n + r - 1) - u (2 ^ j n + r)` as functions `ℕ → ℚ`, so every positive-residue totient channel is recovered from two adjacent carry sections. finrank_canonicalCarryKernel_ge_of_certificate: Supporting rank transport: given `v > 0`, a tempered integral carry `u` of `Nat.totient` with multiplier `v`, a depth `e`, and a separated minor certificate for the canonical totient family at depth `e`, the `ℚ`-span of the carry sections through depth `e` has `finrank` at least `2 ^ e - 1`. not_irrational_totientSeries_implies_unbounded_carryRank_unconditional: If the binary totient series is not irrational, then there are `v > 0` and a tempered integral carry `u` of `Nat.totient` with multiplier `v` such that for every depth `e` the `ℚ`-span of its canonical carry sections has `finrank` at least `2 ^ e - 1`. carryShift_dvd_iff_tailDiff_mem_int: Supporting bridge: for a tempered integral carry `u` of `Nat.totient` with multiplier `v > 0`, the integer `v` divides `u (N + k) - u N` if and only if the tail difference `R_{N + k} - R_N` lies in the image of `ℤ` in `ℝ`. not_irrational_totientSeries_implies_mod_period_and_unbounded_rank: The principal conditional theorem: if the binary totient series is not irrational, then one and the same tempered integral carry `u`, with some multiplier `v > 0`, has `ℚ`-section `finrank` at least `2 ^ e - 1` at every depth `e` and is eventually periodic modulo `v` with one fixed positive period `h` beyond one threshold `N₀`. dyadicTotientKernelOddCoreBasisAndFiniteRanks: Unconditional structure theorem for the dyadic kernel of Euler's totient: the odd-core family is `ℚ`-linearly independent, its `ℚ`-span equals the span of the full dyadic kernel, and for every `e ≥ 1` the span of the complete unreduced family through level `e` equals the span of the canonical family and has `finrank` exactly `2 ^ e + 1`. tsum_totient_div_pow_two_ne_int_div_of_den_le_79639646646701375323355774875831053: Finite exclusion: for every integer `a` and every natural `d` with `0 < d ≤ fareyDenBound`, the real number `∑' n, φ(n) / 2 ^ n` is different from `a / d`. eventually_twoSyndetic_fullDepthKillMultipliers_of_seed: Amplification from one seed: if `d > 0` and a single certificate `certifiedKill d N L` holds, then there is `T > 0` such that every `t ≥ T` admits a full-depth multiplier `m` with `t ≤ m ≤ t + 1`, so the full-depth multipliers meet every sufficiently late pair of consecutive integers. exists_fullDepthKill_on_ray_iff_shift_notMem_int: Exact criterion on one ray: for `d > 0` there is `t > 0` with `certifiedKill (t d) N (t d)` if and only if the tail difference `R_{N + d} - R_N` lies outside the image of `ℤ` in `ℝ`. apFullDepthEscape_iff_irrational: Exact reformulation: the full-depth escape statement holds if and only if `∑' n, φ(n) / 2 ^ n` is irrational. cofinalFullDepthKillSupply_iff_periodMultipleKillSupply: Supporting equivalence: the cofinal full-depth supply and the period-multiple supply, whose window lengths are unconstrained, are the same statement. cofinalFullDepthKillSupply_iff_irrational: Exact reformulation: the cofinal full-depth supply holds if and only if `∑' n, φ(n) / 2 ^ n` is irrational. mobiusMersenneTheta_no_linearRecurrence_of_eventually: No nonzero finite real linear combination of consecutive Möbius-Mersenne ladder values vanishes on an entire tail. mobiusMersenneTheta_no_linearRecurrence: The Möbius-Mersenne ladder satisfies no nontrivial finite linear recurrence over the reals at all positive indices. mobiusMersenneTheta_strict_logConcave: Unconditional: for every rung `r ≥ 1` the Möbius-Mersenne ladder is strictly log-concave, `Θ_r Θ_{r + 2} < Θ_{r + 1} ^ 2`. mobiusMersenneTheta_hankel_two_neg: The same fact written as strict negativity of the shifted order-two Hankel determinant, `Θ_r Θ_{r + 2} - Θ_{r + 1} ^ 2 < 0` for every `r ≥ 1`. mobiusMersenneLambertRung_eq: At each positive rung r, the Möbius-Lambert sum equals 2^(−r). lambertRung_shifted_hankelDet_eq_zero: Every shifted Hankel determinant of the Möbius-Lambert rung sequence with size at least two and positive shift vanishes. mobiusMersenneTheta_ne_mobiusMersenneLambertRung: The Möbius-Mersenne ladder and the Möbius-Lambert rung sequence do not agree at every positive index.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #249 remains open, and no theorem in this entry decides it.
