version: v0.4
project:
  name: 'Erdős #1041, note sections 1 to 7: monic trinomials, in every degree; critical proximity and straight-path obstructions; solved polynomial families'
  description: >-
    This entry states 11 theorems that only the short note for Erdős problem #1041 states, in sections 1 (monic trinomials, in every degree), 4 (critical proximity and straight-path obstructions), 5 (solved polynomial families), 6 (critical-value separation in every degree) and 7 (three limits of the sufficient conditions): the proposition “failure of a prescribed radial segment” (section 1), as sextic_spoke_counterexample_whole; the theorem “a geometric-mean bound for distances to a critical point” (section 4), as exists_two_roots_dist_sum_le_two_mul_geomMean; the corollary “two nearest roots” (section 4), as exists_two_nearest_roots_of_polynomial_critical and two_nearest_roots_of_polynomial_critical; the proposition “two counterexamples to straight-path assertions” (section 4), as complete_straight_path_obstructions; the theorem “quintics with two missing coefficients” (section 5.2), as complete_primitive_quintic; the corollary “a sufficient condition for a length-2 path” (section 6), as separation_parent; the proposition “failure of two critical-value criteria to cover all polynomials” (section 7), as complete_sep_or_counterexample; the proposition “a counterexample to the proposed one-root perimeter bound” (section 7), as lobe_perimeter_gt, one_root_gamma_false and one_root_gamma_false_unconditional.

    separation_parent assumes the named input CriticalValueSeparationTheorem as a hypothesis: for a monic complex polynomial f of degree n ≥ 3, a simple critical point c with v = f(c) ≠ 0, a centre w₀ in [0, 1] and S > max(w₀, 1 - w₀) such that every other critical point d satisfies |f(d)/v - w₀| ≥ S, two distinct roots of f are joined inside {|f| ≤ |v|} by a path whose squared length is at most 2|v|^(2/n) (S/(n - 1))^(2/n) log((S² + S + w₀(1 - w₀))/(S² - S + w₀(1 - w₀))). This is the paper's own critical-value separation theorem; this repository does not formalise it.

    10 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 1 is derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    A degree-seven counterexample due to ani, formalised in this corpus, refutes the total-variation formulation of Erdős problem #1041; the theorems in this entry keep their stated hypotheses.
