version: v0.4
project:
  name: 'Erdős #251, the shifted four prime counting and sparse rationalisation families'
  description: >-
    This entry states 5 theorems of the shifted four prime counting and sparse rationalisation developments of the Lean formalisation of Erdős problem #251, to which no paper statement is bound. shifted_count_bound: Unconditional finite counting inequality with no sieve assumption. separated_zeroDensity_of_quad_sieve: Conditional consequence. arbitrary_word_sparse_rationalisation: For any natural digit word `a` with dyadic sum `A = ∑ a n / 2 ^ (n + 1)`, any real envelope `f` tending to infinity and any natural `K`, there are a set `S` of indices, all at least `K`, of upper Banach density zero, and reals `l < u` with `A < l`, such that every real `r` in `[l, u]` is the dyadic sum of `a + e` for a natural word `e` supported in `S`, eventually at most `f`, whose values and prefix sums `∑ i < n, e i` are eventually divisible by every positive `q`. polylogarithmic_word_interval: For a natural digit word `a` with dyadic sum `A`, `ε > 0` and `K`, there are a start index, reals `l < u` with `A < l` and `C > 0` such that schedule centres for the envelope `(log (n + 3)) ^ ε` are at least `K`, have upper Banach density zero and number at most `C X / log (log (X + 3))` in `[X, X + L)` for large `X` and `L ≤ 2 X`; every `r` in `[l, u]` is the dyadic sum of `a + e` for a natural `e` on those centres, eventually at most the envelope, zero below `K`, with values and prefix sums eventually divisible by each positive `q`; and for block lengths `m X = o(log (log X))` the total variation distance of the length-`m X` block laws of `a` and `a + e` on `[X, 2 X)` tends to `0`. growing_block_TV: Let `a` and `b` be sequences with values in an arbitrary type that differ only at centres of the schedule for the envelope `(log (n + 3)) ^ β`, with `β > 0` and any start index.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #251 remains open, and no theorem in this entry decides it.
