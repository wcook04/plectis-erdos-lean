  authors:
  - "Jan-Christoph Schlage-Puchta"
  id: "arXiv:1105.1451"
  type: "paper"
  relationship: "background"
  note: "The nearest located neighbour for the tail criteria recorded here, with no antecedent located: its Theorem 2 treats base-b digit strings that concatenate the representations of a slowly growing integer sequence, and its Theorem 3 gives linear independence over the rationals for series of prime powers over factorials. Its Lemma 4, a Selberg-sieve density-zero statement for polynomial relations among consecutive prime gaps, is used in the companion reasoning record; the compared declarations that need it carry it as the named hypothesis SchlagePuchtaLemma4 and do not formalise it."
  license: "unknown"
  author_endorsement: "not-contacted"
