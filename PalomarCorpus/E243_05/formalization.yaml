version: v0.4
project:
  name: 'Erdős #243, record section 7.3: counting jumps before a prime power can be lost'
  description: >-
    This entry states 8 theorems that the long record for Erdős problem #243 states in section 7.3 (counting jumps before a prime power can be lost): the theorem “counting crossings before a prime power is lost” (section 7.3), as mem_barrierIdx_iff and epoch_energy_named_crossing_set; the theorem “two convergence criteria for large record jumps” (section 7.3), as energy_window_real_bound, energySqrt_summable_iff, energy_criterion, energy_le_two_energySqrt, energy_summable_iff and exists_late_energy_window.

    2 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 6 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #243 remains open, and no theorem in this entry decides it.
