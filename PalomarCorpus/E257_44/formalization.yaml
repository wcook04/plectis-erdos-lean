version: v0.4
project:
  name: 'Erdős #257, record sections 10.3 to 10.4: related counterexamples and restrictions; the scalar-localisation height obstruction'
  description: >-
    This entry states 14 theorems that the long record for Erdős problem #257 states in sections 10.3 (related counterexamples and restrictions) and 10.4 (the scalar-localisation height obstruction): the proposition “A finite-state restriction for the stated pulse family” (section 10.3), as balancedPulseCoeff_injective, paper_balanced_pulse_fanout_is_radius_succ, paper_balanced_pulse_fanout_unbounded_corrected, paper_pulse_family_finite_state_card and paper_pulse_family_no_autonomous_decoder; the proposition “Möbius-support countermodel: the natural negative-sign candidate overshoots” (section 10.3), as paper_first_positiveMobius_tail_term and paper_mobius_support_overshoots_half; the proposition “Finite computation and half-membership” (section 10.3), as paper_finite_support_and_onesided_certificate; the proposition “Period exclusion for the totient series” (section 10.3), as paper_carry_survivor_extinction and paper_periodLcm_is_prefix_lcm; the lemma “Denominator complement survives scaling” (section 10.4), as paper_scalar_localization, paper_scalar_localization_size_bound and paper_scalar_localization_zero_degenerate; the corollary “Mersenne specialisation” (section 10.4), as paper_mersenne_height.

    11 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 3 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #257 remains open, and no theorem in this entry decides it.
