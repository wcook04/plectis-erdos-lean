version: v0.4
project:
  name: 'Erdős problem #243: a bounded product defect in the original coordinates, or an eventually bounded negative part of the cleared error, forces the Sylvester recurrence, with unconditional exclusions and exact record criteria'
  description: >-
    Erdős problem 243 asks whether rationality forces the Sylvester recurrence: let a 1 < a 2 < ... be positive integers with a (n+1) / a n ^ 2 tending to 1 and rational reciprocal sum, and ask whether a (n+1) = a n ^ 2 - a n + 1 for all large n. The problem is open, and nothing here settles it. The principal theorem reaches the recurrence in the problem's own coordinates under one added hypothesis: with P n the prefix product of the first n terms, if the product defect (P n / a n) (a n ^ 2 / a (n+1) - 1) is bounded above by a single constant from some index onward, then a (n+1) = a n ^ 2 - a n + 1 for all large n. That upper bound is assumed and is not derived from the rational-sum and growth hypotheses.

    Clearing denominators turns the rational case into an exact integer orbit. With x n the reciprocal tail, D n = q P n and C n = D n x n, the state obeys C (n+1) + D n = a n C n and D (n+1) = a n D n, and the centred error E n = D n - (a n - 1) C n vanishes exactly on a Sylvester tail. Its update C (n+1) = C n - E n turns a lower bound on the error into a cap on the numerator's rise. The second principal theorem works there: for an exact natural orbit with a n > 1 and C n > 0, an eventual lower bound -B at most E n, with division-free normalised vanishing, meaning K times the magnitude of E n is eventually below C n for every scale K, forces E n = 0 eventually and the recurrence eventually. No periodicity or sign condition appears, so aperiodic and infinitely sign-changing orbits are covered.

    Erdős and Straus proved in 1964 that a counterexample to the recurrence has positive limit superior for the quantity lcm(a 1, ..., a n) / a (n+1) times (a (n+1) ^ 2 / a (n+2) - 1), whose growth factor sits one index later than the product defect used here. Duverney settled a signed version in 2001 under convergence of the growth-defect series, and Badea gave a positive-term criterion in 1993. Koizumi, in Integers 26 (2026), Paper No. A28, uses the same cleared coordinates; his Proposition 1(2), attributed there to Badea, shows that an eventually nonnegative error vanishes eventually, and the theorem above replaces that sign condition by a bound on the depth of negative visits while adding normalised vanishing. His coordinates supply normalised vanishing on the canonical orbit, and supply neither a bounded negative part nor finite negative mass. Kovač and Tao resolved other Ahmes-series problems of Erdős and Graham in 2025, and the Formal Conjectures collection carries a statement-level Lean declaration of this problem whose proof ends in sorry.

    Two dynamical regimes are excluded outright. A reduced exact tail, meaning coprime states with u (n+1) + v n = a n u n and v (n+1) = a n v n, cannot have a numerator tending to infinity while rising by at most a fixed positive B at every step; a strengthening asks that budget only at the indices where the numerator is below twice the product P of B consecutive multipliers, and adds the start condition that the numerator is below P at index N + B. A second family excludes periodic and eventually periodic negative-error orbits with 0 < e n < a n and positive drift.

    A second conditional endpoint replaces the lower bound by summability. On an exact orbit with normalised vanishing, if the normalised negative mass, the sum of the positive part of -E n divided by C n, converges, then the centred error vanishes eventually and the recurrence follows. A scalar form of the same criterion needs only the update C (n+1) = C n - E n and that summability, and a canonical form places the summability on the state built from the problem's own data. Summability is a hypothesis in each of them, and any surviving counterexample has divergent normalised negative mass.

    The remaining families work in primitive coordinates: coprime pairs u n and v n carried by w n + v n = a n u n, w n = hc n u (n+1) and a n v n = hc n v (n+1), with arbitrary cancellation factors hc n. Two prove rigidity for restricted classes delimited by record behaviour: if every record-setting step of the primitive numerator rises by at most two, or if the running maximum increases by at most one at every late step, then under the centring bound 2 |e n| < u n, normalised vanishing, and a supply of prime powers dividing the denominator state at arbitrarily late indices, the recurrence holds eventually. The first needs odd prime powers above three times the running maximum at the supply index, the second any prime power at least that running maximum plus three; the supply is a hypothesis of both. A protected-epoch inequality charges one odd prime power against a finite set of cancellation-free record steps of jump at least three.

    Three results record exact local structure. A cancellation payment stays visible at the first later index t with negative centred error: if the intervening errors are nonnegative, then u t is at most u (s+1) and u s times u t is at most the running maximum at t times the magnitude of e t times u (s+1). That is an estimate at one pair of indices; it bounds no excursion length and is not a global rigidity theorem. A square-transport identity makes the whole next primitive numerator divide hc e e' - v ^ 2 with no hypothesis beyond the cocycle equations; its quadratic-character companion is a bare divisibility implication whose conclusion is only that an auxiliary natural factor differs from 1. A repair-entropy inequality charges the squared least common multiple of a repaired family of moduli against a fixed relative-error budget over a recovery window.

    Two equivalences are exact reformulations. In the least common multiple coordinates L n = lcm(q, a 0, ..., a (n-1)), with M n the overlap debt, U n = C n / M n by natural division and V n = L n - (a n - 1) U n, and for every weight f that is nonnegative and antitone on [1, infinity) with divergent integral, the sequence is eventually Sylvester if and only if the weighted record excess over the indices where U sets a strict record converges for some natural baseline B; the same holds in the original growth coordinates. The problem's hypotheses do not supply that convergence, so these criteria relocate the question.

    The audience is the literature on irrationality of Ahmes series and Egyptian-fraction tails, and the Diophantine study of doubly exponential integer sequences, where Erdős and Straus, Badea, Duverney, Kovač and Tao, and Koizumi work. The entry supplies a sufficient regime that widens the eventually nonnegative sign condition to bounded negative depth under normalised vanishing, a criterion under the problem's own hypotheses with one explicit extra bound, unconditional exclusions of two named regimes, rigidity for two restricted record classes, and two exact reformulations. Erdős problem 243 remains open.
