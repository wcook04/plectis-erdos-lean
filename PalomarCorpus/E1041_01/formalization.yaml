version: v0.4
project:
  name: Ani's degree-seven path-image counterexample and the all-degree trinomial case
  description: This entry selects seventeen declarations about polynomial lemniscates. The degree-seven
    construction is due to ani. The added interface existentially packages its monic, degree-seven, simple-root
    and unit-disc properties and the lower bound of two for the one-dimensional Hausdorff measure of any
    preconnected root-joining set inside the strict lemniscate. It also selects the exact negation and
    answer-false form of the stated path-image formulation. A separate unconditional all-degree theorem
    supplies short root connections for monic trinomials. Older total-variation and supporting geometric
    statements remain selected; the scaled low-critical-value statements retain the named LowCriticalThirteenTwentyFifths
    hypothesis. The historical wording of the original problem and its correspondence with the stated
    path-image formulation are not independently adjudicated by this entry.
  authors:
  - Will Cook
  license: Apache-2.0
  responsible_maintainers:
  - Will Cook
