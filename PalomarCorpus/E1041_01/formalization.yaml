version: v0.4
project:
  name: 'Erdős #1041, record sections 1 to 3: the historical question; trinomials; a small least critical value'
  description: >-
    This entry states 16 theorems that the long record for Erdős problem #1041 states in sections 1 (the historical question), 2 (trinomials) and 3 (a small least critical value): the statement labelled res:ani-degree-seven-counterexample-long (section 1), as erdos1041_ani_degree_seven, erdos1041_hausdorff_answer_false and erdos1041_hausdorff_negation; the theorem “trinomial root connections” (section 2), as complete_trinomial, all_degree_monic_trinomials_whole and all_spokes; the corollary “scale-free form” (section 3), as scaledLowCritical_of_lowCritical; the lemma “circle-slice packing” (section 3), as circle_slice_packing, circle_slice_packing_abstract, cosh_dist_polar, dist_polar_I, exists_polar, polar_zero_zero and circle_slice_packing; the theorem “a lower bound for the number of roots” (section 3), as dual_arity_floor_abstract; the corollary “scaled low-critical connection” (section 3), as scaledLowCriticalFiveHalves_of_lowCritical.

    scaledLowCritical_of_lowCritical and scaledLowCriticalFiveHalves_of_lowCritical assume the named input LowCriticalThirteenTwentyFifths as a hypothesis: every monic squarefree complex polynomial p of degree at least 2 whose least modulus at a critical point is at most 13/25 has two distinct roots joined by a continuous path of total variation less than 2 on which |p| < 1. This is the paper's own theorem on low critical values, whose proof uses the Riemann mapping theorem, the Bergman kernel, a hyperbolic packing argument, the coarea formula and Pólya's inequality; this repository does not formalise it.

    circle_slice_packing_abstract, circle_slice_packing and dual_arity_floor_abstract assume the named input cosh_dist_polar as a hypothesis: the point map pt into a pseudometric space satisfies cosh d(pt(d₁, θ₁), pt(d₂, θ₂)) = cosh d₁ cosh d₂ - sinh d₁ sinh d₂ cos(θ₁ - θ₂) for all real d₁, θ₁, d₂, θ₂. The theorem holds for every pseudometric space and point map with this property; in the hyperbolic plane, in geodesic polar coordinates, the property is the classical hyperbolic law of cosines, which this entry does not prove.

    15 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 1 is derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    A degree-seven counterexample due to ani, formalised in this corpus, refutes the total-variation formulation of Erdős problem #1041; the theorems in this entry keep their stated hypotheses.
