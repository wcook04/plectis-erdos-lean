version: v0.4
project:
  name: 'Erdős #249, record section 6.3: consequences (part 2 of 3)'
  description: >-
    This entry states 19 theorems that the long record for Erdős problem #249 states in section 6.3 (consequences): the proposition “An exact endpoint formula” (section 6.3), as integral_carry_strictly_between, endpoint_criterion_nonintegral, endpoint_identity, oddHalfCenteredLift_spec and centeredLift_range; the proposition “A sufficient extension of the examples through exponent 6” (section 6.3), as short_window_diagonal_through_six and short_window_diagonal_witnesses; the proposition “A sufficient extremal-order condition” (section 6.3), as extremal_order_curvature_ne_zero, extremal_order_curvature_neg and extremal_order_curvature_pos; the proposition “A directed certificate condition” (section 6.3), as directed_certificate_example and directed_certificate_iff; the proposition “A sufficient condition at the prescribed mod-four pulses” (section 6.3), as irrational_of_modFour_pulse_supply and rational_forces_pulse_class_integrality; the proposition “A sufficient condition on the LCM grid” (section 6.3), as irrational_totient_series_of_lcm_cone_window_kill_supply; the proposition “Unbounded Farey bounds imply irrationality” (section 6.3), as gapCertificate_window_1_240, gapFareyBound_window_1_240 and irrational_totientSeries_of_fareyGapExclusionUnbounded; the proposition “The lower bound and a false proposed upper bound” (section 6.3), as no_generic_rationality_carryRank_ceiling.

    12 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 7 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #249 remains open, and no theorem in this entry decides it.
