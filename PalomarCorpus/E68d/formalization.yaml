version: v0.4
project:
  name: 'Formal reductions for Erdős problem #68'
  description: >-
    A Comparator-checkable restatement of the paper-linked Lean theorems that
    actually have proof coverage for Erdős problem #68. The compared
    surface includes 1 independently stated declarations
    (product_lcm_pairwise_gcd). The parent problem remains open. This repository
    is the substantive formalization, not a thin wrapper around another public
    repo. This entry is one of eight problem-level Palomar configurations at
    the same repository and commit.
  authors:
  - Will Cook
  license: Apache-2.0
  responsible_maintainers:
  - Will Cook
repository:
  role: substantive-development
classification:
  arxiv:
  - math.NT
  - math.CA
  - math.CV
  msc2020:
  - "11A25"
  - "11B83"
  - "11B05"
  - "30C10"
sources:
- title: Formal reductions, obstruction theorems, and verified subfamilies for eight Erdős problems
  authors:
  - Will Cook
  type: original-proof
  relationship: other
  note: The compared theorems are independently restated Lean theorems proved in this repository and described in the eight public problem notes and reasoning records at https://github.com/wcook04/plectis-erdos. They do not solve the parent Erdős problem.
  license: Apache-2.0
  author_endorsement: participated
