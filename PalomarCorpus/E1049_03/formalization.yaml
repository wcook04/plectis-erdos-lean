version: v0.4
project:
  name: 'Erdős #1049, record sections 3 to 5; the adelic height bridge family: power comparisons and Hankel determinants; congruences after evaluation at 3/2'
  description: >-
    This entry states 5 theorems that the long record for Erdős problem #1049 states in sections 3 (power comparisons and Hankel determinants) and 5 (congruences after evaluation at 3/2): the theorem “sharp power bracket” (section 3), as power_bracket; the corollary “gaps between the stated logarithmic thresholds” (section 3), as height_and_hankel_deficits; the theorem “bounds for two proposed degree savings” (section 3), as charge_ceilings; the theorem “the first nonzero term at every rank” (section 3.1), as coeff_zudilinNormalizedHankelDet_all_rat; the theorem “equal residues with different values” (section 5), as exists_ne_map_eq_map_ne_of_card_mul_lt.

    It also states 13 theorems of the adelic height bridge development of the Lean formalisation of Erdős problem #1049, to which no paper statement is bound. zudilin_firstTransformedRow_initialMonomial: For every column index l, the entry of the first transformed row in that column has power series order exactly l + 1, the order being pinned to that finite value in the extended naturals, and coefficient exactly -6 in that degree, so its initial monomial is -6 q^(l+1). zudilinSharpHankelOrderAndCoeff_algebraicAssembly: Two division-free closed forms for the assembled Hankel data: six times the sum over j < N of j^2 equals N(N-1)(2N-1), and 2^N times the product over j < N of (j+1)^2 (j+2)/2 equals (N!)^2 (N+1)!. zudilinSharpHankelOrderAndCoeff_all: For every natural N, the normalised Hankel determinant of rank N has power series order equal to the sum over j < N of j^2, which is N(N-1)(2N-1)/6, pinned to that finite value in the extended naturals, and its coefficient in that degree equals the product over j < N of (j+1)^2 (j+2)/2. threePow_fortyOne_lt_twoPow_sixtyFive: The exact integer comparison 3^41 < 2^65, equivalently log 3 / log 2 < 65/41. twoPow_sixtyFour_lt_threePow_fortyOne: The exact integer comparison 2^64 < 3^41, the lower half of the same bracket. threeHalves_rectangular_hp_gap_gt_threeThirteenths: For every rho >= 0 and every sigma >= 1 + rho, that is over the whole admissible rectangular exponent cone, the model threshold falls short of log 2 / log 3 by more than 3/13. threeHalves_hankelChargeThreshold_lt_eightFortyOne: The real inequality (log 3 / log 2 - 1)/3 < 8/41, a consequence of 3^41 < 2^65. zudilinScalarContent_cannot_meet_required_charge: For integers N > 0 and extractedDegree at most N^3 - N, which is the ceiling for the scalar content of the cubic Hankel determinant, one has 41 extractedDegree < 39 (4N^3 - 3N^2). zudilinScalarPlusBorder_cannot_meet_required_charge: The same comparison with the larger ceiling: for integers N >= 2 and extractedDegree at most 2N^3 - N, which covers scalar content together with the forced first-order residual border, one still has 41 extractedDegree < 39 (4N^3 - 3N^2). three_two_scalar_margin_lt_explicit: For real C0 > 0 and C1 with 2 C0 <= C1, the balance C0 log 3 - C1 log 2 is strictly below -(17/41) C0 log 2. exists_distinct_binary_selectors_same_fourJet_of_power_certificate: Let forms be any n pairs of integer polynomials, let W be any width, let T > 0, and let 3^p < 2^q be any integer power certificate. exists_distinct_binary_selectors_same_fourJet_of_rank_41: The specialisation of the previous theorem at p = 41 and q = 65: for T > 0 and any family of n >= 130T + 2S pairs of integer polynomials, two distinct Boolean selectors have the same four-jet signature sum at bottom depth 41T and top depth S. fourJet_card_gt_two_pow_of_rank_41: For every S, the number 2^(129 + 2S) is strictly smaller than the cardinality of the four-jet signature group at bottom depth 41 and top depth S.

    3 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #1049 remains open, and no theorem in this entry decides it.
