version: v0.4
project:
  name: 'Erdős #1041, note sections 13 to 16: two chord constructions for binomials; a Poisson identity for critical-value means; a nonlinear integral for component mergers'
  description: >-
    This entry states 18 theorems that only the short note for Erdős problem #1041 states, in sections 13 (two chord constructions for binomials), 15 (a Poisson identity for critical-value means) and 16 (a nonlinear integral for component mergers): the theorem “complementary binomial chords” (section 13), as binomial_chord_decisive_step, binomial_chord_maximum, binomial_chords_above_threshold, binomial_chords_at_threshold, binomial_chords_below_threshold, binomial_chords_path and binomial_inner_chord_maximal; the theorem “a weighted inequality for points in a disc” (section 15), as paper_weighted_free_point and geometric_row_mean_closed_disc_le; the theorem “critical-value mean in every degree” (section 15), as paper_critical_value_mean; the theorem “the relation between two merger-scale integrals” (section 16), as exists_mergerIntegral_lt, mergerIntegral_eq_mul_phi, orliczKernel_continuous, orliczKernel_tendsto_zero, orlicz_currency, phi_div_tendsto_zero, phi_strictConvexOn and phi_strictMonoOn.

    16 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 1 is derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    A degree-seven counterexample due to ani, formalised in this corpus, refutes the total-variation formulation of Erdős problem #1041; the theorems in this entry keep their stated hypotheses.
