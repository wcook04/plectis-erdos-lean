version: v0.4
project:
  name: 'Erdős #249, record sections 12.1 to 12.2: the doubling identity; the full-block exponential-sum estimate'
  description: >-
    This entry states 20 theorems that the long record for Erdős problem #249 states in sections 12.1 (the doubling identity) and 12.2 (the full-block exponential-sum estimate): the lemma “The doubling identity” (section 12.1), as doublingMap_iterate_apply, orbit_tail_diff_eq, orbit_tail_diff_firstChar_eq, orbit_tail_diff_fract_eq_doubling_orbit, orbit_tail_diff_sub_scaled_is_int and orbit_tail_recurrence; the proposition “Transfer to the doubling orbit” (section 12.1), as irrational_totientSeries_of_block_cosine_gap; the corollary “A digit version of the analytic condition” (section 12.1), as cos_nonpos_of_quarterFarFromInt, irrational_totientSeries_of_digitChange_count, irrational_totientSeries_of_quarterFarPhase_count, irrational_totientSeries_of_quarterFarPhase_proportion, quarterFarFromInt_iff_binaryDigitAt_change, quarterFarFromInt_iff_floor_bounds and tailOrbitFirstExp_re_eq; the theorem “The block norm condition is stronger in the class 0≤ c(n)≤ n” (section 12.2), as cos_pi_div_eight_gt, irrational_lacBeta, lacBeta_eq_factorial_series, lacCoef_bounds, lacunary_block_cos_gap and lacunary_block_norm_fails.

    18 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 2 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #249 remains open, and no theorem in this entry decides it.
