version: v0.4
project:
  name: 'Erdős #249, record sections 9.3.4 to 9.3.10: separation of a rational approximation; the short-window examples through exponent 6; the diagonal certificate table'
  description: >-
    This entry states 31 theorems that the long record for Erdős problem #249 states in sections 9.3.4 (separation of a rational approximation), 9.3.5 (the short-window examples through exponent 6), 9.3.6 (the diagonal certificate table), 9.3.7 (one common certificate for sixteen shifts), 9.3.8 (the fixed Farey bound), 9.3.9 (a two-adic congruence that does not give a certificate) and 9.3.10 (the residue margin at an LCM jump): the theorem labelled statement:sha256:81919f6b5144c8fd4e4c5b741e55d8038955f8aaf108726dcc447e19d25e1b4e (section 9.3.4), as irrational_of_actualLcmOrbitSeparationSupply; the theorem labelled statement:sha256:d6f45a571aaeba3ad880ff5a95fd49653af8be9ea6b058bcd1947e1d5aba42e0 (section 9.3.5), as shortWindowSupply_through_six_paper, shortWindowSupply_single_witness_six_ninetyThree and shortWindowSupply_witness_eq_t64_certificate; the theorem labelled statement:sha256:c48e72cdf4757ab27d78c3ef9487d431ffa261de0d8e9cc9f0bbe447cb3eb3b2 (section 9.3.6), as diagonalPincerCertificateScales_list, diagonalPincerKillDepth_list, certifiedKill_diagonal_table, exists_diagonalKill_le_82_paper, exists_diagonalKill_on_table, periodLcm_seventeen_window_data and certifiedKill_diagonal_t64_paper; the proposition “A sufficient extension” (section 9.3.6), as irrational_of_restrictedDepth_diagonal_supply and irrational_of_logarithmicDepth_diagonal_supply; the theorem labelled statement:sha256:55434545e6306b9a7a70078f69c698579695f4f62cc6bfd1ea06f03b530262ee (section 9.3.7), as totientSeries_ne_rat_of_den_dvd_two_pow_fourteen_mul_mersenne, commonCertificate_eight_shifts_basepoint_twelve and commonCertificate_sixteen_shifts_basepoint_fourteen; the proposition “Simultaneous certificates with unrestricted depth” (section 9.3.7), as exists_growingShift_simultaneous_certificate_iff_irrational, exists_simultaneous_depth_of_irrational and exists_simultaneous_depth_succ_of_irrational; the theorem labelled statement:sha256:e0088a4173ef2a466ef68cf0d9cf821ce4e1697029ef410e077339bfa1ba36ad (section 9.3.8), as farey_gap_paper, gapCheck_window_1_240_first_failure_paper, gapCheck_window_1_240_paper and totientSeries_rational_den_gt_fareyBound; the proposition “A sufficient extension” (section 9.3.8), as gapCheck_window_one_excludes and irrational_of_unbounded_window_one_gapCheck; the theorem labelled statement:sha256:e5201e0f943c8678b14d940b4eeb5bcbe6dc7a4189a7a829d820f5d72f496d3f (section 9.3.9), as eventual_integral_tailDiff_twoAdic_half_pulse and exists_prime_twoAdic_half_pulse_window; the proposition “A sufficient accumulated-residue condition” (section 9.3.9), as certifiedKill_of_halfModulus_residue and irrational_of_accumulated_halfModulus_supply; the theorem “Arbitrarily large prime-power LCM jumps” (section 9.3.10), as exists_periodLcm_strict_jump_ge_paper and periodLcm_strict_jump_at_powerTwo_pred.

    19 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 12 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #249 remains open, and no theorem in this entry decides it.
