version: v0.4
project:
  name: 'Erdős #257, record sections 5.2 to 5.5: what is proved; integer quotients and their remainder identity; a real-valued form of the quotient identity'
  description: >-
    This entry states 14 theorems that the long record for Erdős problem #257 states in sections 5.2 (what is proved), 5.4 (integer quotients and their remainder identity) and 5.5 (a real-valued form of the quotient identity): the theorem “Full-support irrationality, unconditional, every base b ≥ 2” (section 5.2.1), as irrational_erdosSum_full_support; the theorem “Purely periodic support” (section 5.2.2), as irrational_erdosSupportSeries_periodic; the theorem “Eventually periodic support” (section 5.2.2), as irrational_erdosSupportSeries_eventuallyPeriodic; the theorem “Residue-class support” (section 5.2.2), as irrational_residueClass_positive_support; the theorem “Odd support” (section 5.2.2), as irrational_erdosSupportSeries_odd; the theorem “Achievement-set topology and measure” (section 5.2.3), as mersenne_topology_quantitative; the theorem “Membership equals greedy survival at every level” (section 5.2.3), as greedy_survives_of_mem_mersenneAchievementSet, mem_mersenneAchievementSet_iff_greedy_survival and mem_mersenneAchievementSet_of_greedy_survival; the theorem “Decomposition of the integer remainder” (section 5.4), as paper_master_identity_floors; the theorem “Real (non-integer) form of the quotient identity” (section 5.5), as mersenne_constant_decimal, row_constant_eq_tail, paper_real_quotient_core and paper_real_quotient_margins.

    10 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 4 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #257 remains open, and no theorem in this entry decides it.
