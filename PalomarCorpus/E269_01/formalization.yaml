version: v0.4
project:
  name: 'Erdős #269, record sections 1 to 2: the problem, and what is settled; the finite geometry of the running value'
  description: >-
    This entry states 13 theorems that the long record for Erdős problem #269 states in sections 1 (the problem, and what is settled) and 2 (the finite geometry of the running value): the theorem “two-prime transcendence” (section 1), as two_prime_sums_transcendental, two_prime_transcendence and transcendental_heckeValue; the theorem “the running least common multiple” (section 2), as running_lcm_real_cutoff_exact; the proposition “constancy and jump ratios” (section 2), as realPrefixLcm_eq_of_sameLogCell, realPrefixLcm_jump_first, realPrefixLcm_jump_second, realPrefixLcm_jump_third and threePrimeKernelQ_eq_of_sameRealLogCell; the proposition “jump count” (section 2), as paper_jump_count; the proposition “grouping equal heights” (section 2), as finiteSmoothKernelSum_groupedByHeight; the lemma “uniqueness in a short interval” (section 2), as exponent_unique_real_base_short_interval; the proposition “counting a shell by two coordinates” (section 2), as realSmoothExponentShell_bounds.

    two_prime_sums_transcendental, two_prime_transcendence and transcendental_heckeValue assume the named input BugeaudLaurentTranscendence as a hypothesis: for every irrational θ with 0 < θ < 1 and all nonzero real algebraic numbers β and α with |β| < 1 and |β| |α|^θ < 1, the Hecke-Mahler series F_θ(β, α), the sum over n ≥ 1 and 1 ≤ k ≤ ⌊nθ⌋ of β^n α^k, is transcendental. This is Theorem 1.1 of Bugeaud and Laurent (Acta Arithmetica 209, 2023) in the case ρ = 0, which is due to Loxton and van der Poorten (Bulletin of the Australian Mathematical Society 16, 1977); it is a published theorem that this repository does not formalise.

    12 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #269 remains open, and no theorem in this entry decides it.
