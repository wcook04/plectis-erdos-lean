version: v0.4
project:
  name: 'Erdős #1049, the prime support selectors, published height regions and rational base barrier families'
  description: >-
    This entry states 18 theorems of the prime support selectors, published height regions, rational base barrier and rational base region developments of the Lean formalisation of Erdős problem #1049, to which no paper statement is bound. twoSelector_rationalGap: At a rational target a/q with q > 0, two integral rows whose exterior determinant A_1 B_2 - A_2 B_1 is nonzero cannot both have remainder below 1/q: at least one of |B_1 (a/q) - A_1| and |B_2 (a/q) - A_2| is at least 1/q. integerLinearForm_rationalGap: At a rational target a/q with q > 0, an integral linear form B (a/q) - A that does not vanish has absolute value at least 1/q. rationalTwoSelector_notBothTendstoZero: For sequences of integral rows whose exterior determinant is nonzero at every index, the two real linear forms B_1 (a/q) - A_1 and B_2 (a/q) - A_2 cannot both tend to zero at a rational target a/q with q > 0. twoSelector_detHeightDecay_tradeoff: If two real linear forms at a common real target F have remainders |B_1 F - A_1| and |B_2 F - A_2| at most eps, then their exterior determinant satisfies |A_1 B_2 - A_2 B_1| <= eps (|B_1| + |B_2|), so joint decay is paid for in determinant size. twoSelector_unimodularHeightDecay_tradeoff: If a real two by two recombination with |u z - v w| = 1 and all four entries bounded in absolute value by H makes both recombined remainders at most eps >= 0 at a common real target F, then the original exterior determinant satisfies |A_1 B_2 - A_2 B_1| <= 2 H eps (|B_1| + |B_2|). primeSupportedTwoSelector_rationalGap: Let ell be prime, let q > 0 with ell not dividing q, let ell divide both B_1 and B_2, and let ell^2 not divide A_1 B_2 - A_2 B_1. primeSupportedOneRow_rationalGap: Let ell be prime with ell dividing B, ell not dividing A, and ell not dividing q > 0. primePowerSupportedOneRow_rationalGap: The same conclusion |B (a/q) - A| >= 1/q under prime-power support: ell prime, r nonzero, ell^r dividing B, ell not dividing A, and ell not dividing q > 0. zeroDenominatorCoordinates_binaryCollision: If the second coordinate of each of k pairs of residues modulo N vanishes, then N < 2^k already forces two distinct Boolean selectors with equal selected sums in both coordinates. threeHalves_zudilin_power_obstruction: The exact integer comparison 3^81 < 2^200, the verified numerical fact that places the base 3/2 beyond the 81/200 threshold. eightyOneTwoHundredths_lt_threeHalves_log_ratio: The real inequality 81/200 < log 2 / log 3, obtained by taking logarithms in the integer comparison above. threeHalves_outside_zudilinHeightRegion: The base 3/2 does not satisfy log 2 / log 3 < 81/200, so it lies outside the region defined above. threeHalves_outside_bundschuhVaananenHeightRegion: The base 3/2 also lies outside the Bundschuh-Vaananen region, since 1/2 - 1/pi^2 = 0.398678816. twoPow_le_rationalBaseForcingNat: For a genuine rational base, meaning denominator s >= 2, together with B >= 1 and coeff(N+1) >= 1, the forcing term is at least 2^(N+1). rational_base_region: For natural a>b>0 in the exact contour region, the literal Lambert value F(a/b) is irrational. thirtyone_four: The Lambert value F(31/4) is irrational. rational_base_measure: On the strict contour region for natural a>b>0, bounds the irrationality exponent of F(a/b) by the displayed exact rational-base expression. thirtyone_four_power_measure_lt_paper_fraction: For every positive natural r, the irrationality exponent of F((31/4)^r) is strictly less than the paper fraction 2981509/9909.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #1049 remains open, and no theorem in this entry decides it.
