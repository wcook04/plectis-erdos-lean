version: v0.4
project:
  name: 'An explicit rational-base irrationality region for Zudilin''s Lambert series'
  description: >-
    For coprime integers a > b >= 1 satisfying b^μ < a, equivalently log b / log a < θ*, the selected Lean theorems prove irrationality of F(a/b). They include the base 31/4 and every positive integer power, plus associated irrationality-measure bounds. The region excludes 3/2. This configuration does not select the paper's later sharp fixed-base asymptotic or all-rank Hankel results.

    To state them, the Challenge copies 19 declarations of the source development: paperLambert, reducedApproximationPairs, approximationExponents, irrationalityExponent, trigammaSeries, zudilinC1, zudilinJTerm, zudilinJ, zudilinC0, zudilinContour, ZudilinContourRegion, zudilinMu, paperMu, paperBvMu, bvMu, InOmegaSupport, omegaWeight, BundschuhVaananenHeightRegion and rationalBaseMeasureBound.
  authors:
  - Will Cook
  license: Apache-2.0
  responsible_maintainers:
  - Will Cook
