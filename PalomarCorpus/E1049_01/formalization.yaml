version: v0.4
project:
  name: 'Erdős #1049, record section 2: the region b^ mu < a and the base 31/4; positive linear forms with integer coefficients'
  description: >-
    This entry states 25 theorems that the long record for Erdős problem #1049 states in sections 2 (the region b^ mu < a and the base 31/4) and 2.4 (positive linear forms with integer coefficients): the lemma “the weight is an indicator” (section 2), as omega_indicator; the theorem “rational-base region” (section 2), as contour_enclosure, printed_contour, zudilinC0_enclosure, zudilinJ_enclosure, zudilin_rpow_lt_iff_contourRegion, rational_base_threshold and rational_base_threshold_log; the theorem “the base 31/4 outside the Bundschuh-Väänänen region” (section 2.4), as four_rpow_mu_lt_thirtyOne, printed_four_rpow_mu, paperBvMu_eq, printed_bvMu, printed_bv_cutoff, printed_four_rpow_bvMu, printed_log_ratio, inv_bvMu_eq, thirtyoneFour_between_rpow, thirtyoneFour_ratio_chain, thirtyoneFour_outside_bv_inside_contour, thirtyoneFour_irrational and thirtyoneFour_pow_irrational; the corollary “an irrationality measure uniform over powers” (section 2.4), as rational_base_measure_uniform, thirtyoneFour_power_measure_lt_301, rational_base_power_measure and thirtyone_four_power_measure_lt_301.

    22 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 1 is derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #1049 remains open, and no theorem in this entry decides it.
