  license: Apache-2.0
  author_endorsement: participated
- title: "On the irrationality of certain series: problems and results"
  authors:
  - "Paul Erdős"
  id: "doi:10.1017/CBO9780511897184.009"
  type: "paper"
  relationship: "background"
  note: "Poses the irrationality question for the Lambert value at rational bases (pages 102 to 109); no theorem in this entry is taken from it and none answers the question it poses."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "Arithmetical investigations of a certain infinite product"
  authors:
  - "Peter Bundschuh"
  - "Keijo Väänänen"
  id: "https://numdam.org/item/CM_1994__91_2_175_0.pdf"
  type: "paper"
  relationship: "background"
  note: "Compositio Math. 91 (1994), 175-199; Theorem 2 in the alpha = -1 case supplies the published height cutoff 1/2 - 1/pi^2 for rational bases. Only that elementary parameter inequality is written down here; their analytic irrationality theorem is not internalised or used."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "Heine's basic transform and a permutation group for q-harmonic series"
  authors:
  - "Wadim Zudilin"
  id: "doi:10.4064/aa111-2-4"
  type: "paper"
  relationship: "adapts"
  note: "Acta Arith. 111 (2004), 153-164; the rational-base construction and its parameter constants follow the Heine-transform and permutation-group architecture of this paper. The repository constructs the polynomial source, nonzero remainder and rates within Lean for the strict rational-base contour; no cited analytic conclusion is imported as an axiom. This attribution does not claim novelty of the underlying construction."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "On the irrationality of generalized q-logarithm"
  authors:
  - "Wadim Zudilin"
  id: "arXiv:1601.02688"
  type: "paper"
  relationship: "background"
  note: "Res. Number Theory 2 (2016), Art. 15; Section 4 (pages 6 and 7) proves the order inequality for the normalised Hankel determinant, and a remark in Section 2 (page 4) announces a rational-base extension with an unspecified computable constant. The normalised moments and the Hankel determinant restated here are Zudilin's construction; the compared statements give the order and coefficient of the first transformed row and the order and leading coefficient of the determinant at every rank, and no result of the paper is assumed."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "Little q-Legendre polynomials and irrationality of certain Lambert series"
  authors:
  - "Walter Van Assche"
  id: "doi:10.1023/A:1012930828917"
  type: "paper"
  relationship: "background"
  note: "Ramanujan J. 5 (2001), 295-310; recovers the integer-base irrationality exponent 2 pi^2/(pi^2 - 2) by little q-Legendre Pade approximants and supplies the scalar outward-evaluation architecture that the wider project measures. Nothing from it is assumed or formalised, and no declaration in this entry refers to its approximants."
  license: "unknown"
  author_endorsement: "not-contacted"
- title: "À propos de la série sum x^n/(q^n - 1)"
  authors:
  - "Daniel Duverney"
  id: "https://numdam.org/item/JTNB_1996__8_1_173_0.pdf"
  type: "paper"
  relationship: "background"
  note: "J. Théor. Nombres Bordeaux 8 (1996), 173-181; Theorem 2 gives a rational-base irrationality region for this same series, showing that rational bases were already in the literature. No statement here is taken from it."
  license: "unknown"
  author_endorsement: "not-contacted"
