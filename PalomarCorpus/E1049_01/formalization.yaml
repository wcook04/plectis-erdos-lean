  notes: >-
    Lead with rational_base_threshold and rational_base_threshold_log, not printed decimal enclosures. Preserve a > b >= 1, coprimality as stated, and the strict b^μ < a or logarithmic threshold. The source comments say coprimality matches the paper but is unused by the proof. Credit Zudilin's architecture and prior rational-base literature without a novelty claim for that architecture. No official full preflight or independent editorial review is asserted.
