version: v0.4
project:
  name: 'Erdős #1049, the Archimedean cap, Bezout Plucker jets and Hermite Pade no go families'
  description: >-
    This entry states 23 theorems of the Archimedean cap, Bezout Plucker jets, Hermite Pade no go, prime support selectors and published height regions developments of the Lean formalisation of Erdős problem #1049, to which no paper statement is bound. archimedean_cap: Archimedean cap. anchor_det_zero_forces_all_det_zero: Let w be a family of pairs in a commutative ring R, indexed by any type, and let a and b in R be coprime in the Bezout sense. binary_row_collision_of_anchor_det_zero: Under the hypotheses above with R and the index type both finite, if the cardinality of R is smaller than 2 raised to the number of indices, then two distinct Boolean selectors have the same selected row sum in R times R. adjacent_det_zero_forces_all_det_zero: For a sequence of pairs in a commutative ring whose second coordinates are all units, vanishing of every adjacent minor implies vanishing of every pairwise minor. zmod_binary_tail_collision_of_two_three_depth: At the modulus 2^S 3^R with R > 0, let w be a sequence of pairs of residues whose second coordinates are units and whose adjacent minors all vanish. hpClearedGap_expansion: Exact polynomial identity after the substitution sigma = 1 + rho + u: the cleared gap equals -pi^2 rho^2 - pi^2 rho u - 2 pi^2 rho - 2 rho^2 - 10 rho u - 4 rho - 6 u^2 - 8 u. hpClearedGap_nonpos: On the admissible region rho >= 0 and sigma >= 1 + rho the cleared comparison functional is nonpositive. hpClearedGap_eq_zero_iff: On that same admissible region the cleared comparison functional vanishes if and only if rho = 0 and sigma = 1, the classical one-function endpoint. rectangular_hp_threshold_le_classical: Over the whole admissible cone rho >= 0 and sigma >= 1 + rho, the rectangular two-function threshold of this explicit exponent model is at most 1/2 - 1/pi^2 = 0.398678816..., the classical one-function value. rectangular_hp_threshold_eq_classical_iff: On the same cone the threshold equals 1/2 - 1/pi^2 if and only if rho = 0 and sigma = 1. twoSelector_rationalGap: At a rational target a/q with q > 0, two integral rows whose exterior determinant A_1 B_2 - A_2 B_1 is nonzero cannot both have remainder below 1/q: at least one of |B_1 (a/q) - A_1| and |B_2 (a/q) - A_2| is at least 1/q. integerLinearForm_rationalGap: At a rational target a/q with q > 0, an integral linear form B (a/q) - A that does not vanish has absolute value at least 1/q. rationalTwoSelector_notBothTendstoZero: For sequences of integral rows whose exterior determinant is nonzero at every index, the two real linear forms B_1 (a/q) - A_1 and B_2 (a/q) - A_2 cannot both tend to zero at a rational target a/q with q > 0. twoSelector_detHeightDecay_tradeoff: If two real linear forms at a common real target F have remainders |B_1 F - A_1| and |B_2 F - A_2| at most eps, then their exterior determinant satisfies |A_1 B_2 - A_2 B_1| <= eps (|B_1| + |B_2|), so joint decay is paid for in determinant size. twoSelector_unimodularHeightDecay_tradeoff: If a real two by two recombination with |u z - v w| = 1 and all four entries bounded in absolute value by H makes both recombined remainders at most eps >= 0 at a common real target F, then the original exterior determinant satisfies |A_1 B_2 - A_2 B_1| <= 2 H eps (|B_1| + |B_2|). primeSupportedTwoSelector_rationalGap: Let ell be prime, let q > 0 with ell not dividing q, let ell divide both B_1 and B_2, and let ell^2 not divide A_1 B_2 - A_2 B_1. primeSupportedOneRow_rationalGap: Let ell be prime with ell dividing B, ell not dividing A, and ell not dividing q > 0. primePowerSupportedOneRow_rationalGap: The same conclusion |B (a/q) - A| >= 1/q under prime-power support: ell prime, r nonzero, ell^r dividing B, ell not dividing A, and ell not dividing q > 0. zeroDenominatorCoordinates_binaryCollision: If the second coordinate of each of k pairs of residues modulo N vanishes, then N < 2^k already forces two distinct Boolean selectors with equal selected sums in both coordinates. threeHalves_zudilin_power_obstruction: The exact integer comparison 3^81 < 2^200, the verified numerical fact that places the base 3/2 beyond the 81/200 threshold. eightyOneTwoHundredths_lt_threeHalves_log_ratio: The real inequality 81/200 < log 2 / log 3, obtained by taking logarithms in the integer comparison above. threeHalves_outside_zudilinHeightRegion: The base 3/2 does not satisfy log 2 / log 3 < 81/200, so it lies outside the region defined above. threeHalves_outside_bundschuhVaananenHeightRegion: The base 3/2 also lies outside the Bundschuh-Vaananen region, since 1/2 - 1/pi^2 = 0.398678816.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #1049 remains open, and no theorem in this entry decides it.
