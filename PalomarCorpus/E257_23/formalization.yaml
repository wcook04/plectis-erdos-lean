version: v0.4
project:
  name: 'Erdős #257, record sections 6 to 10: detailed results and their hypotheses; hypothesis-specific obstructions (part 2 of 3)'
  description: >-
    This entry states 4 theorems that the long record for Erdős problem #257 states in sections 6 (detailed results and their hypotheses) and 10 (hypothesis-specific obstructions): the theorem “Reduction to the nearest dyadic boundary” (section 6.2), as dyadicBandEscape_iff_exists_critical, exists_criticalDyadicBandIndex and seamUpperResetCriticalBandEscape_iff; the proposition “Quantifier collapse: one critical index suffices, not d+1” (section 10.5), as paper_critical_band_index_collapse.

    It also states 12 proof obligations of the definitions copied into it: seamPerturbedFamily_gap_pos, seamPerturbedFamily_oldSum_injective, seamPerturbedFamily_separated, seamPerturbedFamily_pulseCap_lt_three_gap, wordPulse_le, exists_seamWord_minimal_above, integerGreedyBits_length, seamAboveWord_minimal, seamAboveWord_strict, seamWeights_length_eq, seamAdjacentCut_below_admissible and seamAdjacentCut_below_maximal. Each is a lemma or a proof field that one of those definitions names, and its documentation names the source it is stated from. The papers state none of them, and the Solution proves each from the source development.

    10 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 6 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #257 remains open, and no theorem in this entry decides it.
