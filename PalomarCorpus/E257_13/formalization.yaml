version: v0.4
project:
  name: 'Erdős #257, record sections 6.1 to 6.2: conditional membership tests; exact identities and reductions'
  description: >-
    This entry states 6 theorems that the long record for Erdős problem #257 states in sections 6.1 (conditional membership tests) and 6.2 (exact identities and reductions): the theorem “Keeping the largest skipped rank beyond two thirds” (section 6.1), as half_mem_mersenneAchievementSet_of_largestSkipLateStepSocket; the theorem “Two sufficient bounds at middle transitions” (section 6.1), as half_mem_mersenneAchievementSet_of_middleProducerCardEscape and half_mem_mersenneAchievementSet_of_middleProducerRowEscape; the theorem “The tail inequality at a final middle transition” (section 6.1), as middleProducer_allRight_forces_rational_skip; the theorem “Upper-reset dyadic-band escape, checked for 13≤ d≤30” (section 6.1), as half_mem_mersenneAchievementSet_of_upperResetDyadicBandEscape; the theorem “Equivalent descriptions of half-membership” (section 6.2), as half_mem_mersenneAchievementSet_iff_unboundedUpperOrMiddle.

    It also states 12 proof obligations of the definitions copied into it: seamPerturbedFamily_gap_pos, seamPerturbedFamily_oldSum_injective, seamPerturbedFamily_separated, seamPerturbedFamily_pulseCap_lt_three_gap, wordPulse_le, exists_seamWord_minimal_above, integerGreedyBits_length, seamAboveWord_minimal, seamAboveWord_strict, seamWeights_length_eq, seamAdjacentCut_below_admissible and seamAdjacentCut_below_maximal. Each is a lemma or a proof field that one of those definitions names, and its documentation names the source it is stated from. The papers state none of them, and the Solution proves each from the source development.

    7 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 11 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #257 remains open, and no theorem in this entry decides it.
