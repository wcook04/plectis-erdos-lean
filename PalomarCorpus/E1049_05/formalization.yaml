version: v0.4
project:
  name: 'Erdős #1049, record sections 5 to 9: congruences after evaluation at 3/2; failure of the stated clearing conditions at 3/2; successive scaled remainders'
  description: >-
    This entry states 15 theorems that the long record for Erdős problem #1049 states in sections 5 (congruences after evaluation at 3/2), 6 (failure of the stated clearing conditions at 3/2), 7 (successive scaled remainders), 8 (the height criterion at 7/2) and 9 (a denominator-exponent model for Padé-type forms): the theorem “endpoint residues” (section 5), as endpoint_residues; the proposition “common divisor” (section 5), as commonMultiplier_not_two_not_three_of_endpoint_units; the corollary “limits of rescaling and common-divisor cancellation at 3/2” (section 5), as endpoint_scalar_content_exclusion; the proposition “coprimality of homogenised cyclotomic values” (section 5), as cyclotomicHomEval_isCoprime_mul; the theorem “equal residues for two subset sums” (section 5), as fourJet_paper_statement; the corollary “the exact count at depth 41” (section 5), as rank_fortyone; the theorem “vanishing minors and a residue count” (section 5), as plucker_paper_statement; the theorem “a restriction on the two scalar exponents” (section 5), as scalar_margin; the theorem “a necessary inequality for clearing” (section 6), as coordinatewiseCorridor_implies_pow_lt_linear; the proposition labelled long1049:res:exp (section 6), as three_mul_lt_two_pow_succ; the theorem “failure of the stated clearing conditions at 3/2” (section 6), as threeHalves_no_coordinatewiseCorridor; the theorem “recurrence for the scaled remainder” (section 7), as rationalBaseClearedTailQ_succ; the theorem “the forcing term” (section 7), as forcing_term; the theorem “the 7/2 height condition” (section 8), as sevenHalves_archimedean_height_condition; the proposition “exponent model: summand bound and exact gap” (section 9), as pade_summand_bound_and_gap.

    13 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #1049 remains open, and no theorem in this entry decides it.
