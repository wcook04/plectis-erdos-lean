version: v0.4
project:
  name: 'Erdős #249, record sections 6.6.5 to 6.6.9: a numerator polynomial with explicit positive coefficients; exact dyadic comparisons and tail bounds; squared distances between complex phases'
  description: >-
    This entry states 28 theorems that the long record for Erdős problem #249 states in sections 6.6.5 (a numerator polynomial with explicit positive coefficients), 6.6.6 (exact dyadic comparisons and tail bounds), 6.6.7 (squared distances between complex phases), 6.6.8 (approximating the nondivisor terms) and 6.6.9 (coprime-pair sums): the corollary labelled statement:sha256:1aba8ef26e7606ffeb744eeb5281561279d804bd6a828bd921e42781105432b2 (section 6.6.5), as paperNumerator_eval_two and paperNumerator_eval_two_primeSubsetForm; the proposition “The geometric remainder bound” (section 6.6.6), as four_thirds_tsum_eighth_pow_tail, mersenneRemainderTail_le, mersenneRemainder_identity_and_bound, one_sub_half_pow_ge and tsum_eighth_pow_tail; the proposition “Squared distance from the phase one” (section 6.6.7), as sum_sq_dist_from_phase_one; the lemma “Squared-distance bound for separated pairs” (section 6.6.7), as card_mul_sq_le_pairwise_energy; the proposition “The finite divisor sum” (section 6.6.8), as scaleExplicitShadow_eq_divisorChannels, divisorChannels_sum_eq, residueKernel_increment_of_dvd and residueOffset_of_dvd; the proposition “Separation larger than the error implies exclusion” (section 6.6.8), as foreignComplementBound_paper, projectedForeignDefect_paper and tailDifference_not_integral_of_separation; the theorem “Coprime-pair counting and the totient” (section 6.6.9), as boundary_pair_at_one and card_coprime_antidiagonal; the proposition “Two lattice sums” (section 6.6.9), as coprimeLattice_gcd_layer_total, coprimeLattice_gcd_layer_total_eq_one_iff, coprimeLattice_halfOpen_sum, coprimeLattice_positive_sum, coprimeLattice_removed_pair and tsum_totient_pow_shift; the theorem “The classical coprime-pair Lambert identity” (section 6.6.9), as coprimeLattice_halfOpen_half_eq_series, coprimeLattice_lambert_half_eq_one, coprimeLattice_lambert_identity and coprimeLattice_lambert_rational.

    27 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 1 is derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #249 remains open, and no theorem in this entry decides it.
