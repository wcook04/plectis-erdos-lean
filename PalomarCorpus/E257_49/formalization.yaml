version: v0.4
project:
  name: 'Erdős #257, the achievement set geometry, actual upper successor and Boolean Mobius carry families'
  description: >-
    This entry states 11 theorems of the achievement set geometry, actual upper successor, Boolean Mobius carry and dyadic observation summability developments of the Lean formalisation of Erdős problem #257, to which no paper statement is bound. volume_supportedMersenneAchievementSet_eq_zero_of_rat_value: Rational fibre measure no go: if 0 is not in J and the value coded by J, that is the sum over m in J of 1 divided by 2 to the power m minus 1, equals a rational number q, then the supported achievement set of J has Lebesgue measure zero. supportedMersenneAchievementSet_geometry_and_volume: Complete geometry and Lebesgue measure classification, for every set J of allowed digit positions and with no hypothesis on J: the supported coding map is injective, its range is compact and nowhere dense, the range is perfect whenever J is infinite, and one of two mutually exclusive cases holds for the measure, which is valued in the extended nonnegative reals; either the complement of J is a finite set F and the measure is the inverse of 2 raised to the cardinality of F, or the complement of J is infinite and the measure is 0. actualUpperRightPacketLinearEscape_iff_successorLinearEscape: The terminal packet lower envelope and the pulse free successor lower envelope are equivalent as propositions. actualUpperSuccessorLinearEscape_completeCounterexample: Conditional on the pulse free successor lower envelope holding, there is an infinite set A of natural numbers whose base two series with terms 1 divided by 2 to the power a minus 1 equals exactly one half, and the universal irrationality assertion of the parent problem is therefore false. exists_booleanMobiusCarry_of_support_fraction: If A does not contain 0, contains some positive element, and its base two support series equals p divided by q for an integer p and a positive natural q, then there is an integer sequence U carrying a Boolean Moebius carry certificate for p over q whose Moebius transform selects exactly the set A. support_fraction_of_booleanMobiusCarry: Converse direction: from a Boolean Moebius carry certificate for p over q with q positive, the support selected by the Moebius transform of the carry quotient omits 0 and its base two support series equals exactly p divided by q. reconstructsSupport: Full reconstruction from a Boolean Moebius carry certificate with q positive: the selected support omits 0, the carry quotient coincides with the divisor incidence arithmetic function of that support, the sequence U is a tempered binary carry orbit for those coefficients at modulus q, the Moebius transform selects exactly that support, and its base two support series equals p divided by q. exists_normalized_support_fraction_iff_exists_booleanMobiusCarry: Existence level equivalence for a positive natural q: a normalised nonempty support with base two value exactly p divided by q exists if and only if a Boolean Moebius carry certificate for p over q exists. dyadic_supportObservationMass_sum_le: Explicit majorant: if alpha is nonnegative on A and the conductor weighted terms of A are summable, then for every finite set J of dyadic levels and every natural Q, the sum over j in J of 2 to the power minus j times the observation mass up to Q times 2 to the power j is at most 2 Q times the total conductor weighted mass. summable_dyadic_supportObservationMass: Under the same nonnegativity and conductor weighted summability hypotheses, and for every natural Q, the sequence indexed by the dyadic level j whose term is 2 to the power minus j times the observation mass up to Q times 2 to the power j is summable. tendsto_dyadic_supportObservationMass_mean: Under the same nonnegativity and conductor weighted summability hypotheses, and for every natural Q, the sliding window mean over the dyadic levels from M to 2M minus 1 of 2 to the power minus j times the observation mass up to Q times 2 to the power j, divided by M, tends to 0 as M tends to infinity.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #257 remains open, and no theorem in this entry decides it.
