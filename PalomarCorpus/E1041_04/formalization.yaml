version: v0.4
project:
  name: 'Erdős #1041, record sections 7 to 10: collinear roots and two sparse polynomial families; further families and counterexamples to proposed proof steps; the Newton value equation'
  description: >-
    This entry states 13 theorems that the long record for Erdős problem #1041 states in sections 7 (collinear roots and two sparse polynomial families), 8 (further families and counterexamples to proposed proof steps), 9 (the Newton value equation) and 10 (arguments, not moduli): the theorem “a consequence of three moment identities” (section 7.2), as primitiveInterior_exists_two_tailEnergy_lt_one; the theorem “a quintic with two missing coefficients” (section 7.2), as primitive_quintic_two_tail, primitive_quintic_two_tail_of_polynomial, tail_le_one_and_eq_iff_of_leading_zero, tail_norm_of_leading_zero and two_tails_closedDisc_of_ne_zero; the theorem “a contained radial segment for a cubic” (section 7.3), as cubic_has_safe_root_spoke; the theorem “a mean bound for critical values”, as critical_value_three_budgets and critical_value_three_budgets_sharp; the lemma “reflected-derivative bound”, as reflected_critical_value; the theorem “value equation” (section 9), as newton_real_value_whole; the corollary “ray separation” (section 9), as newton_real_endpoint_whole; the theorem “ray-collision locus” (section 10), as translated_samePositiveRay_parameterization.

    12 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 1 is derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    A degree-seven counterexample due to ani, formalised in this corpus, refutes the total-variation formulation of Erdős problem #1041; the theorems in this entry keep their stated hypotheses.
