version: v0.4
project:
  name: 'Erdős #249, note sections 1 to 4: a basis and all its relations; bounded residues and rationality; tail differences and finite residue tests'
  description: >-
    This entry states 9 theorems that only the short note for Erdős problem #249 states, in sections 1 (a basis and all its relations), 2 (bounded residues and rationality), 3 (tail differences and finite residue tests) and 4 (information that does not force the gap): the corollary “Periodic coefficients” (section 1.2), as periodic_freezing_integer_affine; the theorem “Residue series and dyadic observables” (section 2), as short_note_residue_theorem; the lemma “An isolated nonzero coefficient between long zero blocks” (section 2), as bounded_isolated_pulse; the theorem “Propagation of one nonintegral tail difference” (section 3.1), as fullDepth_amplification; the theorem “A lower bound for the rank-one quotients” (section 4), as rankOneSubrankQuotient_one_five_sub_theta_two_lt_one_div_fifteen, rankOne_denominator_pos, rankOneSubrankQuotient_eq_one_five_iff, rankOneSubrankQuotient_sub_theta_two_gt_twentyOne_div_threeTwenty and positive_direct_sum_sub_theta_two_gt_twentyOne_div_threeTwenty.

    3 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 1 is derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #249 remains open, and no theorem in this entry decides it.
