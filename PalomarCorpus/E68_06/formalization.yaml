version: v0.4
project:
  name: 'Erdős #68, the adjacent unit carry window, channel radius and common denominator growth families'
  description: >-
    This entry states 16 theorems of the adjacent unit carry window, channel radius, common denominator growth and companion orbit boundary developments of the Lean formalisation of Erdős problem #68, to which no paper statement is bound. consecutive_unit_carries_iff_positive_offset_le_den: For `m ≥ 3`, the carries at `m` and at `m + 1` are both equal to `1` if and only if `0 < Ω m` and `Ω m ≤ D m`; a pair of consecutive unit carries is therefore exactly the membership of one integer in a half open window of width `D m`. twoStep_den_mul_transitionNormalizers: For `m ≥ 3`, the natural number identity `(predecessorScaled (m + 2)).den * G (m + 1) * G m = (predecessorScaled m).den * (m!. adjacentUnitCarryWindowDen_eq_twoStep_den: For `m ≥ 3`, the window denominator satisfies `D m = (predecessorScaled (m + 2)).den * G (m + 1) * G m` as an integer, the integer form of the preceding telescope. adjacentUnitCarryWindowOffset_eq_twoStep_factorization: For `m ≥ 3`, the offset factors exactly as `Ω m = predecessorNumerator (m + 2) * G (m + 1) * G m + D m * ((m + 1) * b m + b (m + 1) - (m + 2))`; when both carries equal `1` the bracket vanishes, the common normaliser cancels against the telescoped denominator, and the whole window reduces to `0 < predecessorNumerator (m + 2) ≤ (predecessorScaled (m + 2)).den`, an inequality that every reduced gap in `(0, 1]` already satisfies, so this window by itself excludes no pair of consecutive unit carries. square_subsequence_radius_three_halves_lower: If `t ≥ 2^32`, the natural number `M` is positive and divisible by `channelLCM (2 * t^2)`, and `M < (R + 1)!. no_eventual_square_subsequence_three_halves_upper: For natural number sequences `M` and `R` satisfying, at every `t ≥ 2^32`, positivity of `M t`, divisibility of `M t` by `channelLCM (2 * t^2)` and `M t < (R t + 1)!. not_isLittleO_square_subsequence_radius: Under the same hypotheses imposed at every `t ≥ 4096`, the real valued sequence `R t + 1` is not little o of `t^3` along the filter at infinity, both sides being natural number values cast to the reals. square_subsequence_radius_cubic_lower: If `t ≥ 4096`, `M` is positive and divisible by `channelLCM (2 * t^2)`, and `M < (R + 1)!. no_eventual_square_subsequence_cubic_upper: For natural number sequences satisfying the same hypotheses at every `t ≥ 4096`, there is no threshold `T` beyond which `8 * (R t + 1) ≤ t^3`. sharp_radius_satisfies_square_log_constraint: Boundary statement about the finite logarithmic constraint itself: for `t ≥ 4` and `R` with `9 * (R + 1) = 16 * t^3`, one has `2 * t * (u * log u - u - log 2) < (R + 1) * log (R + 1) + (2 * t + 1).choose 3 * log (2 * t^2)`, where `u = 2 * t^2 + 1 - 2 * t` is formed in the natural numbers and then cast to the reals; the constraint is satisfied at radius `(16/9) * t^3`, so it forces no lower bound at that constant by itself, and it bounds no support radius. common_denominator_growth: The lower limit of `log (channelLCM N) / (N * √N * log N)` is at least `2√2/3`, where `channelLCM N` is the least common multiple of `n!. asymptotic_radius_constant_liminf: The companion radius-constant bound in the same literal extended real form: if a channel multiple sequence `M` and a radius sequence `R` eventually satisfy `0 < M t`, `channelLCM (2 * t^2) ∣ M t` and `M t < (R t + 1)!. companionOrbitBoundary_strictSuccessorCarry: The strict successor carry boundary, in four exact conjuncts: `S` fails to be irrational if and only if the carry equals `1` for all sufficiently large `m`; `S` is irrational if and only if the carry differs from `1` for cofinally many `m`; at every `m ≥ 3` the carry equals `1` if and only if `m` divides `strictFacTopRat (H m) m`; and `S` is irrational if and only if that divisibility fails cofinally. companionOrbitBoundary_genericShift: At an arbitrary real base point `x`, two exact criteria for the shifted number `x + ∑_{n ≥ 2} 1/n!`: it fails to be irrational if and only if the canonical factorial digits of `x` are eventually equal to the integer `m - 2`, and equally if and only if `⌊m!. companionOrbitBoundary_factorialGapSeries: The companion orbit boundary for the series itself: `S` fails to be irrational if and only if `⌊m!. tsum_unitFactTerm_eq_exp_one_sub_two: Supporting evaluation for the companion decomposition: the sum of the anchored unit factorial terms equals `exp 1 - 2`, which is the identity making `C + (e - 2) = S`.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #68 remains open, and no theorem in this entry decides it.
