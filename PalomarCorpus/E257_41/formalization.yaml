version: v0.4
project:
  name: 'Erdős #257, the fair coding, finite period noncollapse and four ninths repair windows families'
  description: >-
    This entry states 13 theorems of the fair coding, finite period noncollapse, four ninths repair windows, general repair criterion, literal weighted cover and positive skip equivalence developments of the Lean formalisation of Erdős problem #257, to which no paper statement is bound. fairCoding_pushforward_eq_volume_restrict: The pushforward of the fair product measure on binary digit strings along the Mersenne coding map is exactly Lebesgue measure restricted to the base two Mersenne achievement set. measurePreserving_fairCoding: The Mersenne coding map is measure preserving from the fair product measure on binary digit strings to Lebesgue measure restricted to the base two Mersenne achievement set. fairCoding_rational_values_null: The set of binary digit strings whose Mersenne coded value is rational has fair product measure 0. finite_period_noncollapse_rat_den: For every finite nonempty set F of exponents with 0 not in F and every integer base b at least 2, the base b is coprime to the reduced denominator of the finite Erdős sum, and the multiplicative order of b modulo that reduced denominator is exactly the least common multiple of F. exists_repair_in_sqrt_window: Supporting lemma: a sequence Q of natural numbers with Q at N at most the sum of 2 times the real square root of N and 4 at every N cannot strictly increase throughout a window of length 2 times the integer square root of K plus 12, so for every K there is an N with K at most N, N below K plus 2 times the integer square root of K plus 12, and Q at N+1 at most Q at N. four_ninths_mem_iff_repairCofinal: Four ninths belongs to the base two Mersenne achievement set if and only if the cofinal one step repair condition holds for four ninths. four_ninths_mem_iff_repair_sqrt_windows: Four ninths belongs to the base two Mersenne achievement set if and only if, for every K, some N with K at most N and N below K plus 2 times the integer square root of K plus 12 satisfies the one step repair condition. four_ninths_not_mem_of_strict_sqrt_window: Exclusion criterion: if there is a K for which the greedy defect of four ninths strictly increases at every N with K at most N and N below K plus 2 times the integer square root of K plus 12, then four ninths does not belong to the base two Mersenne achievement set. mem_iff_greedyBinaryDefect_cofinal_repairs: For every nonnegative real x, membership of x in the base two Mersenne achievement set is equivalent to cofinal non increase of its greedy defect, that is to the condition that for every K there is an N at least K with the defect at N+1 at most the defect at N. mem_iff_greedyBinaryDefect_sqrt_windows: For every nonnegative real x, membership of x in the base two Mersenne achievement set is equivalent to the same non increase occurring at some N inside every window from K up to K plus 2 times the integer square root of K plus 12. exists_weighted_not_strengthened_host: There is an infinite set A of positive exponents with 0 not in A that has finite prime part weighted mass at base 2, has divergent reciprocal mass, admits no strengthened positive cover, admits no logarithmic budget cover at all, and all of whose infinite subsets have irrational support series at every integer base at least 2. exists_weighted_obstruction_with_mixed_heredity: There is an infinite set A of positive exponents with 0 not in A that has finite prime part weighted mass at base 2, admits no logarithmic budget cover, and yet can be combined with an arbitrary strengthened positive cover host V so that every infinite subset of the union of A and V has irrational support series at every integer base at least 2. greedyMersenneRemainderRat_half_pos: Every finite rational greedy remainder of the target one half is strictly positive, so no finite greedy prefix represents one half exactly.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #257 remains open, and no theorem in this entry decides it.
