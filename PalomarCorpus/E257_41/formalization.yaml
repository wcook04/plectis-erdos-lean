version: v0.4
project:
  name: 'Erdős #257, record section 6.5: obstructions and countermodels'
  description: >-
    This entry states 15 theorems that the long record for Erdős problem #257 states in section 6.5 (obstructions and countermodels): the theorem “A bounded model of the doubling-or-return alternative” (section 6.5), as paper_bounded_double_or_recycle_countermodel and paper_exists_seeded_bounded_double_or_recycle_model; the theorem “Doubling or returning to an earlier depth” (section 6.5), as paper_finite_row_value_ne_half, paper_exact_row_double_or_recycle and paper_exact_row_example_six_and_eleven; the proposition “A sufficient fractional-mass bound need not hold” (section 6.5), as paper_fractional_mass_bound_not_necessary and paper_fractional_mass_bound_suffices_for_sharp_capacity; the theorem “The returning endpoint need not be larger” (section 6.5), as paper_skipped_core_recycling_witness_bounded, paper_returning_endpoint_may_fail_to_grow, paper_protected_row_crossing_beyond_cutoff and paper_protected_row_endpoint_growth; the theorem “Uniqueness at a critical crossing” (section 6.5), as paper_critical_crossing_support_is_greedy_prefix; the theorem “Vanishing of the specified linear-channel determinant” (section 6.5), as paper_relationInvariant_channels_det_eq_zero and paper_relationInvariant_channels_rank_le_one; the theorem “Excluding the cell with value minus three” (section 6.5), as paper_cofiniteRightTail_ne_zero_centeredEndpoint.

    11 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 4 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #257 remains open, and no theorem in this entry decides it.
