version: v0.4
project:
  name: 'Erdős #257, the rational membership, rational tail rigidity and reciprocal support families'
  description: >-
    This entry states 14 theorems of the rational membership, rational tail rigidity, reciprocal support, scaled greedy trap and terminal scaled vanishing developments of the Lean formalisation of Erdős problem #257, to which no paper statement is bound. greedyMersenneSkippedSupport_infinite_iff_cofinal_skips: For every real x, the set of positive ranks skipped by the greedy Mersenne rule on x is infinite if and only if for every K there is an n at least K at which the weight at n+1 exceeds the greedy remainder after rank n. infinite_greedyMersenneSkippedSupport_of_rat_mem: If a rational q belongs to the base two Mersenne achievement set, then the greedy Mersenne rule on q skips infinitely many positive ranks. rat_mem_mersenneAchievementSet_iff_greedySkippedSupport_infinite: For every nonnegative rational q, membership of q in the base two Mersenne achievement set is equivalent to the greedy Mersenne rule on q skipping infinitely many positive ranks. rat_mem_mersenneAchievementSet_iff_cofinal_greedy_skips: For every nonnegative rational q, membership of q in the base two Mersenne achievement set is equivalent to the greedy rule skipping at arbitrarily late ranks, that is to the condition that for every K some n at least K has the weight at n+1 exceeding the greedy remainder after rank n. supportCoeffZeroWindow_length_le_eps_logb_add: Necessary condition under rationality: if A contains a positive element, v is positive, and the base two support series of A equals p divided by 2 to the power c times v, then for every positive epsilon there is a nonnegative constant B such that every zero window of the divisor incidence coefficients beginning at c+N has length at most B plus epsilon times the base two logarithm of N+1. one_div_oddOrder_le_reciprocalMass_of_support_fraction: Necessary condition under rationality: if A contains a positive element, its reciprocal support terms are summable, v is odd and greater than 1, the natural truncation of p is coprime to v, and the base two support series of A equals p divided by 2 to the power c times v, then the reciprocal mass of A is at least the reciprocal of the multiplicative order of 2 modulo v. irrational_supportPowerSeries_of_summable_reciprocal: Principal theorem of this entry: for every integer base b at least 2 and every infinite set A of natural numbers whose reciprocal support terms are summable, the series with terms 1 divided by b to the power a minus 1, summed over a in A, is irrational. scaledGreedyRemainder_tendsto_atTop_of_not_mem: If x is nonnegative and does not belong to the base two Mersenne achievement set, then its scaled greedy remainder tends to infinity. mem_mersenneAchievementSet_iff_scaledRemainder_cofinallyBounded: For every nonnegative real x, membership in the base two Mersenne achievement set is equivalent to the existence of one bounded cofinal subsequence of the scaled greedy remainder. mersenneAchievementSet_eq_scaledGreedyTrap: The base two Mersenne achievement set is exactly the set of nonnegative reals whose scaled greedy remainder stays strictly below the universal barrier 2 at every scale. rat_mem_mersenneAchievementSet_iff_scaledLowerBranchCofinally: For every nonnegative rational q, membership in the base two Mersenne achievement set is equivalent to cofinal crossing of the moving lower separatrix, that is to twice the scaled greedy remainder falling strictly below the rescaled Mersenne weight at the next rank, at arbitrarily late scales. one_div_twentyOne_mem_iff_scaledLowerBranchCofinally: The instance of the rational lower separatrix criterion at the target one over twenty one: membership of one over twenty one in the base two Mersenne achievement set is equivalent to cofinal crossing of the moving lower separatrix for that target. one_div_twentyOne_mem_iff_scaledRemainder_cofinallyBounded: The instance of the cofinal boundedness criterion at the target one over twenty one: membership of one over twenty one in the base two Mersenne achievement set is equivalent to the scaled greedy remainder for that target having one bounded cofinal subsequence. terminalScaledVanishing_completeCounterexample: Conditional on a terminal scaled vanishing sequence existing, there is an infinite set A of natural numbers whose base two series with terms 1 divided by 2 to the power a minus 1 equals exactly one half, and the universal irrationality assertion of the parent problem is therefore false.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #257 remains open, and no theorem in this entry decides it.
