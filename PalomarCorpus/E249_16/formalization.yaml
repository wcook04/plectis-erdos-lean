version: v0.4
project:
  name: 'Erdős #249, record section 6.4: further exact identities (part 3 of 3)'
  description: >-
    This entry states 29 theorems that the long record for Erdős problem #249 states in section 6.4 (further exact identities): the proposition “Independence of the retained dyadic family” (section 6.4), as canonical_family_basis_through_level, canonical_level_zero_channels, card_canonical_dyadic_index, finrank_throughLevel_zero_eq_one and linearIndependent_canonical_dyadic_family; the proposition “The exact range of the stated Farey-gap inequality” (section 6.4), as farey_window_1_240_exact_range and farey_window_1_240_range_magnitude; the proposition “The resulting denominator exclusion” (section 6.4), as totient_series_ne_int_div_of_small_denominator and totient_series_ne_reduced_fraction_of_small_denominator; the proposition “Two general irrationality criteria” (section 6.4), as one_div_den_mul_den_le_abs_sub, irrational_of_basePower_dilation, irrational_of_den_mul_error_tendsto_zero, irrational_of_dirichlet_gap, one_div_den_mul_den_le_abs_diff and basePower_dilation_not_universal; the proposition “A general rational gap bound” (section 6.4), as den_lower_bound_of_positive_error, denominator_bound_tendsto_atTop_iff, dyadic_prefix_denominator_bound_vacuous, irrational_of_den_mul_error_product_tendsto_zero, rational_gap_lower_bound, dyadic_prefix_den_dvd, dyadic_prefix_tail_le and totientTail_le_add_two; the proposition “A coprime-pair expression for S” (section 6.4), as card_visible_antidiagonal, positive_antidiagonal_one, totient_zero_eq_zero, tsum_pos_coprime_pairs_eq_series_sub_half, tsum_pos_coprime_pairs_product_form and visible_antidiagonal_one.

    26 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 3 are derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #249 remains open, and no theorem in this entry decides it.
