version: v0.4
project:
  name: 'Erdős #249, record sections 6.6.1 to 6.6.5: log-concavity of the Möbius-weighted series; integer recurrences and rational binary series; rational approximation with a squared-Mersenne remainder'
  description: >-
    This entry states 33 theorems that the long record for Erdős problem #249 states in sections 6.6.1 (log-concavity of the Möbius-weighted series), 6.6.2 (integer recurrences and rational binary series), 6.6.3 (rational approximation with a squared-Mersenne remainder), 6.6.4 (divisor terms and their complement) and 6.6.5 (a numerator polynomial with explicit positive coefficients): the theorem “The values at exponents one and two” (section 6.6.1), as mobiusMersenneTheta_one_and_two; the theorem “The first two summands give a positive Hankel gap” (section 6.6.1), as twoAtom_hankel_gap and twoAtom_strict_logConcave; the theorem “Strict log-concavity for all integer r≥1” (section 6.6.1), as theta_hankel_det_neg, theta_hankel_two_neg and theta_strict_logConcave; the proposition “Uniqueness under the growth condition” (section 6.6.2), as doubling_tempered_sequence_eq_zero; the proposition “An exact rational approximation formula” (section 6.6.3), as totientSeries_eq_half_add_moebius_sq, totientSeries_pnat_form, tailDifference_eq_coefficient_mul_series and tailDifference_sub_rationalApproximation; the proposition “A geometric tail bound” (section 6.6.3), as abs_mobiusSquareTail_le_paper, abs_moebius_cast_le_one, mersenne_geometric_shift and tsum_quarter_geometric; the proposition “The sum over divisor indices” (section 6.6.4), as squarefreeKernel_eq_prod_primeFactors, sum_divisorIndices_mobius, sum_divisors_moebius_div_eq_totient_div and sum_divisorIndices_radical_form; the proposition “The divisor sum and its complement” (section 6.6.4), as complementSummand_eq_phaseTerm, divisorIndex_endpoint_behaviour, totientDifference_eq_divisorPart_add_complement and totient_eq_mobius_divisor_sum; the theorem “Doubling the full totient difference” (section 6.6.4), as totientDifference_doubling_seam, totient_two_mul_even and totient_two_mul_odd; the proposition “A doubling identity for two portions of the sum” (section 6.6.4), as complementSummand_low_double_echo; the theorem “Positive coefficients of the numerator polynomial” (section 6.6.5), as paperNumerator_coeff_eq_gcd_divisor_sum, paperNumerator_coeff_eq_zero, paperNumerator_coeff_pos, paperNumerator_eq_gcdWordForm and paperNumeratorPolynomial_eq; the corollary labelled statement:sha256:1aba8ef26e7606ffeb744eeb5281561279d804bd6a828bd921e42781105432b2 (section 6.6.5), as mersenne_dvd_of_dvd.

    33 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #249 remains open, and no theorem in this entry decides it.
