version: v0.4
project:
  name: 'Erdős problem #269 at three primes: the reciprocal running-LCM kernel has nonsingular minors of every order and no finite separated representation, with the exact affine shell orbit of the {2,3,5} series and a window criterion equivalent to its irrationality'
  description: >-
    Erdős problem 269 asks whether the reciprocal sum of running least common multiples is irrational. For a finite set P of at least two primes, let L(x) be the least common multiple of the P-smooth integers not exceeding x, and let R_P be the sum of 1/L(u) over the P-smooth integers u. Erdős posed the question in Erdős and Graham 1980 and again in Erdős 1988, and the Erdős Problems catalogue records the finite-support case as open. This entry collects results at three prime generators and at the prime set {2,3,5}, with independent definitions of the literal series, shell orbit and residue windows. The parent problem remains open, and nothing here proves irrationality or transcendence of a three-prime value.

    The principal result is the arbitrary-order rank theorem for the running-LCM kernel. Write H(x) for the product of the largest powers of p, q and r not exceeding x, and K(i,j,k) for 1/H(p^i q^j r^k). The theorem threePrimeKernel_infiniteRank_and_noFiniteSeparation states that for primes p, q, r with p different from r and q different from r, and with no hypothesis relating p and q, every order n admits injective index families I and J whose minor det K(I a, J b, k) is nonzero simultaneously for every value k of the third exponent, and that for no natural number d is there a representation K(i,j,k) = sum over l < d of f_l(i) G_l(j,k) with rational-valued f and G. The companion exists_uniform_nonsingular_threePrimeKernel_minor proves the minor clause for arbitrary generators greater than 1 whose logarithmic ratios log_r p and log_r q are irrational. One threshold carry survives the removal of all row and column factors and supplies the minors.

    With two primes the kernel factors as a function of one exponent times a function of the other, and the value is transcendental by the Hecke-Mahler theory of Loxton and van der Poorten 1977 in the form of Bugeaud and Laurent 2023. Steve Fan posted that two-prime factorisation, its Hecke-Mahler reduction and the transcendence conclusion on the erdosproblems.com discussion page for problem 269 on 26 June 2026, together with the running least common multiple factorisation identity for an arbitrary finite prime set, and recorded there that the argument does not appear to extend to three or more primes. The three-prime case of that identity, formalised here as smoothPrefixLcm_eq_threePrimeHeight, is Fan's and is not claimed as new. The rank theorems are the addition: they turn that observed failure into a proved exclusion of exact finite separated representations with rational-valued factors, with the nonsingular minors of every order excluding any finite separation. Cell constancy, the jump count three times the number of powers taken in each channel, the height-fibre normal form, a quadratic shell bound and the minor -1/15 complete the family.

    A second family treats the literal {2,3,5} series. Let s_a be the sum of 1/H(x) over the smooth x in the dyadic shell from 2^a to 2^(a+1), let T_a be the sum of the shell masses from index a onward, and let X_a = (H(2^a)/2) T_a, so T_0 is R_P at {2,3,5}. The theorem actual_dyadicShellOrbit_recurrence_and_escape proves that the shell masses are summable, that X_(a+1) = b_a X_a - m_a holds at every scale with the actual radix b_a in {2, 6, 10, 30} and the actual ordered digit m_a, and that either some X_a equals an integer or the orbit returns cofinally to distance at least 1/31 from every integer. The integral branch survives, so the dichotomy supplies no irrationality, transcendence, equidistribution or density conclusion.

    A third family identifies the target in window coordinates. The theorem trueNormalizedState_window gives the exact identity X_(lo+len) = W X_lo - F, with W the product of the radices over the window and F the accumulated forcing of the digits. Writing lpr_W for the representative of a residue class in the range 1 to W, the actual cofinal local-window escape asserts that for every positive B coprime to 30 and every starting index there is a window with lpr_W(-B F) exceeding 90 B (lo+len+1)^2. The theorem actualCofinalLocalWindowEscape_iff_irrational_value proves that this holds if and only if T_0 is irrational. That is an exact reformulation of the problem and decides nothing about the value. A companion extends the forward implication to every short bound dominated by c(B)(n+1)^2, and a bridge turns a rational value into a positive integer carry obeying the actual recurrence.

    Three further families record arithmetic that a remaining argument must use: prime-power boundary clearing with the all-scale lattice and the congruence of two scales modulo 1 that a rational value forces; the pinning identity, an exact mixed-radix telescope with its remainder displayed, upward closure of an integral state and shrinking-window rigidity for the literal orbit; and the weighted block-defect identity, residue-digit and coboundary splitting, two-anchor perturbation extinction, two conditional carry-lift no-go theorems and the consumer of the escape proposition. Every input of that last family is a hypothesis, and none is produced for the actual orbit.

    The audience works on irrationality and transcendence of lacunary and Mahler-type series, on reciprocal-sum irrationality questions from the Erdős catalogue, and on rank and separability of arithmetic kernels indexed by exponent lattices. For that audience the rank theorem answers a concrete structural question, since the mechanism that decides the two-prime case has no finite-rank analogue at three generators. Priority for the rank statements is unassessed beyond the recorded comparison with Fan's comment, and none is claimed here.

    Four questions stay open. Irrationality of the three-prime value is the parent question. Nonintegrality of B X_a for every a at least 1 and every positive B coprime to 30 is its pointwise form, equivalent to it through the clearing identity and the bridge; that equivalence is argued in the accompanying note and is not among the compared declarations. The actual cofinal local-window escape is proved equivalent to the parent question here. A two-dimensional Mahler or Hecke-Mahler representation of the {2,3,5} sum is untouched by these declarations.

    The exact-denominator family retains a hypothetical reduced value N/(2^u 3^v 5^w B), with B positive and coprime to 30. It identifies the rational normalized tail with the actual tail, gives its reduced denominator before and after multiplication by B, and proves clearing at scale a equivalent to the three printed power thresholds. The fixed-start residue family gives the eventual ceiling formula and the limiting residue proportion for every positive B and every starting scale. When B X_lo is integral, the residue eventually equals B X_(lo+h); that surviving case is not removed. These statements sharpen the arithmetic description without deciding irrationality.
