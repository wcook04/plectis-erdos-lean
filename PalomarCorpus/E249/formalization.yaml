version: v0.4
project:
  name: 'Formal reductions for Erdős problem #249'
  description: >-
    A Comparator-checkable restatement of the paper-linked Lean theorems that
    actually have proof coverage for Erdős problem #249. The compared
    surface includes 53 independently stated declarations
    (actualLcmTailOrbit_eq_scaled_totientSeries_sub_prefix, irrational_totientSeries_iff_actualLcmOrbitNonintegralitySupply, binaryCyclotomicAnchoredKillSupply_iff_irrational, binaryCyclotomicLayer_unboundedPrimeDivisorSupply, exists_clean_binaryCyclotomicAnchor, exists_unbounded_binaryCyclotomicSupport_with_periodLock_of_not_irrational, fullMersenneBlockResidue_succ, fullMersenneCanonicalBasepointResidueGapSupply_iff_irrational, fullMersenneCenteredResidueGapSupply_of_canonicalBasepoint, carryShift_dvd_iff_tailDiff_mem_int, finrank_canonicalCarryKernel_ge_of_certificate, not_irrational_binaryCoeffSeries_iff_exists_temperedBinaryOrbit, and 41 more). The parent problem remains open. This repository
    is the substantive formalization, not a thin wrapper around another public
    repo. This entry is one of eight problem-level Palomar configurations at
    the same repository and commit.
  authors:
  - Will Cook
  license: Apache-2.0
  responsible_maintainers:
  - Will Cook
