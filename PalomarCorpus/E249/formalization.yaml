version: v0.4
project:
  name: 'Erdős problem #249: rationality of the binary totient series would force one integral carry with unbounded dyadic section rank and a uniform eventual period, with the exact all-base totient kernel basis and unconditional irrationality of every residue-class totient series at modulus at least three'
  description: >-
    Erdős and Graham asked whether the binary totient series S = sum over n at least 1 of phi(n)/2^n is irrational, where phi is Euler's totient function (Erdős and Graham 1980, page 61). The problem is open and nothing here settles it. The audience is the irrationality theory of series with classical arithmetic-function coefficients, the Lambert series circle Erdős worked in from 1948, and the theory of k-regular sequences of Allouche and Shallit. The companion series with sigma in place of phi is transcendental by Nesterenko 1996 at q = 1/2, and no analogue of that route is known for phi.

    The principal theorem is a rigidity consequence of rationality. Call u a tempered integral carry for phi with multiplier v when u(N+1) = 2 u(N) - v phi(N+1) for every N and u(N)/2^N tends to 0. If S fails to be irrational then such a pair exists with v > 0, and the same u satisfies two conditions at once: for every depth e the rational span of its dyadic sections n ↦ u(2^j n + r) through depth e has rank at least 2^e - 1, and u is eventually periodic modulo v with one fixed positive period. No theorem here turns eventual periodicity modulo v into a finite rational rank, so no contradiction and no irrationality statement follows.

    Two unconditional families concern the totient itself. The first fixes its k-kernel at every base: for k at least 2 and e at least 1, the sections n ↦ phi(k^j n + r) with j at most e and r < k^j span a rational space of dimension exactly k^e + 1, the two zero-residue channels together with the residues not divisible by k index a basis, and the relation module has dimension exactly k + k^2 + ... + k^(e-1). The dyadic case is stated separately with its explicit odd-core basis. Over the integers, displayed_integral_normal_form shows that the canonical channels form a Z-basis of the Z-span of all sections through depth e, that the integer relation module has a Z-basis indexed by the omitted channels whose vectors are two-term reductions, each omitted channel being a natural multiple of one canonical channel, and that this module has rank k + k^2 + ... + k^(e-1). Coons proved in 2010 that phi is not k-regular, equivalently that the full kernel span is infinite dimensional; the exact bounded-depth dimension, canonical index and relation-module dimension are what is added. Martin's 2006 theorem on simultaneous inequalities among totient values already implies the independence input, proved here by an independent finite-determinant argument whose evaluation minor is diagonal modulo one auxiliary prime. Both theorems concern the coefficient sequence and say nothing about the value of S.

    The second proves irrationality for infinitely many explicit constants. For every m at least 3 the least-residue series A_m = sum over n at least 1 of (phi(n) mod m)/2^n is irrational, and the excluded cases are rational, A_1 = 0 and A_2 = 3/4, a fact not formalised here. More generally, for m at least 2 and any integer-valued letter map f vanishing at residue 0 and nonzero at some residue r < m with r + 1 coprime to m, the series sum f(phi(n) mod m)/2^n is irrational; at resolution 2^k every even residue qualifies. The mechanism is the quantitative isolated-pulse separation of Erdős 1948 on Lambert series, with the pulses supplied by the Chinese remainder theorem and Dirichlet's theorem, and Wong proved the least-residue case where the denominator base and the modulus coincide. The object is the reduced word phi(n) mod m, so S is left where it was.

    Four exact reformulations locate the remaining obligation. Write R_N for the binary totient tail, the sum over j at least 1 of phi(N+j)/2^j. A window certificate asks that the signed binary discrepancy of two length-L totient windows separated by h lie more than N + h + L + 2 from both ends of its range modulo 2^L; some L satisfies it exactly when R_(N+h) - R_N is not an integer. One certificate at step d amplifies, so every sufficiently late pair of consecutive multipliers carries one whose window equals its shift, and the supply of those for all steps and all basepoints is equivalent to irrationality of S. The canonical Mersenne form pins the basepoint: S is irrational if and only if for every c and every odd v > 0 some positive multiple H of phi(v) puts the residue of the negated totient block modulo (2^H - 1)/v further than c + H + 1 from both endpoints. The LCM diagonal orbit and an anchored cyclotomic supply give two further equivalent forms. These are exact changes of coordinate, and none is progress on the value of S.

    The remaining families close named routes. Unconditionally, every ray of multiples of a period h carries primes p dividing the binary cyclotomic layer |Phi_(hq)(2)| for a prime q, hq dividing p - 1, and p - 1 arbitrarily large; a companion theorem shows that if S is not irrational then one period h carries that unbounded prime support while every tail difference R_(N+h) - R_N beyond one threshold is an integer, so prime support alone cannot force the annihilation that irrationality would need. For every basepoint c and every fixed quotient k the pure dyadic endpoint error is not eventually affine in the height; this excludes one fixed affine endpoint-error mode and does not exclude every mechanism by which S could be rational. The termwise dyadic window is vacuous: 2^t dividing phi(N+t) already forces 2^t at most phi(N+t), which is below N + t, so the compared bound 2^t at most v(N+t+2) holds for every v at least 1. Two rigidity theorems retire classes of integer-valued control sequences: one exact prime law with an o(n) error forces g = phi, as do the exact even doubling laws with eventual congruence modulo every integer. With Theta_2 = sum over d at least 1 of mu(d)/(2^d - 1)^2 = S - 1/2, an identity recorded by Fan in 2026, every positive rank-one strict-subrank quotient Q(e, Y) on e at least 1 and Y at least 4 exceeds Theta_2 by more than 21/320; the minimiser (1, 5) is unique, the floor survives finite positive mixtures, and Q(e, Y) = p/q forces |q Theta_2 - p| > 21q/320. The ladder Theta_r is strictly log-concave at every rung r at least 1, so it admits no nonnegative Stieltjes representation. Two finite exclusions carry explicit bounds: no rational of denominator at most 79639646646701375323355774875831053 equals S, and one exact power of two dividing the totient prefix excludes a rectangle of denominators 2^c v with v odd. Neither is progress towards irrationality.

    Attributions above follow the public record. For the exact rank formula and index, the relation-module dimension, the ladder's log-concavity and the two rigidity theorems, no antecedent was located, and those searches were not exhaustive. The rank-one floor family carries no prior-art audit at all. Novelty for all of them is unknown.
