version: v0.4
project:
  name: 'Erdős #249, record sections 2 to 5: rational comparison sequences; series identities and finite exclusions'
  description: >-
    This entry states 18 theorems that the long record for Erdős problem #249 states in sections 2 (rational comparison sequences) and 5 (series identities and finite exclusions): the proposition “Four limits of particular linear constructions” (section 2.3), as b6_synthetic_shift_combinations_same_form, b6_mobiusMersenneTheta_two_eq_totientSeries_sub_half, b6_mobius_incidence_unimodular_and_injective, b6_retained_dyadic_sections_independent, b6_mobiusMersennePrefix_eq_icc_sum and b6_mobiusMersenne_rung_estimates; the proposition “The coefficient properties of the rational example” (section 2.3), as exists_rational_parityComparison and parityComparisonProperties_do_not_imply_irrational; the proposition “Digit-shift identity” (section 5.2), as two_pow_mul_totient_series_eq; the lemma “Farey gap, fully general” (section 5.3), as farey_gap; the proposition “The Farey certificate at K=240” (section 5.3), as totient_carry_residue_window_1_240_eq and gap_check_window_1_240_le_79639646646701375323355774875831053; the proposition “Fair-coin coprimality form” (section 5.4), as totient_series_eq_half_add_visible_coprime_pairs and tsum_visible_coprime_pairs_eq_totient_series; the proposition “The gcd-layer normalisation” (section 5.4), as tsum_pos_pair_both_dvd_half_eq_inv_mersenne_sq and tsum_gcd_layer_pos_coprime_half_eq_one; the theorem “Denominator exclusion for the coprimality-probability form” (section 5.4), as tsum_visible_coprime_pairs_ne_int_div_of_den_le_39819823323350687661677887437915526; the theorem “Denominator exclusion for the Möbius-square form” (section 5.4), as tsum_moebius_div_two_pow_sub_one_sq_ne_int_div_of_den_le_39819823323350687661677887437915526.

    17 of the restated theorems are proved by a direct application of the source declaration, which certifies that the restated statement is definitionally the source statement; 1 is derived from the source declaration by a short tactic proof, which certifies implication.

    Each theorem is restated against Mathlib alone, with the definitions its statement uses copied into the Challenge, and its documentation names the source declaration and, where there is one, the paper statement. The proofs come from the Lean development in this repository; the papers and their reasoning records are public at https://github.com/wcook04/plectis-erdos.

    Erdős problem #249 remains open, and no theorem in this entry decides it.
