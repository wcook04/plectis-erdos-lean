version: v0.4
project:
  name: 'Carry and divisor-channel criteria for the factorial-minus-one reciprocal series'
  description: >-
    For the reciprocal series with denominators n! - 1, the selected Lean theorems give an exact carry characterization of rationality, divisor-channel coordinates, and a finite gcd moment certificate. Companion-orbit and complementary tail criteria are included with their stated hypotheses. These structural results do not certify the paper's large computed denominator exclusions or resolve the irrationality question.

    To state them, the Challenge copies 37 declarations of the source development: factorialGapTailTerm, factorialGapTail, factorialGapSeries, adjacentDifference, channelWeight, isolatedChannelUnit, channelScalar, IsScalarTailGcd, channelBasisColumn, channelSynthesis, finiteScalarGcd, facFloor, channelNumerator, pairwiseCollisionCore, collisionCore, compConstTerm, companionConstant, projectedResidue, complementaryProjectedResidue, endpointDenominatorLcm, endpointTailNumerator, factorialBlockBase, factorialBlockBudget, factorialGapDenominator, factorialBlockIndices, factorialBlockEndpointLcm, privateQuotient, privateModulus, factorialBlockPrivateModulus, factorialBlockScale, factorialBlockTailNumerator, factorialGapPrefix, strictFacTop, factorialGapPredecessorGap, factorialGapStepCarry, factorialMoment and strictFacTopRat.
  authors:
  - Will Cook
  license: Apache-2.0
  responsible_maintainers:
  - Will Cook
