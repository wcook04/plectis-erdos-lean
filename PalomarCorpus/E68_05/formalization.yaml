version: v0.4
project:
  name: Carry and divisor-channel criteria for the factorial-minus-one reciprocal
    series
  description: For the reciprocal series with denominators n! - 1, the selected Lean
    theorems give an exact carry characterization of rationality, divisor-channel
    coordinates, and a finite gcd moment certificate. Companion-orbit and complementary
    tail criteria are included with their stated hypotheses. These structural results
    do not certify the paper's large computed denominator exclusions or resolve the
    irrationality question.
  authors:
  - Will Cook
  license: Apache-2.0
  responsible_maintainers:
  - Will Cook
