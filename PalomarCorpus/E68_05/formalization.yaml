version: v0.4
project:
  name: Finite divisor-channel gcd and carry criteria for the factorial-minus-one series
  description: For the reciprocal series with denominators n! - 1, the selected Lean theorems give integral
    divisor-channel coordinates and a finite tail-gcd certificate. For D at least 2 and a prime p with
    D/2 < p <= D, the certificate computes the gcd of all scalar channel coefficients beyond D from the
    finite interval ending at H = D(2p-1) < 2D^2. The entry also gives exact carry and companion-orbit
    rationality criteria and a sufficient complementary-tail condition with its stated cofinal hypothesis.
    These six structural statements do not select the separate three-halves LCM-growth theorem, certify
    the paper's large computed denominator exclusions, or resolve the irrationality question.
  authors:
  - Will Cook
  license: Apache-2.0
  responsible_maintainers:
  - Will Cook
