version: v0.4
project:
  name: 'Erdős #243: cancellation visibility at the first later negative error'
  description: 'A local finite-window estimate for the reciprocal-tail cocycle: if the centered error
    is nonnegative strictly between a cancellation index s and the first later negative error at t, then
    u(t) ≤ u(s+1), and u(s)u(t) ≤ R(t)|e(t)|u(s+1), where R(t) is the running maximum of u. The primitive
    cocycle identities and positive cancellation numerators are explicit hypotheses.'
