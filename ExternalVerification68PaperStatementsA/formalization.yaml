project:
  name: 'Erdős #68: independent restatements of refereed paper-linked theorems'
  description: >-
    11 theorems of the substantive development for Erdős problem #68
    restated against Mathlib alone and transported from the source declarations named
    below. The substantive formalization lives in ErdosProblems.Erdos68.CanonicalFactorialDigits, ErdosProblems.Erdos68.CompanionConstantBridge, ErdosProblems.Erdos68.ConstantOnlyMissCertificates, ErdosProblems.Erdos68.DivisorChannelBasis, ErdosProblems.Erdos68.EndpointWeightedPrivateSupport, ErdosProblems.Erdos68.FactorialChannelCertificate, ErdosProblems.Erdos68.FactorialGapPlateauCore, ErdosProblems.Erdos68.PaperCompleteDivisorCoordinates, ErdosProblems.Erdos68.PaperCompleteExisting, ErdosProblems.Erdos68.PaperCompleteMomentHorizon, ErdosProblems.Erdos68.PaperCompletePrimePole, ErdosProblems.Erdos68.PrimeUnitTranslator, ErdosProblems.Erdos68.PrimeZeroBranch in this repository and at
    public commit f436a7ec0f7bf035828a7eec37fd29ae74d17d84 of https://github.com/wcook04/plectis-erdos. This entry is a comparison
    interface over that development. 11 statements transport by direct term
    application, which certifies definitional identity with the source statement;
    0 transport through a tactic bridge, which certifies implication only. The
    parent Erdős problem remains open.
