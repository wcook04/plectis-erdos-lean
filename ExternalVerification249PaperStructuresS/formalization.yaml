project:
  name: 'Erdős #249: independent restatements of refereed paper-linked theorems'
  description: >-
    5 theorems of the substantive development for Erdős problem #249
    restated against Mathlib alone and transported from the source declarations named
    below. The substantive formalization lives in ErdosProblems.Erdos249.FiniteDilationLinearIndependent, ErdosProblems.Erdos249.FiniteDilationMixedModuli, ErdosProblems.Erdos249.PaperCompleteR7.IntegerRadixObservables, ErdosProblems.Erdos249.PaperCompleteR7.RationalIntegerRadixClassification in this repository and at
    public commit 436f55ebdafa67e4af0fff79f621c13f2ded12bf of https://github.com/wcook04/plectis-erdos. This entry is a comparison
    interface over that development. 0 statements transport by direct term
    application, which certifies definitional identity with the source statement;
    5 transport through a tactic bridge, which certifies implication only. The
    parent Erdős problem remains open.
