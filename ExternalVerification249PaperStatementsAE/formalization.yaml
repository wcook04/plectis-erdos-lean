project:
  name: 'Erdős #249: independent restatements of refereed paper-linked theorems'
  description: >-
    52 theorems of the substantive development for Erdős problem #249
    restated against Mathlib alone and transported from the source declarations named
    below. The substantive formalization lives in Erdos249257.DiagonalFreshLossBridge, Erdos249257.FullTargetPrimeAdjunctionNoGo, Erdos249257.MersenneShadowCyclotomicNoncollapse, Erdos249257.MersenneShadowDenominatorGrowth, Erdos249257.RadicalMobiusShadow, ErdosProblems.Erdos249.PaperCompleteR20.DenominatorBounds, ErdosProblems.Erdos249.PaperCompleteR20.FinitePrefixCountermodel, ErdosProblems.Erdos249.PaperCompleteR20.FinitePrefixCountermodelEndpoint, ErdosProblems.Erdos249.PaperCompleteR20.GenericTailCertificates, ErdosProblems.Erdos249.PaperCompleteR20.PeriodicIntegerAffine, ErdosProblems.Erdos249.PaperCompleteR20.SignedDyadicClearing, ErdosProblems.Erdos249.PaperCompleteR21.AffineDivisorAnnihilation, ErdosProblems.Erdos249.PaperCompleteR21.DivisorChannelSplitAndSeamDoubling, ErdosProblems.Erdos249.PaperCompleteR21.LambertDivisorTransform, ErdosProblems.Erdos249.PaperCompleteR21.PhaseEnergyAndForeignResidueProjection, ErdosProblems.Erdos249.PaperCompleteR21.PillaiGcdExpectation, ErdosProblems.Erdos249.PaperCompleteR21.SquaredMersenneDivisorIdentities, ErdosProblems.Erdos249.PaperCompleteR21.SternBrocotStoppingRecursion, ErdosProblems.Erdos249.PaperCompleteR21.TemperedOrbitAndSquaredMersenneTail, ErdosProblems.Erdos249.PaperCompleteR7.PeriodicAndPulse in this repository and at
    public commit f436a7ec0f7bf035828a7eec37fd29ae74d17d84 of https://github.com/wcook04/plectis-erdos. This entry is a comparison
    interface over that development. 47 statements transport by direct term
    application, which certifies definitional identity with the source statement;
    5 transport through a tactic bridge, which certifies implication only. The
    parent Erdős problem remains open.
