    12 theorems of the substantive development for Erdős problem #249
    restated against Mathlib alone and transported from the source declarations named
    below. The substantive formalization lives in ErdosProblems.Erdos249.PaperCompleteR21.NumeratorPolynomialAndMersenneRemainder in this repository and at
