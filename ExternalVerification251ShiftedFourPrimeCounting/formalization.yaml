project:
  name: 'Erdős #251: shifted prime-gap coincidences and a four-prime counting reduction'
  description: For each shift h ≥ 2 and integer r, an unconditional finite inequality bounds the indices
    n < N with g(n+h)-g(n)=r by an explicit separated four-prime candidate count and a large-span term.
    A second theorem proves that the displayed quadruple-sieve estimate implies density zero for those
    shifted-gap coincidences.
